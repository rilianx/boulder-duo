<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paseo por el prado</title>
<style>
html,body{margin:0;height:100%;background:#20301f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Georgia,'Times New Roman',serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#fff8e6;font-size:14px;background:rgba(40,30,20,.45);padding:6px 14px;border-radius:14px;pointer-events:none;transition:opacity 1.5s;text-align:center}
#clock{position:fixed;right:12px;top:10px;color:#fff8e6;font-size:14px;background:rgba(40,30,20,.35);padding:4px 10px;border-radius:10px;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="clock"></div>
<div id="hint">Flechas o WASD para pasear · en el celular, arrastra el dedo</div>
<script>
/* Paseo por el prado: a first look at a calm open-world game, to see whether its look is worth it. No missions:
   a girl (red braids, freckles, a straw hat with a red ribbon, a green dress) walks a meadow with her little dog.
   Seen from above and in front (3/4, "fake 3D"): everything is drawn in the order of its feet, so she goes behind
   trees and the house, with soft shadows. A breeze moves the grass, the trees, her braids and ribbon; cloud
   shadows drift by; the day slowly turns to evening and night (lit windows, fireflies) and back to morning.
   Left alone she looks around, then sits down in the grass; the dog follows her, sniffs about and sits by her. */
(() => {
'use strict';
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const TILE = 32, WW = 56 * TILE, WH = 40 * TILE;
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20241007);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;

/* ---------- the place ---------- */
const house = { x: 26 * TILE, y: 11 * TILE, w: 6 * TILE, d: 3.2 * TILE };            // x, y: the middle of its front at the ground
const pond = { x: 41 * TILE, y: 27 * TILE, rx: 5.5 * TILE, ry: 3.2 * TILE };
const pathPts = [[house.x - 8, house.y + 6], [house.x - 30, house.y + 140], [house.x + 40, house.y + 300], [house.x - 20, house.y + 470], [house.x + 30, WH + 40]];
const pathBranch = [[house.x + 20, house.y + 300], [pond.x - pond.rx * .8, pond.y - 30]];
function nearPath(x, y, w){
  const segs = []; for (let i = 0; i + 1 < pathPts.length; i++) segs.push([pathPts[i], pathPts[i + 1]]); segs.push(pathBranch);
  return segs.some(([a, b]) => { const dx = b[0] - a[0], dy = b[1] - a[1], t = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy), 0, 1); return Math.hypot(x - a[0] - dx * t, y - a[1] - dy * t) < w; });
}
const inPond = (x, y, m = 0) => ((x - pond.x) / (pond.rx + m)) ** 2 + ((y - pond.y) / (pond.ry + m)) ** 2 < 1;
const inHouse = (x, y, m = 0) => x > house.x - house.w / 2 - m && x < house.x + house.w / 2 + m && y > house.y - house.d - m && y < house.y + m;
const free = (x, y, m) => !inPond(x, y, m) && !inHouse(x, y, m + 30) && !nearPath(x, y, m + 22);
// trees, bushes, rocks: kept away from the house, the pond, the path and each other
const things = [];
const trees = [], bushes = [], rocks = [];
for (let n = 0; n < 3000 && trees.length < 64; n++) {
  const x = R() * WW, y = R() * WH, s = .85 + R() * .45;
  const edge = Math.min(x, y, WW - x, WH - y) < 5 * TILE;
  if ((!edge && R() < .3) || !free(x, y, 60) || trees.some(t => Math.hypot(t.x - x, t.y - y) < 90)) continue;
  trees.push({ kind: 'tree', x, y, s, ph: R() * TAU, hue: R() });
}
for (let n = 0; n < 600 && bushes.length < 28; n++) {
  const x = R() * WW, y = R() * WH;
  if (!free(x, y, 30) || trees.some(t => Math.hypot(t.x - x, t.y - y) < 60) || bushes.some(b => Math.hypot(b.x - x, b.y - y) < 50)) continue;
  bushes.push({ kind: 'bush', x, y, s: .8 + R() * .5, ph: R() * TAU, berries: R() < .5 });
}
for (let n = 0; n < 300 && rocks.length < 18; n++) {
  const x = R() * WW, y = R() * WH;
  if (!free(x, y, 16) || trees.some(t => Math.hypot(t.x - x, t.y - y) < 40)) continue;
  rocks.push({ kind: 'rock', x, y, s: .6 + R() * .8 });
}
// the garden fence, a mailbox and a bench by the pond
const fence = [];
for (let x = house.x - house.w / 2 - 70; x <= house.x + house.w / 2 + 70; x += 22) if (Math.abs(x - house.x) > 38) fence.push({ kind: 'post', x, y: house.y + 64 });
things.push(...trees, ...bushes, ...rocks, ...fence, { kind: 'house', x: house.x, y: house.y }, { kind: 'mailbox', x: house.x + 50, y: house.y + 84 }, { kind: 'bench', x: pond.x - 40, y: pond.y - pond.ry - 26 });
// grass tufts, flowers, reeds and lily pads (drawn swaying)
const tufts = [], flowers = [], reeds = [], pads = [];
for (let n = 0; n < 2600; n++) { const x = R() * WW, y = R() * WH; if (!inPond(x, y, 10) && !inHouse(x, y, 4) && !nearPath(x, y, 16)) tufts.push({ x, y, h: 5 + R() * 7, ph: R() * TAU, c: R() }); }
const FLOWER_COLS = ['#fff6ee', '#ffd7e8', '#f7e27a', '#c9a7f2', '#ff9f8a', '#9fd3ff'];
for (let n = 0; n < 700; n++) { const x = R() * WW, y = R() * WH; if (!inPond(x, y, 14) && !inHouse(x, y, 6) && !nearPath(x, y, 18)) flowers.push({ x, y, c: FLOWER_COLS[Math.floor(R() * FLOWER_COLS.length)], ph: R() * TAU, s: .8 + R() * .6 }); }
// a flower bed in front of the house
for (let n = 0; n < 70; n++) { const x = house.x - house.w / 2 + R() * house.w, y = house.y + 12 + R() * 40; if (Math.abs(x - house.x) > 26) flowers.push({ x, y, c: ['#ff9f8a', '#ffd7e8', '#f7e27a'][n % 3], ph: R() * TAU, s: 1.1 }); }
for (let n = 0; n < 60; n++) { const a = R() * TAU, k = .95 + R() * .12; reeds.push({ x: pond.x + Math.cos(a) * pond.rx * k, y: pond.y + Math.sin(a) * pond.ry * k, h: 14 + R() * 12, ph: R() * TAU }); }
for (let n = 0; n < 9; n++) { const a = R() * TAU, k = R() * .7; pads.push({ x: pond.x + Math.cos(a) * pond.rx * k, y: pond.y + Math.sin(a) * pond.ry * k, r: 7 + R() * 6, a: R() * TAU, bloom: R() < .4 }); }

/* ---------- the ground, painted once ---------- */
const ground = document.createElement('canvas'); ground.width = WW; ground.height = WH;
(() => {
  const c = ground.getContext('2d');
  c.fillStyle = '#86b25a'; c.fillRect(0, 0, WW, WH);
  // soft patches of lighter and darker grass, like a wash of watercolour
  for (let n = 0; n < 420; n++) {
    const x = R() * WW, y = R() * WH, r = 30 + R() * 120, gr = c.createRadialGradient(x, y, 0, x, y, r);
    const col = R() < .5 ? '154,196,98' : R() < .5 ? '110,158,72' : '170,200,104';
    gr.addColorStop(0, `rgba(${col},.35)`); gr.addColorStop(1, `rgba(${col},0)`); c.fillStyle = gr; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let n = 0; n < 9000; n++) { c.fillStyle = R() < .5 ? 'rgba(60,100,40,.18)' : 'rgba(200,230,140,.15)'; c.fillRect(R() * WW, R() * WH, 1.5, 1.5); }
  // the path: earth with soft edges and little stones
  const stroke = (pts, w, col) => { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) { const p = pts[i - 1], q = pts[i]; c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); } c.lineTo(...pts[pts.length - 1]); c.stroke(); };
  for (const [pts] of [[pathPts], [pathBranch]]) { stroke(pts, 54, 'rgba(160,130,80,.35)'); stroke(pts, 40, '#c9a874'); stroke(pts, 26, '#d4b583'); }
  for (let n = 0; n < 700; n++) { const x = R() * WW, y = R() * WH; if (nearPath(x, y, 16)) { c.fillStyle = R() < .5 ? 'rgba(120,95,60,.45)' : 'rgba(240,225,190,.5)'; c.beginPath(); c.ellipse(x, y, 1.5 + R() * 2, 1 + R(), 0, 0, TAU); c.fill(); } }
  // the pond's bank, the garden's earth
  const bank = c.createRadialGradient(pond.x, pond.y, pond.ry * .6, pond.x, pond.y, pond.rx * 1.15);
  bank.addColorStop(.7, 'rgba(110,90,60,.0)'); bank.addColorStop(.86, 'rgba(110,90,60,.55)'); bank.addColorStop(1, 'rgba(110,90,60,0)');
  c.save(); c.translate(pond.x, pond.y); c.scale(1, pond.ry / pond.rx); c.translate(-pond.x, -pond.y);
  c.fillStyle = bank; c.beginPath(); c.arc(pond.x, pond.y, pond.rx * 1.15, 0, TAU); c.fill(); c.restore();
  c.fillStyle = 'rgba(120,85,50,.35)'; c.beginPath(); c.ellipse(house.x, house.y + 34, house.w / 2 + 10, 30, 0, 0, TAU); c.fill();
})();

/* ---------- the girl and the dog ---------- */
const girl = { x: house.x - 10, y: house.y + 120, dir: 2, face: 1, walk: 0, moving: false, idle: 0, blink: 0, vx: 0, vy: 0 };
const dog = { x: girl.x + 30, y: girl.y + 20, dir: 1, walk: 0, moving: false, sit: 0, sniff: 0, tail: 0 };
const SPEED = 82;
function blocked(x, y){ return x < 20 || y < 30 || x > WW - 20 || y > WH - 10 || inPond(x, y, 6) || inHouse(x, y, 4) || trees.some(t => Math.hypot(t.x - x, (t.y - y) * 1.6) < 12 * t.s) || rocks.some(r => Math.hypot(r.x - x, (r.y - y) * 1.8) < 10 * r.s); }
function moveBy(o, dx, dy){ if (!blocked(o.x + dx, o.y)) o.x += dx; if (!blocked(o.x, o.y + dy)) o.y += dy; }

const SKIN = '#f6d6bb', SKIN_D = '#e2b495', HAIR = '#c0582e', HAIR_D = '#8f3b1d', DRESS = '#4f7d5a', DRESS_D = '#3a5f45', COLLAR = '#fbf6ea', BOOT = '#6b4630', STRAW = '#ecd08a', STRAW_D = '#c9a65c', RIBBON = '#d9433b', OUT = 'rgba(60,35,25,.55)';
function blob(c, pts, fill, stroke){ c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = .8; c.stroke(); } }
function ell(c, x, y, rx, ry, fill, stroke, rot = 0){ c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = .8; c.stroke(); } }
// she is drawn at her feet; about 46 world pixels tall. dir: 0 up (back), 1 right, 2 down (front), 3 left
function drawGirl(c, x, y, t){
  const p = girl, w = Math.sin(p.walk * TAU), sitting = p.idle > 9, sitK = sitting ? clamp((p.idle - 9) / .6, 0, 1) : 0;
  const bob = p.moving ? Math.abs(Math.sin(p.walk * TAU)) * 1.6 : Math.sin(t * 2) * .35;
  const wind = Math.sin(t * 1.3) * .6 + Math.sin(t * 3.1) * .3;
  ell(c, x, y, 11, 4, 'rgba(30,40,20,.28)');
  c.save(); c.translate(x, y - bob + sitK * 10);
  const d = p.dir, side = d === 1 || d === 3, flip = d === 3 ? -1 : 1;
  if (side) c.scale(flip, 1);
  // legs and boots (hidden under the dress when she sits)
  if (!sitting) {
    const l = p.moving ? w * 3.2 : 0;
    if (side) { ell(c, -1 - l, -3, 3.2, 2.4, BOOT, OUT); ell(c, 1 + l, -3, 3.2, 2.4, BOOT, OUT); c.fillStyle = SKIN; c.fillRect(-2 - l, -9, 2.4, 6); c.fillRect(l, -9, 2.4, 6); }
    else { ell(c, -3.2, -3 + (p.moving ? w * 1.4 : 0), 3, 2.6, BOOT, OUT); ell(c, 3.2, -3 - (p.moving ? w * 1.4 : 0), 3, 2.6, BOOT, OUT); c.fillStyle = SKIN; c.fillRect(-4.2, -10, 2.2, 7); c.fillRect(2, -10, 2.2, 7); }
  } else { ell(c, -6, -3, 3.2, 2.4, BOOT, OUT); ell(c, 6, -3, 3.2, 2.4, BOOT, OUT); }
  // the dress, swinging a little as she walks
  const sw = p.moving ? w * 1.5 : wind * .4;
  blob(c, [[-5, -24], [5, -24], [9 + sw + sitK * 4, -8 - sitK * 2], [-9 + sw - sitK * 4, -8 - sitK * 2]], DRESS, OUT);
  blob(c, [[-9 + sw - sitK * 4, -8 - sitK * 2], [9 + sw + sitK * 4, -8 - sitK * 2], [8 + sw + sitK * 4, -6.5 - sitK * 2], [-8 + sw - sitK * 4, -6.5 - sitK * 2]], DRESS_D);
  // arms
  const a = p.moving ? w * 4 : 0;
  c.strokeStyle = SKIN_D; c.lineWidth = 3; c.lineCap = 'round';
  if (side) { c.beginPath(); c.moveTo(1, -21); c.lineTo(1 + a, -13); c.stroke(); }
  else if (sitting) { c.beginPath(); c.moveTo(-5, -21); c.lineTo(-3, -12); c.moveTo(5, -21); c.lineTo(3, -12); c.stroke(); }
  else { c.beginPath(); c.moveTo(-5.5, -21); c.lineTo(-7.5, -14 + a * .4); c.moveTo(5.5, -21); c.lineTo(7.5, -14 - a * .4); c.stroke(); }
  // the white collar
  if (d !== 0) blob(c, [[-5, -24.5], [5, -24.5], [3, -21.5], [0, -23], [-3, -21.5]], COLLAR, OUT);
  // the braids, swinging with her steps and the breeze (behind the head when seen from the front)
  const hy = -32, braid = (bx, by, len, k) => {
    c.strokeStyle = HAIR; c.lineWidth = 3.6; c.lineCap = 'round'; c.beginPath(); c.moveTo(bx, by);
    const ex = bx + (wind + (p.moving ? w : 0)) * k, ey = by + len; c.quadraticCurveTo(bx + k * .5, by + len * .6, ex, ey); c.stroke();
    c.strokeStyle = HAIR_D; c.lineWidth = 1; for (let s = .3; s < 1; s += .23) { const sx = lerp(bx, ex, s), sy = lerp(by, ey, s); c.beginPath(); c.moveTo(sx - 1.6, sy - 1); c.lineTo(sx + 1.6, sy + .6); c.stroke(); }
    ell(c, ex, ey + 1, 2, 1.3, RIBBON);
  };
  if (d === 2) { braid(-6, hy + 4, 12, 1.4); braid(6, hy + 4, 12, 1.4); }
  // the head
  ell(c, 0, hy, 8.2, 8.6, SKIN, OUT);
  if (d === 0) {
    ell(c, 0, hy - 1, 8.6, 8.6, HAIR, OUT); braid(-4, hy + 3, 13, 1.8); braid(4, hy + 3, 13, 1.8);
  } else if (side) {
    // profile: hair over the back of the head, one eye, a little nose, a braid behind
    blob(c, [[-8.5, hy - 1], [-6, hy - 8], [2, hy - 9], [7.5, hy - 4], [5, hy - 5], [-1, hy - 4], [-3, hy + 3], [-8, hy + 4]], HAIR, OUT);
    braid(-6, hy + 3, 13, -1.8);
    const open = p.blink <= 0;
    if (open) { ell(c, 4.6, hy + 1, 1.1, 1.6, '#3a2418'); ell(c, 4.9, hy + .4, .4, .5, '#fff'); } else { c.strokeStyle = '#3a2418'; c.lineWidth = .9; c.beginPath(); c.moveTo(3.6, hy + 1.4); c.lineTo(5.6, hy + 1.4); c.stroke(); }
    ell(c, 8.2, hy + 2.6, 1.1, 1, SKIN_D); ell(c, 3, hy + 4, 1.8, 1.1, 'rgba(240,120,110,.35)');
    for (const [fx, fy] of [[1.5, hy + 3], [3, hy + 3.4], [2.2, hy + 4.3]]) ell(c, fx, fy, .35, .35, 'rgba(150,80,50,.55)');
  } else {
    // front: a fringe, two eyes that blink, freckles and rosy cheeks
    blob(c, [[-8.6, hy + 2], [-8, hy - 6], [-3, hy - 9.5], [3, hy - 9.5], [8, hy - 6], [8.6, hy + 2], [6, hy - 3], [2, hy - 4.5], [-1, hy - 3], [-5, hy - 4.5]], HAIR, OUT);
    const open = p.blink <= 0, look = p.look || 0;
    for (const ex of [-3.2, 3.2]) {
      if (open) { ell(c, ex + look, hy + 1.2, 1.3, 1.8, '#3a2418'); ell(c, ex + look + .4, hy + .4, .45, .55, '#fff'); }
      else { c.strokeStyle = '#3a2418'; c.lineWidth = .9; c.beginPath(); c.moveTo(ex - 1.2, hy + 1.5); c.quadraticCurveTo(ex, hy + 2.3, ex + 1.2, hy + 1.5); c.stroke(); }
    }
    ell(c, -5, hy + 4, 1.9, 1.1, 'rgba(240,120,110,.35)'); ell(c, 5, hy + 4, 1.9, 1.1, 'rgba(240,120,110,.35)');
    for (const [fx, fy] of [[-4.5, hy + 3], [-3.2, hy + 3.6], [-5.6, hy + 3.5], [4.5, hy + 3], [3.2, hy + 3.6], [5.6, hy + 3.5]]) ell(c, fx, fy, .35, .35, 'rgba(150,80,50,.55)');
    c.strokeStyle = '#b5604c'; c.lineWidth = .8; c.beginPath(); c.moveTo(-1.4, hy + 5.2); c.quadraticCurveTo(0, hy + 6.1, 1.4, hy + 5.2); c.stroke();
  }
  // the straw hat, its ribbon flying in the breeze
  const by = hy - 6.5;
  ell(c, 0, by + 1, 13, 4.2, STRAW, OUT);
  ell(c, 0, by - 2, 7.4, 5, STRAW, OUT);
  c.fillStyle = RIBBON; c.fillRect(-7.2, by - 1.4, 14.4, 2.4);
  const rt = side ? -7 : 6;
  c.strokeStyle = RIBBON; c.lineWidth = 1.8; c.lineCap = 'round'; c.beginPath(); c.moveTo(rt, by); c.quadraticCurveTo(rt + 4 * Math.sign(rt), by + 3, rt + (6 + wind * 2) * Math.sign(rt), by + 6 + Math.sin(t * 4) * 1.2); c.stroke();
  c.strokeStyle = STRAW_D; c.lineWidth = .6; for (let k = -9; k <= 9; k += 3) { c.beginPath(); c.moveTo(k, by + 2.5); c.lineTo(k * .9, by - .5); c.stroke(); }
  c.restore();
}
function drawDog(c, x, y, t){
  const p = dog, w = Math.sin(p.walk * TAU), sit = p.sit > 1.2;
  ell(c, x, y, 9, 3.2, 'rgba(30,40,20,.25)');
  c.save(); c.translate(x, y - (p.moving ? Math.abs(w) * 1.2 : 0));
  const flip = p.dir === 3 ? -1 : 1; c.scale(flip, 1);
  const FUR = '#f4ead8', FUR_D = '#d8c6a6', EAR = '#9b6a44';
  // legs
  c.strokeStyle = FUR_D; c.lineWidth = 2.6; c.lineCap = 'round'; c.beginPath();
  const l = p.moving ? w * 2.5 : 0;
  if (sit) { c.moveTo(4, -6); c.lineTo(5, -1); c.moveTo(1, -6); c.lineTo(1.5, -1); }
  else { c.moveTo(-5, -6); c.lineTo(-5 - l, -1); c.moveTo(-2, -6); c.lineTo(-2 + l, -1); c.moveTo(3, -6); c.lineTo(3 + l, -1); c.moveTo(5.5, -6); c.lineTo(5.5 - l, -1); }
  c.stroke();
  // body, tail (wagging), head with a brown ear
  ell(c, sit ? -1 : 0, sit ? -8 : -8, sit ? 6 : 8, sit ? 6 : 4.6, FUR, 'rgba(90,70,50,.5)');
  const wag = Math.sin(t * (p.moving ? 14 : 9)) * (sit ? .5 : .9);
  c.strokeStyle = FUR; c.lineWidth = 2.6; c.beginPath(); c.moveTo(-7, sit ? -6 : -10); c.quadraticCurveTo(-11, -14 + wag * 3, -10 + wag * 2, -17); c.stroke();
  const hx = sit ? 4 : 8, hy = sit ? -16 : -13 + (p.sniff > 0 ? 5 : 0);
  ell(c, hx, hy, 5, 4.4, FUR, 'rgba(90,70,50,.5)');
  ell(c, hx + 4.6, hy + 1.6, 2.2, 1.6, FUR);
  ell(c, hx + 6.2, hy + 1, 1, .9, '#3a2418');
  ell(c, hx + 1.8, hy - .6, .9, 1.1, '#3a2418');
  ell(c, hx - 2.4, hy - 1, 2, 3.6, EAR, null, .4 + Math.sin(t * 3) * .05);
  c.restore();
}

/* ---------- trees, bushes, the house and the rest ---------- */
function drawTree(c, o, t){
  const s = o.s, sway = Math.sin(t * .9 + o.ph) * 1.6 * s, x = o.x, y = o.y;
  ell(c, x + 10 * s, y + 2, 34 * s, 11 * s, 'rgba(30,50,20,.25)');
  // trunk
  blob(c, [[x - 5 * s, y], [x + 5 * s, y], [x + 3.5 * s, y - 34 * s], [x - 3.5 * s, y - 34 * s]], '#7a5536', 'rgba(50,30,20,.5)');
  c.strokeStyle = 'rgba(50,30,20,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x - 1, y - 6 * s); c.lineTo(x - 2, y - 26 * s); c.stroke();
  // the crown: round leafy blobs, darker under, light on top where the sun is
  const cx = x + sway, cy = y - 58 * s, greens = o.hue < .5 ? ['#3f7a3a', '#56963f', '#7ab650', '#a6d06a'] : ['#3d6f45', '#4f8a4f', '#6fa85c', '#9cc878'];
  const blobs = [[-16, 8, 20], [16, 8, 19], [0, 12, 21], [-10, -8, 19], [11, -9, 18], [0, -18, 16]];

  document.getElementById('clock').textContent = (night > .5 ? '☾ ' : '☀ ') + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}
// (the first frame's time can come a little before the start, hence the clamp)
function loop(now){ const dt = clamp((now - last) / 1000, 0, .05); last = now; update(dt); render(); requestAnimationFrame(loop); }
window.__paseo = { girl, dog, setDay: v => { dayT = v; }, step: (s) => { for (let k = 0; k < s * 60; k++) update(1 / 60); } };
requestAnimationFrame(loop);
})();
</script>
