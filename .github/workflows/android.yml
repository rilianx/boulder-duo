# Builds the Android app (Capacitor around index.html). The APK is kept as the run's artifact "boulder-duo-apk"
# (Actions tab > the run > Artifacts), a zip with boulder-duo.apk inside.
name: App de Android

on:
  push:
    paths:
      - index.html
      - app/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Copiar el juego a la app
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: Compilar el APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../boulder-duo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: boulder-duo-apk
          path: boulder-duo.apk
