<style>
html,body{margin:0;height:100%;background:#2b3a26;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Georgia,'Times New Roman',serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.paper{background:#fbf3df;color:#3b2a1c;border:1.5px solid #6b4a30;border-radius:10px 14px 9px 12px;box-shadow:2px 3px 0 rgba(60,40,20,.35)}
#inv{position:fixed;left:10px;top:10px;padding:5px 11px;font-size:15px;pointer-events:none;line-height:1.5}
#tasks{position:fixed;left:10px;top:52px;padding:4px 10px;font-size:14px;pointer-events:none;line-height:1.45;max-width:min(330px,calc(100% - 80px))}
#tasks[hidden]{display:none}
#clock{position:fixed;right:10px;top:10px;padding:4px 10px;font-size:15px;pointer-events:none}
#prompt{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:6px 14px;font-size:16px;pointer-events:none;white-space:nowrap}
#prompt[hidden],#talk[hidden],#act[hidden]{display:none}
#act{position:fixed;right:16px;bottom:16px;width:64px;height:64px;border-radius:50%;font-size:28px;line-height:60px;text-align:center;cursor:pointer;padding:0}
#talk{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));padding:12px 16px 12px;font-size:17px;line-height:1.4}
#talk .who{font-weight:bold;color:#7a3a22;margin-bottom:2px} #talk .who span{color:#d24a4a;font-weight:normal;margin-left:6px;letter-spacing:1px}
#talk .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
#talk button{font:15px Georgia,serif;background:#fffaf0;color:#3b2a1c;border:1.5px solid #6b4a30;border-radius:8px 11px 7px 10px;padding:6px 11px;cursor:pointer}
#talk button:focus{outline:2px solid #d9a441}
#talk.wait .line{color:#9a7a5a;font-style:italic}
@media (max-width:640px){#hint{top:58px !important;max-width:calc(100% - 30px) !important}}
#hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);padding:5px 12px;font-size:14px;pointer-events:none;transition:opacity 1.5s;text-align:center;max-width:calc(100% - 200px)}
#mapbtn{position:fixed;right:10px;top:46px;width:42px;height:36px;font-size:20px;line-height:30px;padding:0;cursor:pointer}
#map{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,20,10,.45)}
#map[hidden]{display:none}
#map .sheet{padding:8px 10px 10px;text-align:center}
#map .mt{font-size:18px;font-style:italic;margin-bottom:5px}
#mapcv{display:block;margin:0 auto;border-radius:4px}
#map .mb{display:flex;gap:8px;justify-content:center;margin-top:8px}
#aibtn{position:fixed;right:10px;top:88px;width:42px;height:36px;font-size:19px;line-height:30px;padding:0;cursor:pointer}
#ai{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,20,10,.45)}
#ai[hidden]{display:none}
#ai .sheet{padding:12px 16px;width:min(520px,calc(100% - 28px));max-height:calc(100% - 40px);overflow:auto;font-size:15px;line-height:1.45}
#ai h3{margin:0 0 6px;font-style:italic;font-weight:normal;font-size:20px}
#ai label{display:block;margin:8px 0 2px}
#ai input[type=password],#ai select{font:15px Georgia,serif;width:100%;box-sizing:border-box;padding:5px 8px;border:1.5px solid #6b4a30;border-radius:7px;background:#fffaf0;color:#3b2a1c}
#ai .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#ai .note{font-size:13px;color:#6b4a30;margin-top:4px}
#ai pre{white-space:pre-wrap;font:13px Georgia,serif;background:#fffaf0;border:1px solid #d9bf8f;border-radius:6px;padding:8px;max-height:40vh;overflow:auto}
#ai button,#map button{font:15px Georgia,serif;background:#fffaf0;color:#3b2a1c;border:1.5px solid #6b4a30;border-radius:8px 11px 7px 10px;padding:5px 11px;cursor:pointer}
</style>

<body>
<canvas id="cv"></canvas>
<div id="inv" class="paper"></div>
<div id="tasks" class="paper" hidden></div>
<div id="clock" class="paper"></div>
<div id="hint" class="paper">Flechas o WASD para pasear · Espacio para hacer cosas · M para el mapa · en el celular, arrastra el dedo y toca ✋</div>
<div id="prompt" class="paper" hidden></div>
<button id="act" class="paper" hidden>✋</button>
<div id="talk" class="paper" hidden></div>
<button id="mapbtn" class="paper" title="Mapa (M)">🗺</button>
<button id="aibtn" class="paper" title="Diálogos con IA">✒</button>
<div id="ai" hidden><div class="paper sheet">
  <h3>Diálogos con IA</h3>
  <div>Con esto activado, Matthew, Marilla, Diana y la Sra. Barry conversan con una IA: se acuerdan de lo que ha pasado y de lo que les contaste.</div>
  <label><input type="checkbox" id="aion"> Usar IA en las conversaciones</label>
  <label for="aimodel">Modelo</label>
  <select id="aimodel"><option value="gpt-5.4-mini">GPT-5.4 mini (OpenAI)</option><option value="claude-opus-5-5">Claude Opus 5.5 (Anthropic)</option><option value="claude-sonnet-5-5">Claude Sonnet 5.5 (Anthropic, más rápido)</option><option value="claude-haiku-4-5">Claude Haiku 4.5 (Anthropic, el más barato)</option></select>
  <label for="aikey" id="aikeylab">Tu clave de la API</label>
  <input type="password" id="aikey" autocomplete="off" spellcheck="false">
  <div class="note" id="ainote"></div>
  <div class="row"><button id="aitest">Probar</button><button id="aimem">Ver recuerdos</button><button id="aiforget">Borrar recuerdos</button><button id="aiclose">Cerrar</button></div>
  <pre id="aiout" hidden></pre>
</div></div>
<div id="map" hidden><div class="paper sheet"><div class="mt" id="maptitle"></div><canvas id="mapcv"></canvas><div class="mb"><button id="mapnext">Siguiente estación (prueba)</button><button id="mapclose">Cerrar</button></div></div></div>
<script>
/* Un día en Avonlea: a first look at a calm game inspired by "Anne of Green Gables" (L. M. Montgomery, 1908). No
   missions: Ana lives at Green Gables with Matthew and Marilla, and spends the days as she likes: watering the
   kitchen garden, picking berries and apples, cooking in the kitchen, visiting her bosom friend Diana at Orchard
   Slope across the brook, walking down to the Lake of Shining Waters, petting Toby the dog...
   - Seen from above and in front ("fake 3D"): everything is drawn in the order of its feet.
   - Drawn by hand: pencil outlines that wobble a little and "boil" (redrawn a few times a second, like hand-drawn
     animation), watercolour fills that do not quite meet the line, and paper grain over everything.
   - The day lasts 8 minutes: morning, a golden evening, a night with lit windows and fireflies, dawn.
   - The seasons turn every two days: apple blossom in spring, berries and fireflies in summer, red leaves falling
     in autumn, snow and a frozen lake in winter (and everyone in scarves).
   - Indoors: the kitchen at Green Gables, and Diana's parlour at Orchard Slope, where they take tea by the fire.
   - A map of Avonlea (M), drawn on a sheet of paper, with where everyone is.
   - Optionally (✒), the conversations are written by Claude, with the game's journal of what has happened and what
     each one remembers; without it, or if it fails, the written lines are used.
   - What she has, what has grown and how fond everyone is of her are kept in the browser. */
(() => {
'use strict';
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const T = 32, WW = 72 * T, WH = 50 * T, TAU = Math.PI * 2;
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(18780228);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const $ = id => document.getElementById(id);

/* ---------- drawing by hand ----------
   Outlines are drawn twice, each time with its points nudged a little; the nudges change a few times a second
   (boil), and come from the shape's size, so a shape that moves keeps its wobble. */
let boil = 0;
// the season (0 spring, 1 summer, 2 autumn, 3 winter) and whether the outdoors is being drawn (for the scarves)
let S = 0, drawingOut = true;
const SEASONS = ['Primavera', 'Verano', 'Otoño', 'Invierno'], SICON = ['🌸', '☀', '🍂', '❄'];
const INK = 'rgba(70,42,26,.78)';
function sketch(c, pts, closed, seed, col = INK, w = 1){
  for (let pass = 0; pass < 2; pass++) {
    const r = rng(seed * 31 + pass * 977 + boil * 7919), amp = .45 + pass * .2;
    c.beginPath();
    pts.forEach(([x, y], i) => { const nx = x + (r() - .5) * amp * 2, ny = y + (r() - .5) * amp * 2; i ? c.lineTo(nx, ny) : c.moveTo(nx, ny); });
    if (closed) c.closePath();
    c.strokeStyle = col; c.lineWidth = w * (pass ? .6 : 1); c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
  }
}
const seedOf = (...v) => v.reduce((h, x) => Math.imul(h ^ Math.round(x * 4), 0x9E3779B1) >>> 0, 7);
// a watercolour shape (fill a hair off its line) with a pencil outline
function blob(c, pts, fill, line = true){
  c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x + .6, y + .4) : c.moveTo(x + .6, y + .4)); c.closePath(); c.fillStyle = fill; c.fill();
  if (line) sketch(c, pts, true, seedOf(pts.length, pts[1][0] - pts[0][0], pts[1][1] - pts[0][1], pts[2] ? pts[2][0] - pts[0][0] : 0));
}
function ell(c, x, y, rx, ry, fill, line = false, rot = 0){
  if (rx <= 0 || ry <= 0) return;
  c.beginPath(); c.ellipse(x + (line ? .5 : 0), y + (line ? .4 : 0), rx, ry, rot, 0, TAU); c.fillStyle = fill; c.fill();
  if (line) {
    const n = rx > 60 ? 56 : rx > 6 ? 14 : 9, pts = [];
    for (let k = 0; k < n; k++) { const a = k / n * TAU; pts.push([x + Math.cos(a) * rx * Math.cos(rot) - Math.sin(a) * ry * Math.sin(rot), y + Math.cos(a) * rx * Math.sin(rot) + Math.sin(a) * ry * Math.cos(rot)]); }
    sketch(c, pts, true, seedOf(rx, ry, n), line === true ? INK : line);
  }
}
function line(c, pts, col, w, seed = 3){ sketch(c, pts, false, seedOf(seed, pts.length, pts[0][0] - pts[pts.length - 1][0]), col, w); }
// a few pencil hatches over a dark side
function hatch(c, x, y, w, h, seed, col = 'rgba(70,42,26,.22)'){
  const r = rng(seed + boil * 13); c.strokeStyle = col; c.lineWidth = .7; c.beginPath();
  for (let k = 0; k < w / 4; k++) { const hx = x + r() * w, hy = y + r() * h; c.moveTo(hx, hy); c.lineTo(hx + 4, hy - 4); }
  c.stroke();
}
// paper grain: drawn over the whole screen
const paper = document.createElement('canvas'); paper.width = paper.height = 256;
(() => { const p = paper.getContext('2d'), r = rng(5); for (let n = 0; n < 9000; n++) { p.fillStyle = r() < .5 ? `rgba(90,60,30,${r() * .12})` : `rgba(255,250,235,${r() * .15})`; p.fillRect(r() * 256, r() * 256, 1 + r(), 1 + r()); }
  p.strokeStyle = 'rgba(120,90,60,.06)'; for (let n = 0; n < 60; n++) { p.beginPath(); const x = r() * 256, y = r() * 256; p.moveTo(x, y); p.quadraticCurveTo(x + r() * 20 - 10, y + r() * 20 - 10, x + r() * 30 - 15, y + r() * 30 - 15); p.stroke(); } })();

/* ---------- Avonlea ---------- */
const GG = { x: 20 * T, y: 15 * T, w: 7 * T, name: 'Tejas Verdes' };          // the front's middle, at the ground
const OS = { x: 54 * T, y: 15 * T, w: 6 * T, name: 'La Cuesta del Huerto' };
const BARN = { x: 9 * T, y: 13 * T, w: 5 * T };
const LAKE = { x: 37 * T, y: 40 * T, rx: 9.5 * T, ry: 4.6 * T };
const brook = [[41 * T, -20], [41.6 * T, 8 * T], [40.4 * T, 16 * T], [41.4 * T, 24 * T], [40.2 * T, 31 * T], [38.5 * T, LAKE.y - LAKE.ry + 20]];
const BRIDGE = { x: 40.6 * T, y: 19.5 * T };
const PUMP = { x: GG.x + GG.w / 2 + 34, y: GG.y + 56 };
const BENCH = { x: LAKE.x - 50, y: LAKE.y - LAKE.ry - 30 };
const STOVE_SPOT = 'stove';
const paths = [
  [[GG.x, GG.y + 6], [GG.x + 6, GG.y + 80], [GG.x + 120, BRIDGE.y + 4], [BRIDGE.x - 120, BRIDGE.y + 6], [BRIDGE.x, BRIDGE.y], [BRIDGE.x + 140, BRIDGE.y - 6], [OS.x - 30, OS.y + 90], [OS.x, OS.y + 6]],
  [[BRIDGE.x - 220, BRIDGE.y + 6], [BRIDGE.x - 260, BRIDGE.y + 160], [LAKE.x - 100, LAKE.y - LAKE.ry - 40]],
  [[GG.x - 60, GG.y + 70], [BARN.x + 20, BARN.y + 30]],
];
const segs = []; paths.forEach(p => { for (let i = 0; i + 1 < p.length; i++) segs.push([p[i], p[i + 1]]); });
const segDist = (x, y, a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], t = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy), 0, 1); return Math.hypot(x - a[0] - dx * t, y - a[1] - dy * t); };
const nearPath = (x, y, w) => segs.some(([a, b]) => segDist(x, y, a, b) < w);
const brookSegs = []; for (let i = 0; i + 1 < brook.length; i++) brookSegs.push([brook[i], brook[i + 1]]);
const inBrook = (x, y, m = 0) => brookSegs.some(([a, b]) => segDist(x, y, a, b) < 14 + m) && !(Math.abs(x - BRIDGE.x) < 40 && Math.abs(y - BRIDGE.y) < 22 + m * 0);
const inLake = (x, y, m = 0) => ((x - LAKE.x) / (LAKE.rx + m)) ** 2 + ((y - LAKE.y) / (LAKE.ry + m)) ** 2 < 1;
const inBox = (b, d, x, y, m) => x > b.x - b.w / 2 - m && x < b.x + b.w / 2 + m && y > b.y - d - m && y < b.y + m;
const inHouses = (x, y, m = 0) => inBox(GG, 110, x, y, m) || inBox(OS, 100, x, y, m) || inBox(BARN, 96, x, y, m);
// the kitchen garden: six beds by Green Gables; each grows when watered (seed, sprout, leaves, flowers)
const BEDS = []; for (let r = 0; r < 2; r++) for (let k = 0; k < 3; k++) BEDS.push({ x: GG.x + GG.w / 2 + 80 + k * 46, y: GG.y + 20 + r * 44, stage: 1, wet: 0, grow: 0, kind: (r * 3 + k) % 3 });
const FLOWER_KINDS = [['#f08aa0', 'rosas'], ['#f2c94c', 'girasoles'], ['#a58ad8', 'lilas']];
const inBeds = (x, y) => BEDS.some(b => Math.abs(x - b.x) < 24 && Math.abs(y - b.y) < 18);
const free = (x, y, m) => !inLake(x, y, m) && !inHouses(x, y, m + 24) && !nearPath(x, y, m + 22) && !inBrook(x, y, m + 10) && !inBeds(x, y) && dist(x, y, PUMP.x, PUMP.y) > 40;
// trees: an orchard of apple trees at Orchard Slope, blossoming cherries along the White Way of Delight, a dark
// Haunted Wood down at the left, and trees about
const trees = [];
const tree = (x, y, kind, s = .9 + R() * .35) => trees.push({ kind, x, y, s, ph: R() * TAU, apples: kind === 'apple' ? 3 : 0, regrow: 0 });
const clearOfBeds = (x, y) => BEDS.every(b => dist(b.x, b.y, x, y) > 70);
for (let k = 0; k < 9; k++) { const x = GG.x + 180 + k * 64, y = BRIDGE.y - 50 + (k % 2) * 6; if (free(x, y, 30) && clearOfBeds(x, y) && Math.abs(x - BRIDGE.x) > 60) tree(x, y, 'blossom', .85); const y2 = BRIDGE.y + 70; if (free(x + 30, y2, 30) && clearOfBeds(x + 30, y2) && Math.abs(x + 30 - BRIDGE.x) > 60) tree(x + 30, y2, 'blossom', .85); }
for (let r = 0; r < 3; r++) for (let k = 0; k < 4; k++) { const x = OS.x - 100 + k * 70 + (r % 2) * 30, y = OS.y + 130 + r * 70; if (free(x, y, 30)) tree(x, y, 'apple', .9); }
for (let n = 0; n < 900 && trees.filter(t => t.kind === 'pine').length < 26; n++) { const x = 1 * T + R() * 16 * T, y = 30 * T + R() * 18 * T; if (free(x, y, 24) && !trees.some(t => dist(t.x, t.y, x, y) < 52)) tree(x, y, 'pine', .9 + R() * .4); }
for (let n = 0; n < 3000 && trees.length < 110; n++) {
  const x = R() * WW, y = R() * WH, edge = Math.min(x, y, WW - x, WH - y) < 4 * T;
  if ((!edge && R() < .6) || !free(x, y, 50) || !clearOfBeds(x, y) || trees.some(t => dist(t.x, t.y, x, y) < 86)) continue;
  tree(x, y, R() < .25 ? 'pine' : 'oak');
}
const bushes = [];
for (let n = 0; n < 900 && bushes.length < 22; n++) { const x = R() * WW, y = R() * WH; if (!free(x, y, 24) || trees.some(t => dist(t.x, t.y, x, y) < 56) || bushes.some(b => dist(b.x, b.y, x, y) < 60)) continue; bushes.push({ kind: 'bush', x, y, s: .85 + R() * .4, ph: R() * TAU, berries: 3, regrow: 0 }); }
// a few near home, so berries are close at hand
for (const [dx, dy] of [[-190, 150], [-250, 90], [260, 170]]) bushes.push({ kind: 'bush', x: GG.x + dx, y: GG.y + dy, s: 1, ph: R() * TAU, berries: 3, regrow: 0 });
const props = [
  { kind: 'house', h: GG, roof: '#5f9a58', wall: '#f7f2e6', trim: '#4f7d47', y: GG.y, x: GG.x },
  { kind: 'house', h: OS, roof: '#9a5a3c', wall: '#efe0c8', trim: '#7a4a32', y: OS.y, x: OS.x, small: true },
  { kind: 'barn', x: BARN.x, y: BARN.y },
  { kind: 'pump', x: PUMP.x, y: PUMP.y },
  { kind: 'bench', x: BENCH.x, y: BENCH.y },
  { kind: 'bridge', x: BRIDGE.x, y: BRIDGE.y + 14 },
  { kind: 'sign', x: GG.x - 70, y: GG.y + 96, text: 'Tejas Verdes' },
  { kind: 'sign', x: OS.x - 90, y: OS.y + 70, text: 'La Cuesta del Huerto' },
  { kind: 'sign', x: LAKE.x - 160, y: LAKE.y - LAKE.ry - 34, text: 'Lago de las Aguas Brillantes' },
  { kind: 'sign', x: GG.x + 260, y: BRIDGE.y + 30, text: 'Camino Blanco de las Delicias' },
  { kind: 'sign', x: 15 * T, y: 30 * T, text: 'Bosque Encantado' },
];
for (let x = GG.x - GG.w / 2 - 40; x < GG.x + GG.w / 2 + 230; x += 24) if (Math.abs(x - GG.x) > 40 && !(x > PUMP.x - 20 && x < PUMP.x + 20)) props.push({ kind: 'post', x, y: GG.y + 120 });
const tufts = [], flowers = [], reeds = [], pads = [];
for (let n = 0; n < 3200; n++) { const x = R() * WW, y = R() * WH; if (!inLake(x, y, 10) && !inHouses(x, y, 4) && !nearPath(x, y, 16) && !inBrook(x, y, 6) && !inBeds(x, y)) tufts.push({ x, y, h: 5 + R() * 7, ph: R() * TAU, c: R() }); }
const FCOLS = ['#fffaf2', '#ffd7e8', '#f7e27a', '#c9a7f2', '#ff9f8a', '#a8d8ff'];
for (let n = 0; n < 850; n++) { const x = R() * WW, y = R() * WH; if (!inLake(x, y, 14) && !inHouses(x, y, 6) && !nearPath(x, y, 18) && !inBrook(x, y, 8) && !inBeds(x, y)) flowers.push({ x, y, c: FCOLS[Math.floor(R() * FCOLS.length)], ph: R() * TAU, s: .8 + R() * .6 }); }
for (const H of [GG, OS]) for (let n = 0; n < 50; n++) { const x = H.x - H.w / 2 + R() * H.w, y = H.y + 10 + R() * 34; if (Math.abs(x - H.x) > 26) flowers.push({ x, y, c: ['#ff9f8a', '#ffd7e8', '#f7e27a', '#fffaf2'][n % 4], ph: R() * TAU, s: 1.1 }); }
for (let n = 0; n < 70; n++) { const a = R() * TAU, k = .96 + R() * .1; reeds.push({ x: LAKE.x + Math.cos(a) * LAKE.rx * k, y: LAKE.y + Math.sin(a) * LAKE.ry * k, h: 14 + R() * 12, ph: R() * TAU }); }
for (let n = 0; n < 12; n++) { const a = R() * TAU, k = R() * .75; pads.push({ x: LAKE.x + Math.cos(a) * LAKE.rx * k, y: LAKE.y + Math.sin(a) * LAKE.ry * k, r: 7 + R() * 6, a: R() * TAU, bloom: R() < .4 }); }

/* ---------- the ground, painted again each season (watercolour washes, the paths, the brook's bed) ---------- */
const ground = document.createElement('canvas'); ground.width = WW; ground.height = WH;
let groundSeason = -1;
const GPAL = [
  { base: '#94c266', wash: ['170,212,110', '120,170,80', '196,218,122'], grass: 'rgba(70,110,40,.18)', path: ['rgba(150,120,70,.3)', '#cdae7a', '#dbbf8d'], bed: '#8a6440', wood: '40,70,40,.45', bank: '120,95,60' },
  { base: '#86b058', wash: ['150,192,92', '104,148,62', '184,200,102'], grass: 'rgba(60,95,35,.2)', path: ['rgba(150,120,70,.3)', '#cfab72', '#ddbd86'], bed: '#86603c', wood: '36,64,34,.5', bank: '120,95,60' },
  { base: '#aaa65c', wash: ['204,170,92', '150,146,70', '214,140,70'], grass: 'rgba(110,90,40,.2)', path: ['rgba(150,110,70,.3)', '#c9a676', '#d6b98a'], bed: '#80603e', wood: '90,60,30,.4', bank: '120,90,55' },

const SPEED = 84;
function blockedOut(x, y){
  return x < 16 || y < 40 || x > WW - 16 || y > WH - 8 || inLake(x, y, 6) || inBrook(x, y, 2) || inHouses(x, y, 2) ||
    trees.some(t => Math.hypot(t.x - x, (t.y - y) * 1.6) < 11 * t.s) || dist(x, y, PUMP.x, PUMP.y) < 9;
}
function blockedIn(x, y){
  if (x < 14 || x > KIT.w - 14 || y < 2.4 * T + 8 || (y > KIT.h - 4 && Math.abs(x - KDOOR.x) > 16)) return true;

}

function moveBy(o, dx, dy){ if (!blocked(o.x + dx, o.y)) o.x += dx; if (!blocked(o.x, o.y + dy)) o.y += dy; }
function walkTo(p, tx, ty, sp, dt){
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);

  const v = Math.min(sp, d * 4); moveBy(p, dx / d * v * dt, dy / d * v * dt); p.moving = true;
  p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0); p.walk = (p.walk + dt * 1.8 * v / SPEED) % 1;

}

  const [gx, gy] = p.goals[p.goal % p.goals.length];

}

  matthew: ['Bueno, pues... ya brotó todo. La primavera, ¿no? Ya lo creo.', 'Hace calor para la siega, ya lo creo. Bueno, el heno no se corta solo.', 'Las manzanas de los Barry están en su punto. Marilla querrá hacer compota, supongo.', 'Abrígate bien, Ana. El frío... bueno, pues, no es broma.'],
  marilla: ['Hay que limpiar la casa a fondo, que es primavera. Y tú me vas a ayudar, Ana.', 'Con este calor, mejor un té y no enciendas mucho la estufa.', 'Es tiempo de manzanas: una buena compota para el invierno no está de más.', 'Siéntate cerca de la estufa, niña, que vienes helada.'],
  diana: ['¡Mira los manzanos en flor, Ana! Parecen novias vestidas de blanco.', '¡Qué calor! ¿Vamos a remojar los pies en el lago?', 'El Bosque Encantado está todo rojo y dorado... ¡como un cuento!', '¡Está nevando! Mamá no me deja salir sin bufanda. Ven, entra a calentarte junto al fuego.'],
  barry: ['Buenos días, Ana. Diana está deseando verte.', 'Qué calor, ¿verdad? Hay limonada en la despensa.', 'Diana me ayudó con las manzanas. Llévale algunas a Marilla.', 'Pasa, pasa, que hace un frío terrible. Diana está junto al fuego.'],
};
const seasonCount = () => Math.floor(dayT / 2) + game.seasonShift;
const GIFTS = { tarta: ['tarta de bayas', '¡Una tarta! Huele de maravilla.'], compota: ['compota de manzana', '¡Qué rica compota! Gracias.'], te: ['taza de té', 'Un té calentito, justo lo que me hacía falta.'], ramo: ['ramo de flores', '¡Qué flores tan lindas! Las pondré en agua.'] };
function talk(who, again = false){
  const p = PEOPLE[who];
  if (AI.on && !aiKey()) askKey();
  const pre = again ? [] : talkPrelude(who);
  if (aiReady()) { face(who); conv = null; aiTalk(who, 'Ana se acerca a conversar con ' + NAMES[who] + '.' + pre.map(x => ' (' + x + ')').join('')); return; }
  if (!p.sit) { p.dir = ana.x < p.x ? 3 : 1; if (Math.abs(ana.y - p.y) > Math.abs(ana.x - p.x)) p.dir = ana.y < p.y ? 0 : 2; }
  if (!ana.sit) ana.dir = p.x < ana.x ? 3 : 1;
  let text;
  if (game.saidS[who] !== seasonCount()) { game.saidS[who] = seasonCount(); text = SEASON_LINES[who][S]; }
  else text = LINES[who][game.said[who] = ((game.said[who] ?? -1) + 1) % LINES[who].length];
  if (pre.some(x => x.startsWith('Ana cumplió'))) text = '¡Gracias por hacer lo que te pedí, Ana! ' + text;
  const opts = [...taskOptions(who)];
  for (const [k, [name]] of Object.entries(GIFTS)) if (game.inv[k] > 0) opts.push(['Regalar ' + name, () => give(who, k)]);
  opts.push(...walkOption(who), ['Adiós', close]);
  say(who, text, opts);
}
function face(who){
  const p = PEOPLE[who];
  if (!p.sit) { p.dir = ana.x < p.x ? 3 : 1; if (Math.abs(ana.y - p.y) > Math.abs(ana.x - p.x)) p.dir = ana.y < p.y ? 0 : 2; }
  if (!ana.sit) ana.dir = p.x < ana.x ? 3 : 1;
}
// walking with Diana (the same with or without AI: the game decides it, so it always works)
function walkOption(who){
  if (who !== 'diana') return [];
  return [diana.follow ? ['Hasta mañana, Diana', () => { diana.follow = false; logEv('Ana y Diana terminaron su paseo.'); save(); say(who, '¡Hasta mañana, Ana! Que sueñes bonito.', [['Adiós', close]]); }]
    : ['¿Paseamos juntas?', () => { diana.follow = true; game.fond.diana = Math.min(5, game.fond.diana + 1); logEv('Ana y Diana salieron a pasear juntas.'); save(); say(who, '¡Sí! Vamos, Ana, a donde tú quieras.', [['¡Vamos!', close]]); }]];
}

/* ---------- dialogue with AI (Claude) ----------
   Each conversation sends Claude who the character is (a fixed, cached prompt), what is true right now (the day,
   the place, what Ana carries, how fond each one is of her), what has happened lately (the journal the game keeps)
   and what this character remembers from earlier conversations. Claude answers as the character, offers Ana two or
   three things to say, and may note one new memory. Gifts and walks are still decided by the game itself, so
   nothing the AI writes can break it; if the AI is off or fails, the written lines are used. */
// (each provider has its own key, typed in by the player and kept in this browser)
const AI = { on: false, model: 'gpt-5.4-mini', keys: { openai: '', anthropic: '' } };
try { const st = JSON.parse(localStorage.getItem('avonlea-ai') || '{}'); if (st.key) { AI.keys.anthropic = st.key; delete st.key; } Object.assign(AI, st); AI.keys = Object.assign({ openai: '', anthropic: '' }, st.keys || AI.keys); } catch (e) {}
const saveAI = () => { try { localStorage.setItem('avonlea-ai', JSON.stringify(AI)); } catch (e) {} };
const provider = (m = AI.model) => m.startsWith('gpt') ? 'openai' : 'anthropic';
const PROV = { openai: { name: 'OpenAI', hint: 'sk-...' }, anthropic: { name: 'Anthropic', hint: 'sk-ant-...' } };
const aiKey = () => AI.keys[provider()] || '';
const aiReady = () => AI.on && !!aiKey();
let conv = null;   // the conversation going on: { who, id, msgs, turns }
const hourNow = () => (dayT % 1) * 24 + 6;   // 6 (dawn) .. 30 (dawn again)
const ITEMS = ['bayas', 'manzanas', 'tarta', 'compota', 'te', 'ramo'];
const ITEM_NAME = { bayas: ['baya', 'bayas'], manzanas: ['manzana', 'manzanas'], tarta: ['tarta de bayas', 'tartas de bayas'], compota: ['compota de manzana', 'compotas de manzana'], te: ['taza de té', 'tazas de té'], ramo: ['ramo de flores', 'ramos de flores'] };
const itemText = (k, n = 1) => n + ' ' + ITEM_NAME[k][n > 1 ? 1 : 0];
// what can be had now (berries and apples in summer and autumn, flowers but in winter, tea always)
const inSeason = k => ({ bayas: S === 1 || S === 2, manzanas: S === 1 || S === 2, tarta: S === 1 || S === 2 || game.inv.bayas >= 3 || game.inv.tarta > 0, compota: S === 1 || S === 2 || game.inv.manzanas >= 3 || game.inv.compota > 0, te: true, ramo: S !== 3 || game.inv.ramo > 0 })[k];
// the places the characters (and Ana's errands) can go to; each a spot one can walk to
const PLACES = {
  tejas_verdes: ['Tejas Verdes', GG.x - 60, GG.y + 76], cuesta_del_huerto: ['La Cuesta del Huerto', OS.x - 50, OS.y + 64], huerta: ['la huerta de Tejas Verdes', BEDS[4].x, BEDS[4].y + 34],
  granero: ['el granero', BARN.x + 60, BARN.y + 50], puente: ['el puente del arroyo', BRIDGE.x - 80, BRIDGE.y + 8], camino_blanco: ['el Camino Blanco de las Delicias', (GG.x + BRIDGE.x) / 2, BRIDGE.y + 6],
  lago: ['el Lago de las Aguas Brillantes', BENCH.x + 40, BENCH.y + 22], bosque_encantado: ['el Bosque Encantado', 15 * T + 30, 30 * T + 24],
};
// what each one can do (the game checks every action against this)
const ABIL = {
  matthew: { ir: true, visitar: true, regalar: ['manzanas', 'bayas'], regar: true, cocinar: false, acompanar: false },
  marilla: { ir: false, visitar: false, regalar: ['tarta', 'compota', 'te'], regar: true, cocinar: true, acompanar: false },
  diana: { ir: true, visitar: true, regalar: ['manzanas', 'bayas', 'ramo'], regar: false, cocinar: false, acompanar: true },
  barry: { ir: false, visitar: false, regalar: ['manzanas', 'compota'], regar: false, cocinar: false, acompanar: false },
};
function abilText(who){
  const A = ABIL[who], L = [];
  if (A.ir) L.push('ir a algún lugar de Avonlea (' + Object.values(PLACES).map(p => p[0]).join(', ') + ') y quedarte un rato');
  if (A.visitar) L.push('ir a buscar a Ana para conversar');
  if (A.acompanar) L.push('acompañar a Ana a pasear');
  if (A.cocinar) L.push('cocinar (tarta de bayas, compota de manzana o té) y dejarlo en la mesa de la cocina para Ana');
  if (A.regar) L.push('regar la huerta');
  L.push('regalarle a Ana ' + A.regalar.map(k => ITEM_NAME[k][1]).join(', ') + ' (una vez al día, si es la estación)');
  return L.join('; ');
}

/* ---------- what each one knows ----------
   The game keeps Ana's diary of everything she does, and each character knows only what they saw (being near, or
   in the same room), what was done to them, and what their family told them at home (shared each morning). */
const sceneOf = k => k === 'marilla' ? 'gg' : k === 'barry' ? 'os' : k === 'diana' ? diana.where : 'out';
function witnesses(){
  return Object.keys(PEOPLE).filter(k => sceneOf(k) === game.scene && (game.scene !== 'out' || dist(PEOPLE[k].x, PEOPLE[k].y, ana.x, ana.y) < 320 || (k === 'diana' && diana.follow)));
}
function know(k, text, d = today() + 1){
  const a = game.know[k] = game.know[k] || [];
  if (a.some(e => e.t === text && e.d === d)) return;
  a.push({ d, s: S, t: text }); if (a.length > 30) a.splice(0, a.length - 30);
}
function logEv(text, who = witnesses()){
  const j = game.journal, e = { d: today() + 1, s: S, t: text };
  if (!(j.length && j[j.length - 1].t === text && j[j.length - 1].d === e.d)) { j.push(e); if (j.length > 80) j.splice(0, j.length - 80); }
  for (const k of new Set(who)) know(k, text);
}
function shareNews(){
  for (const [a, b] of [['matthew', 'marilla'], ['diana', 'barry']]) for (const [x, y] of [[a, b], [b, a]])
    for (const e of (game.know[x] || []).filter(e => e.d === today() && !e.t.startsWith('(') && !(game.know[y] || []).some(f => f.t === e.t))) know(y, '(' + NAMES[x] + ' le contó) ' + e.t, e.d);
}
// what was said in conversations, as the character will remember it
function remember(who, text){ const m = game.mem[who] = game.mem[who] || []; if (m.some(x => x.endsWith(': ' + text))) return; m.push('día ' + (today() + 1) + ': ' + text); if (m.length > 16) m.splice(0, m.length - 16); save(); }

/* ---------- errands: what the others ask Ana to do (the game checks they are done) ---------- */
const TASK_KINDS = ['ninguno', 'traer', 'regar', 'cocinar', 'recado', 'ir'];
const activeTasks = () => game.tasks.filter(t => !t.done);
function taskText(t){
  switch (t.tipo) {
    case 'traer': return `Llevarle ${itemText(t.item, t.n)} a ${NAMES[t.para]}`;
    case 'regar': return `Regar ${t.n} ${t.n > 1 ? 'canteros' : 'cantero'} de la huerta (${t.prog || 0}/${t.n})`;
    case 'cocinar': return `Cocinar ${ITEM_NAME[t.item][0]}`;
    case 'recado': return `Decirle a ${NAMES[t.para]}: «${t.recado}»`;
    default: return `Ir a ${PLACES[t.lugar][0]}`;
  }
}
function validTask(who, e){
  if (!e || !TASK_KINDS.includes(e.tipo) || e.tipo === 'ninguno' || activeTasks().length >= 3 || activeTasks().some(t => t.from === who && t.tipo === e.tipo)) return null;
  const n = clamp(Math.round(+e.cantidad || 1), 1, 5), para = PEOPLE[e.para] ? e.para : who, t = { from: who, tipo: e.tipo, n, para, d: today() };
  if (e.tipo === 'traer') { if (!ITEMS.includes(e.item) || !inSeason(e.item)) return null; t.item = e.item; }
  else if (e.tipo === 'regar') { if (S === 3) return null; t.n = Math.min(n, 6); t.prog = 0; }
  else if (e.tipo === 'cocinar') { if (!['tarta', 'compota', 'te'].includes(e.item) || !inSeason(e.item)) return null; t.item = e.item; }
  else if (e.tipo === 'recado') { const r = String(e.recado || '').trim().slice(0, 160); if (!r || para === who) return null; t.recado = r; }
  else if (e.tipo === 'ir') { if (!PLACES[e.lugar]) return null; t.lugar = e.lugar; }
  return t;
}
function addTask(t){ t.id = (game.taskSeq = (game.taskSeq || 0) + 1); game.tasks.push(t); logEv(`${NAMES[t.from]} le encargó a Ana: ${taskText(t)}.`, [t.from, ...witnesses()]); sfx.happy(); save(); }
function taskDone(t){
  t.done = true; float('📜 ¡Encargo cumplido!', ana.x, ana.y - 64); sfx.done();
  logEv(`Ana cumplió el encargo de ${NAMES[t.from]}: ${taskText(t)}.`);
  planSoon(t.from, `Ana cumplió el encargo que le diste (${taskText(t)})`); save();
}
// (watering, cooking and going somewhere are seen by the game itself)
function taskEvent(kind, k){
  for (const t of activeTasks()) {
    if (kind === 'regar' && t.tipo === 'regar' && ++t.prog >= t.n) taskDone(t);
    if (kind === 'cocinar' && t.tipo === 'cocinar' && t.item === k) taskDone(t);
    if (kind === 'ir' && t.tipo === 'ir' && game.scene === 'out' && dist(ana.x, ana.y, PLACES[t.lugar][1], PLACES[t.lugar][2]) < 110) taskDone(t);
  }
}
// bringing things and messages: done in a conversation with whoever they are for
function taskOptions(who){
  const o = [];
  for (const t of activeTasks()) {
    if (t.tipo === 'traer' && t.para === who && game.inv[t.item] >= t.n) o.push(['📜 Entregar ' + itemText(t.item, t.n), () => deliver(t)]);
    if (t.tipo === 'recado' && t.para === who) o.push(['📜 Darle el recado de ' + NAMES[t.from], () => passMessage(t)]);
  }
  return o;
}
function deliver(t){
  const who = t.para; game.inv[t.item] -= t.n; t.done = true; game.fond[who] = Math.min(5, game.fond[who] + 1);
  if (t.from === who) { t.thanked = true; game.fond[who] = Math.min(5, game.fond[who] + 1); }
  hearts(PEOPLE[who].x, PEOPLE[who].y - 56); sfx.done();
  logEv(`Ana le llevó ${itemText(t.item, t.n)} a ${NAMES[who]}` + (t.from === who ? ', como le había pedido.' : `, de parte de ${NAMES[t.from]}.`), [who, ...witnesses()]);
  if (t.from !== who) planSoon(t.from, `Ana cumplió el encargo que le diste (${taskText(t)})`);
  save();
  const note = t.from === who ? `(Ana te entrega ${itemText(t.item, t.n)}: el encargo que tú le pediste.)` : `(Ana te entrega ${itemText(t.item, t.n)} de parte de ${NAMES[t.from]}, que se lo encargó.)`;
  if (aiReady()) aiTalk(who, note); else say(who, '¡Gracias, Ana! Justo lo que hacía falta.', [['De nada', close]]);
}
function passMessage(t){
  const who = t.para; t.done = true; know(who, `${NAMES[t.from]} le mandó a decir con Ana: «${t.recado}»`);
  logEv(`Ana le dio a ${NAMES[who]} el recado de ${NAMES[t.from]}.`, [who]); planSoon(t.from, `Ana le dio tu recado a ${NAMES[who]}`); planSoon(who, `Ana te trajo un recado de ${NAMES[t.from]}: «${t.recado}»`); sfx.done(); save();
  if (aiReady()) aiTalk(who, `(Ana te trae un recado de ${NAMES[t.from]}: «${t.recado}»)`); else say(who, 'Vaya, gracias por avisarme, Ana.', [['De nada', close]]);
}
// on meeting someone: thanks for an errand done, a present they had planned, why they came looking for her
function talkPrelude(who){
  const n = [], p = PEOPLE[who];
  for (const t of game.tasks.filter(t => t.from === who && t.done && !t.thanked)) { t.thanked = true; game.fond[who] = Math.min(5, game.fond[who] + 1); hearts(p.x, p.y - 56); n.push(`Ana cumplió el encargo que le pediste (${taskText(t)}); agradéceselo.`); }
  const k = game.giftFor[who];
  if (k && ABIL[who].regalar.includes(k) && inSeason(k) && game.npcGiftDay[who] !== today()) { const q = k === 'bayas' || k === 'manzanas' ? 3 : 1; game.inv[k] += q; game.npcGiftDay[who] = today(); float('+' + itemText(k, q), ana.x, ana.y - 60); logEv(`${NAMES[who]} le regaló a Ana ${itemText(k, q)}.`, [who, ...witnesses()]); n.push(`Le das a Ana ${itemText(k, q)}, como tenías pensado.`); }
  delete game.giftFor[who];
  if (p.wantsTalk) { n.push(`Tú fuiste a buscar a Ana${p.why ? ' (' + p.why + ')' : ''}.`); p.wantsTalk = false; }
  save();
  return n;
}
// something a character does right away, decided in a conversation (checked against what they can do)
function applyAction(who, a){
  if (!a || !a.tipo || a.tipo === 'ninguna') return;
  const A = ABIL[who], p = PEOPLE[who];
  if (a.tipo === 'regalar' && A.regalar.includes(a.item) && inSeason(a.item) && game.npcGiftDay[who] !== today()) {
    const q = clamp(Math.round(+a.cantidad || 1), 1, 3); game.inv[a.item] += q; game.npcGiftDay[who] = today();
    float('+' + itemText(a.item, q), ana.x, ana.y - 60); logEv(`${NAMES[who]} le regaló a Ana ${itemText(a.item, q)}.`, [who, ...witnesses()]); sfx.happy();
  } else if (a.tipo === 'acompanar' && A.acompanar && diana.where === game.scene && !diana.follow) { diana.follow = true; logEv('Ana y Diana salieron a pasear juntas.', ['diana', ...witnesses()]); }
  else if (a.tipo === 'ir' && A.ir && PLACES[a.lugar]) { p.target = { place: a.lugar, until: hourNow() + 2 }; if (who === 'diana') diana.follow = false; }
  save();
}

/* ---------- plans: each morning (and when something happens) the AI plans the day of each one ---------- */
const PLAN_SCHEMA = { type: 'object', additionalProperties: false, required: ['pensamiento', 'pasos'], properties: {
  pensamiento: { type: 'string' },
  pasos: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['hora', 'accion', 'lugar', 'item', 'motivo'], properties: {
    hora: { type: 'integer' }, accion: { type: 'string', enum: ['ir', 'esperar', 'visitar_a_ana', 'cocinar', 'regar', 'regalar'] },
    lugar: { type: 'string', enum: ['', ...Object.keys(PLACES)] }, item: { type: 'string', enum: ['', ...ITEMS] }, motivo: { type: 'string' } } } } } };
const planQ = [], planAt = {};
let planBusy = false, planWait = 0;
function planSoon(who, reason, force = false){
  if (!aiReady() || planQ.some(q => q[0] === who)) return;
  const at = today() * 24 + hourNow();
  if (!force && planAt[who] != null && at - planAt[who] < 1.5) return;
  planAt[who] = at; planQ.push([who, reason]); pumpPlans();
}
async function pumpPlans(){
  if (planBusy || !planQ.length || !aiReady()) return;
  planBusy = true;
  const [who, reason] = planQ.shift();
  try { await makePlan(who, reason); } catch (e) { console.debug('[avonlea IA] plan', who, e.message); planWait = 60; }
  planBusy = false; pumpPlans();
}
function validStep(who, s, h0){
  const A = ABIL[who], h = Math.round(+s.hora);
  if (!(h >= h0 && h <= 23)) return null;
  const st = { hora: h, accion: s.accion, lugar: s.lugar, item: s.item, motivo: String(s.motivo || '').slice(0, 160) };
  if (s.accion === 'ir') return A.ir && PLACES[s.lugar] ? st : null;
  if (s.accion === 'visitar_a_ana') return A.visitar ? st : null;
  if (s.accion === 'cocinar') return A.cocinar && ['tarta', 'compota', 'te'].includes(s.item) ? st : null;
  if (s.accion === 'regar') return A.regar && S !== 3 ? st : null;
  if (s.accion === 'regalar') return A.regalar.includes(s.item) ? st : null;
  return s.accion === 'esperar' ? st : null;
}
async function makePlan(who, reason){
  const h0 = Math.ceil(hourNow());
  if (h0 > 22) return;
  const msg = stateText(who) + `\n\nAHORA PASA: ${reason}.\nPLANIFICA lo que ${NAMES[who]} hará en lo que queda de hoy (son las ${Math.floor(hourNow())}:00; el día termina a las 24). "pensamiento": una o dos frases en primera persona, con la voz de ${NAMES[who]}, sobre qué piensa hacer hoy y por qué. "pasos": de 1 a 4 acciones en orden, con "hora" entera entre ${h0} y 23, usando solo lo que ${NAMES[who]} puede hacer; "lugar" solo para ir, "item" solo para cocinar o regalar (si no, ""), y "motivo" en pocas palabras.`;
  const r = await aiCall([{ role: 'user', content: msg }], PLAN_SCHEMA);
  const steps = (Array.isArray(r.out.pasos) ? r.out.pasos : []).map(s => validStep(who, s, h0)).filter(Boolean).sort((a, b) => a.hora - b.hora).slice(0, 4);
  game.plans[who] = { day: today(), thought: String(r.out.pensamiento || '').slice(0, 300), steps, reason };
  save();
}
function doStep(who, s){
  const p = PEOPLE[who];
  p.why = s.motivo;
  if (s.accion === 'ir') p.target = { place: s.lugar, until: hourNow() + 2.5 };
  else if (s.accion === 'visitar_a_ana') p.target = { ana: true, until: hourNow() + 2.5 };
  else if (s.accion === 'esperar') p.target = null;
  else if (s.accion === 'cocinar') { game.table = s.item; logEv(`Marilla cocinó ${ITEM_NAME[s.item][0]} y la dejó en la mesa de la cocina para Ana.`, ['marilla', 'matthew']); if (game.scene === 'gg') float('Marilla dejó ' + ITEM_NAME[s.item][0] + ' en la mesa', TABLE.x, TABLE.y - 60); }
  else if (s.accion === 'regar') { if (S !== 3) { BEDS.forEach(b => { if (!b.wet && b.stage < 3) { b.wet = 1; b.grow = 0; } }); logEv(`${NAMES[who]} regó la huerta.`, [who, who === 'matthew' ? 'marilla' : 'matthew']); } }
  else if (s.accion === 'regalar') game.giftFor[who] = s.item;
  save();
}
// carrying the plans out: the steps whose hour has come (of several at once, only the last walk counts)
function runPlans(dt){
  if ((planWait -= dt) < 0 && aiReady()) { planWait = 3; for (const who of Object.keys(PEOPLE)) if ((!game.plans[who] || game.plans[who].day !== today()) && hourNow() < 22) planSoon(who, game.plans[who] ? 'Empieza un nuevo día' : 'Ana empieza su día en Avonlea', true); }
  const h = hourNow();
  for (const who of Object.keys(PEOPLE)) {
    const P = game.plans[who]; if (!P || P.day !== today()) continue;
    const due = P.steps.filter(s => !s.done && s.hora <= h); if (!due.length) continue;
    due.forEach(s => { s.done = true; });
    const walks = due.filter(s => ['ir', 'visitar_a_ana', 'esperar'].includes(s.accion));
    for (const s of due) if (!walks.includes(s) || s === walks[walks.length - 1]) doStep(who, s);
  }
}
// someone with a place to go walks there (if Ana is indoors they just get there); stuck behind a tree, they step aside
function goTarget(p, dt, sp){
  const tg = p.target;
  if (!tg || hourNow() > tg.until) { p.target = null; return false; }
  if (tg.ana && game.scene !== 'out') return false;
  const [tx, ty] = tg.ana ? [ana.x + (p.x < ana.x ? -30 : 30), ana.y] : PLACES[tg.place].slice(1);
  if (game.scene !== 'out') { p.x = tx; p.y = ty; return true; }
  if (dist(p.x, p.y, tx, ty) < 26) { p.moving = false; if (tg.ana) { p.target = null; p.wantsTalk = true; p.dir = ana.x < p.x ? 3 : 1; float(NAMES[p.look] + ' te buscaba', p.x, p.y - 64); } return true; }
  const ox = p.x, oy = p.y; walkTo(p, tx, ty, sp, dt);

  else p.stuck = 0;
  return true;
}

/* ---------- the prompt ---------- */
const AI_SYSTEM = `Eres la voz de los personajes de "Un día en Avonlea", un juego tranquilo y sin misiones inspirado en "Ana de las Tejas Verdes" (L. M. Montgomery, 1908). La jugadora es Ana Shirley. Tú das voz y vida al personaje con quien Ana conversa, o planificas su día. Escribe siempre en español, con tuteo entre Ana y su familia y amigas.

EL MUNDO
Avonlea, en la Isla del Príncipe Eduardo, hacia 1880. Lugares: Tejas Verdes (la granja de los Cuthbert, casa blanca de tejados verdes, con su cocina, su huerta de seis canteros con rosas, girasoles y lilas, la bomba de agua y el granero), La Cuesta del Huerto (la casa de los Barry, con su salita, su chimenea y su huerto de manzanos), el arroyo con su puente de madera, el Camino Blanco de las Delicias (con cerezos), el Lago de las Aguas Brillantes (con una banca) y el Bosque Encantado (oscuro, de pinos, que Ana y Diana "encantaron" con su imaginación y ahora les da miedo).
Las estaciones duran dos días: en primavera florecen los manzanos y cerezos; en verano y otoño hay bayas en los arbustos y manzanas en el huerto de los Barry; en otoño las hojas se ponen rojas y doradas; en invierno nieva, el lago se congela y la huerta duerme bajo la nieve.

LO QUE ANA PUEDE HACER EN EL JUEGO
Pasear; acariciar a Toby, el perro de Tejas Verdes (no habla); tomar la regadera en la bomba y regar la huerta, que crece hasta florecer, y cortar flores para hacer ramos (no en invierno); recoger bayas y manzanas (solo en verano y otoño); cocinar en la cocina de Tejas Verdes tarta de bayas (con 3 bayas), compota de manzana (con 3 manzanas) o té; regalar lo que tiene; tomar el té con Diana en la salita de los Barry; calentarse junto a la chimenea; pasear con Diana; sentarse en la banca del lago; llevar cosas o recados de unos a otros.

LOS PERSONAJES
- Ana Shirley: once años, huérfana, la adoptaron los Cuthbert. Pelirroja (detesta su pelo), pecosa, de imaginación desbordante, habla mucho y con palabras grandiosas ("alma gemela", "espíritu afín", "hay tanto lugar para la imaginación"), dramática, se mete en líos sin querer y es muy cariñosa.
- Matthew Cuthbert: unos sesenta años, hermano de Marilla. Tímidísimo, de muy pocas palabras, le dan miedo casi todas las mujeres, pero adora a Ana y siempre se pone de su lado. Trabaja en la granja: las vacas, el heno, el granero. Muletillas: "Bueno, pues...", "Ya lo creo, ya lo creo". Frases cortas, titubeantes, tiernas.
- Marilla Cuthbert: hermana de Matthew, severa, práctica y ordenada, con un humor seco que esconde; quiere mucho a Ana aunque le cuesta decirlo, y la reprende por soñar despierta o hablar demasiado. Lleva siempre su broche de amatista. Se ocupa de la casa y de la cocina, y no sale de ella.
- Diana Barry: la amiga del alma de Ana, de pelo negro y rizado, dulce, alegre y un poco miedosa; admira la imaginación de Ana. Se juraron amistad eterna. Una vez Ana le sirvió por error vino de grosellas creyendo que era cordial de frambuesa, Diana se emborrachó y su madre les prohibió verse por un tiempo: ahora lo recuerdan entre risas y vergüenza. Está en su jardín de día y en casa al atardecer y en invierno.
- Sra. Barry: la madre de Diana. Correcta, estricta y algo estirada; desconfió de Ana después de lo del vino, pero ahora la aprecia, con cierta cautela. No sale de su salita.
Fuera de escena existen la escuela, la señorita Stacy, la Sra. Rachel Lynde (la vecina chismosa), Gilbert Blythe (que una vez le dijo "Zanahorias" a Ana) y la iglesia; se pueden nombrar en la conversación, pero no aparecen en el juego.

LO QUE CADA PERSONAJE SABE
Cada uno sabe solo lo que vio, lo que le contaron en su casa y lo que conversó con Ana: está en su estado. No sabe lo que no está ahí (por ejemplo, Marilla no sabe lo que Ana hizo en casa de los Barry, a menos que se lo cuenten).

CONVERSAR (cuando te piden la respuesta del personaje)
- Habla solo como ese personaje, con su voz propia. Una a tres frases cortas: unas 40 palabras como máximo.
- Ten en cuenta lo que es verdad ahora (la hora, la estación, el lugar, lo que Ana lleva, quién la acompaña), lo que el personaje sabe y recuerda, y su plan de hoy; nombra a veces, con naturalidad, algo de eso; no lo enumeres todo y no repitas lo que ya dijiste en esta conversación.
- No contradigas el estado: no hay manzanas ni bayas en primavera ni en invierno, ni flores en invierno; si Ana no lleva algo, no lo tiene.
- No inventes sucesos que el juego tendría que mostrar; las únicas cosas que pueden pasar son las de "encargo" y "accion".
- El cariño (de 0 a 5) cambia el tono: con poco cariño el personaje es más reservado, con mucho es más cálido y cercano.
- Nunca hables de juegos, puntos, corazones, inteligencia artificial ni cosas modernas.
- "replies": dos o tres cosas distintas que Ana podría decir a continuación, con la voz de Ana, de 12 palabras como máximo cada una. No incluyas despedidas, regalos ni aceptar encargos: el juego los agrega solo.
- "memory": si en este intercambio se dijo algo nuevo que el personaje recordaría días después (un secreto, una promesa, un plan, algo que Ana contó), una frase corta en tercera persona desde el personaje (por ejemplo "Ana le contó que quiere ser poetisa"); si no, "".
- "encargo": de vez en cuando (no en cada conversación, y nunca si Ana ya tiene 3 encargos o ya tiene uno tuyo pendiente), el personaje puede pedirle algo a Ana, si va con su carácter y con la estación, y lo dice en "text". Tipos: "traer" (llevar "cantidad" de "item" a "para", que puede ser el mismo personaje), "regar" ("cantidad" de canteros, no en invierno), "cocinar" ("item": tarta, compota o te), "recado" (decirle "recado" a "para", otro personaje), "ir" (ir a "lugar"). Marilla pide tareas de la casa y la huerta; Matthew casi nunca pide nada, y si lo hace es tímido; Diana propone juegos, ir a lugares y recados para su madre; la Sra. Barry, recados para Marilla. Si no hay encargo, "tipo": "ninguno". Los campos que no se usan van vacíos ("" o 0).
- "accion": algo que el personaje hace ahora mismo, solo de lo que puede hacer (está en su estado): "regalar" ("item" y "cantidad" de 1 a 3), "acompanar" (Diana sale a pasear con Ana), "ir" (se va a "lugar"). Si no hace nada, "tipo": "ninguna".

PLANIFICAR (cuando te piden el plan del día)
- Piensa como el personaje: su carácter, su trabajo, la estación, la hora, lo que sabe, lo que recuerda, los encargos que dio y lo que acaba de pasar.
- Usa solo las acciones que ese personaje puede hacer. Planes sencillos y propios de su vida: Matthew trabaja en el granero, a veces pasea y busca a Ana para darle algo; Marilla cocina y riega; Diana juega, pasea a lugares bonitos y a veces busca a Ana; la Sra. Barry casi solo espera en su salita y a veces prepara un regalo.`;
const S_ITEM = { type: 'string', enum: ['', ...ITEMS] }, S_WHO = { type: 'string', enum: ['', ...Object.keys(PEOPLE)] }, S_PLACE = { type: 'string', enum: ['', ...Object.keys(PLACES)] };

/* ---------- calling the AI ---------- */
async function post(url, headers, body){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 45000);
  let res;
  try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'tardó demasiado' : 'sin conexión'); }
  finally { clearTimeout(timer); }
  return { res, data: await res.json().catch(() => ({})) };
}
const httpError = (res, data) => new Error({ 401: 'la clave no es válida', 403: 'la clave no tiene permiso', 429: 'demasiadas conversaciones seguidas (o sin saldo), espera un poco', 529: 'el servicio está saturado' }[res.status] || ('error ' + res.status + (data.error?.message ? ': ' + data.error.message : '')));
function parseJSON(txt){ try { const o = JSON.parse(txt); if (o && typeof o === 'object') return o; } catch (e) {} throw new Error('respuesta incompleta'); }
const aiCall = (messages, schema = AI_SCHEMA) => provider() === 'openai' ? openaiCall(messages, schema) : claudeCall(messages, schema);
// OpenAI (Chat Completions): the fixed prompt goes first so it is cached automatically; the answer must fit the schema
async function openaiCall(messages, schema, strict = true){
  const body = { model: AI.model, max_completion_tokens: 4000, messages: [{ role: 'system', content: AI_SYSTEM + (strict ? '' : '\n\nResponde solo con un objeto JSON que siga este esquema: ' + JSON.stringify(schema)) }, ...messages] };
  if (strict) { body.response_format = { type: 'json_schema', json_schema: { name: 'respuesta', strict: true, schema } }; body.reasoning_effort = 'low'; }
  else body.response_format = { type: 'json_object' };
  const { res, data } = await post('https://api.openai.com/v1/chat/completions', { 'content-type': 'application/json', authorization: 'Bearer ' + aiKey() }, body);
  // (if the model does not take the schema or the effort setting, ask again more simply)
  if (!res.ok) { if (res.status === 400 && strict) return openaiCall(messages, schema, false); throw httpError(res, data); }
  const msg = data.choices?.[0]?.message || {};
  if (msg.refusal) throw new Error('no quiso responder eso');
  console.debug('[avonlea IA]', data.model, data.usage);
  return { content: msg.content || '', out: parseJSON(msg.content || '') };
}
// Claude (Messages API): the fixed prompt is marked for caching
async function claudeCall(messages, schema, retry = true){
  const body = { model: AI.model, max_tokens: 4000, system: [{ type: 'text', text: AI_SYSTEM, cache_control: { type: 'ephemeral' } }], messages, output_config: { format: { type: 'json_schema', schema } } };
  const headers = { 'content-type': 'application/json', 'x-api-key': aiKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
  // (low effort: quick answers for a chat; on the Opus and Sonnet models, a declined answer is retried on another model)
  if (AI.model !== 'claude-haiku-4-5') { body.output_config.effort = 'low'; if (retry) { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; } }
  const { res, data } = await post('https://api.anthropic.com/v1/messages', headers, body);
  if (!res.ok) {
    if (res.status === 400 && retry && /fallback/i.test(data.error?.message || '')) return claudeCall(messages, schema, false);
    throw httpError(res, data);
  }
  if (data.stop_reason === 'refusal') throw new Error('no quiso responder eso');
  console.debug('[avonlea IA]', data.model, data.usage);
  return { content: data.content, out: parseJSON((data.content || []).filter(b => b.type === 'text').map(b => b.text).join('')) };
}

function aiTalk(who, userText){

  c.turns++;
  say(who, NAMES[who] + ' está pensando…', [['Adiós', close]], true);
  aiCall(c.msgs).then(r => {
    if (conv !== c || game.talk?.who !== who) return;
    const o = r.out, text = typeof o.text === 'string' ? o.text.trim() : '';
    if (!text) throw new Error('respuesta vacía');
    c.msgs.push({ role: 'assistant', content: r.content });
    if (typeof o.memory === 'string' && o.memory.trim()) remember(who, o.memory.trim());
    applyAction(who, o.accion);
    const opts = [], req = validTask(who, o.encargo);
    if (req) {
      opts.push(['📜 Sí, lo haré', () => { addTask(req); aiTalk(who, `(Ana acepta el encargo: ${taskText(req)}.)`); }]);
      opts.push(['Ahora no puedo', () => aiTalk(who, '(Ana dice que ahora no puede hacer ese encargo.)')]);
    }

    if (c.turns < 6) for (const q of (Array.isArray(o.replies) ? o.replies : []).filter(q => typeof q === 'string' && q.trim()).slice(0, 3)) opts.push(['«' + q.trim() + '»', () => { logEv('Ana conversó con ' + NAMES[who] + '.', [who]); aiTalk(who, 'Ana dice: «' + q.trim() + '»'); }]);

    for (const [k, [name]] of Object.entries(GIFTS)) if (game.inv[k] > 0) opts.push(['Regalar ' + name, () => give(who, k)]);
    opts.push(...walkOption(who), ['Adiós', close]);
    say(who, text, opts);
  }).catch(err => {
    if (conv !== c) return;

}
