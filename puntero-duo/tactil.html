<title>Puntero C</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&family=Cutive+Mono&display=swap">
<style>
/* Cuaderno en vertical: arriba el dibujo (margen = stack, hoja = heap) con el código en C al lado; abajo, las líneas candidatas para escribir. Un solo look de papel, a propósito. */
:root{
  color-scheme: light;
  --paper:#fbf8ef;
  --paper-2:#f3eedf;
  --graphite:#2e2c2a;
  --soft:#6f6a62;
  --margin:#e0726a;
  --ink:#2350b8;
  --note:#ffe27a;
  --ok:#2f8a4c;
  --bad:#c23a32;
  --bad-bg:#fff1ee;
  --warn:#b7791f;
  --display:"Caveat","Comic Sans MS",cursive;
  --body:"Patrick Hand","Comic Sans MS",system-ui,sans-serif;
  --code:"Cutive Mono","Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--graphite);font-family:var(--body);font-size:17px;line-height:1.25;
  padding-inline:16px;padding-block:8px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:980px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}

header{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--margin);padding-bottom:4px;min-width:0}
h1{font-family:var(--display);font-size:28px;margin:0;line-height:1;white-space:nowrap}
h1 span{color:var(--ink)}
.lv{flex:1;min-width:0;font-size:16px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-family:var(--body);font-size:19px;line-height:1;width:34px;height:34px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:10px 4px 10px 4px / 4px 10px 4px 10px;cursor:pointer;flex:none;padding:0}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(132px,42%);gap:8px;min-height:0}
@media (min-width:700px){ .main{grid-template-columns:minmax(0,1fr) 340px} }
.boardcell{position:relative;min-height:0;min-width:0;display:flex;align-items:flex-start;justify-content:center}
canvas#cv{display:block;touch-action:manipulation;border:2px solid var(--graphite);border-radius:6px 12px 8px 10px / 10px 6px 12px 8px;background:var(--paper)}

.code{min-height:0;min-width:0;overflow-y:auto;background:#fffdf6;border:1.5px solid var(--graphite);border-radius:4px 10px 6px 8px;
  padding:6px 7px;font-family:var(--code);font-size:clamp(11.5px,3vw,14.5px);line-height:1.4;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.code div{white-space:pre-wrap}
.code .dim{color:var(--soft)}
.code .goal{color:var(--ok)}
.code .err{color:var(--bad)}
.code .leak{color:var(--warn)}
.code .new{background:var(--note);animation:fade 1.6s ease-out forwards}
@keyframes fade{to{background:transparent}}

.choose{display:flex;flex-direction:column;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.choose .ask{font-size:15px;color:var(--soft);margin:0}
.opts{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:700px){ .opts{grid-template-columns:1fr 1fr} }
.opt{font-family:var(--code);font-size:clamp(13px,3.6vw,16px);text-align:left;min-height:38px;padding:5px 10px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt:active{background:var(--note)}
.opt.tried{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--soft);border-style:dashed}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.fb{border:2px solid var(--bad);background:var(--bad-bg);border-radius:12px 5px 12px 5px / 5px 12px 5px 12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fb code{font-family:var(--code);color:var(--bad);font-size:15px}
.fb p{margin:0}
.fb button{align-self:flex-start;font-family:var(--body);font-size:18px;padding:5px 14px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,248,239,.85);padding:6px;z-index:2}
.card{background:#fffdf6;border:2.5px solid var(--graphite);border-radius:18px 6px 16px 8px / 8px 16px 6px 18px;padding:14px 16px;max-width:430px;width:100%;
  display:flex;flex-direction:column;gap:9px;box-shadow:4px 5px 0 rgba(46,44,42,.18);max-height:100%;overflow-y:auto}
.card h2{font-family:var(--display);font-size:32px;margin:0;line-height:1;text-wrap:balance}
.card p{margin:0}
.card code{font-family:var(--code);font-size:.9em;background:var(--paper-2);padding:0 3px}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card button{font-family:var(--body);font-size:19px;padding:7px 16px;border:2px solid var(--graphite);background:var(--note);color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer}
.card button.sec{background:#fffdf6}
.stars{font-size:36px;letter-spacing:4px;color:#d9a400;line-height:1}
</style>

<div class="app">
  <header>
    <h1>Puntero <span>C</span></h1>
    <span class="lv" id="lvname">—</span>
    <button class="mini" id="bprev" aria-label="Nivel anterior">‹</button>
    <button class="mini" id="bnext" aria-label="Nivel siguiente">›</button>
    <button class="mini" id="breset" aria-label="Reiniciar nivel">⟲</button>
    <button class="mini" id="bhelp" aria-label="Ayuda">?</button>
  </header>

  <div class="main">
    <div class="boardcell" id="cell">
      <canvas id="cv" aria-label="Tablero: variables en el margen, nodos en la hoja"></canvas>
      <div class="overlay" id="ov" hidden></div>
    </div>
    <div class="code" id="code" aria-live="polite"></div>
  </div>

  <div class="choose">
    <p class="ask" id="ask">¿Qué línea escribes ahora?</p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" hidden>
      <code id="fbcode"></code>
      <p id="fbwhy"></p>
      <button id="fbok">↶ Deshacer y elegir otra</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
// ───────────────────────── tablero lógico ─────────────────────────
const LW = 250, LH = 440;
const MX = 70;                     // línea roja del margen: a la izquierda el stack, a la derecha el heap
const NW = 62, NH = 30, DW = 40;   // nodo: [value | next]
const PW = 60, PH = 26;            // post-it de variable
const X1 = 136, X2 = 212;
const Y = i => 40 + i * 70;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ───────────────────────── semántica de C ─────────────────────────
class Crash { constructor(msg) { this.msg = msg; } }
const SEG = 'Segmentation fault: se leyó a través de un puntero NULL.';
const UAF = 'Uso después de free: ese nodo ya fue liberado.';
const get = name => { const v = varNamed(name); return v ? v.t : null; };
const nx = n => { if (!n) throw new Crash(SEG); if (n.freed) throw new Crash(UAF); return n.next; };
const setV = (name, n) => { varNamed(name).t = n; };
const setNext = (n, m) => { if (!n) throw new Crash(SEG); if (n.freed) throw new Crash(UAF); n.next = m; };
const decl = (name, n) => { const v = varNamed(name); v.declared = true; v.slot = S.slot++; v.t = n; };
const freeN = n => { if (!n) return; if (n.freed) throw new Crash('double free: ese nodo ya estaba liberado.'); n.freed = true; };
const create = v => {
  const [x, y] = S.L.spawn || [X2, Y(1)];
  const n = mkNode(v, x, y); n.py -= 30; S.nodes.push(n); return n;
};
const declared = name => { const v = varNamed(name); return !!(v && v.declared); };
const O = (code, run, why, when) => ({ code, run, why, when });

/* ───────────────────────── niveles ─────────────────────────
   kind 'search': las opciones se generan del estado (ver searchOptions).
   kind 'script': grupos en orden. Un grupo `all` exige todas sus líneas (en cualquier orden);
   un grupo `any` se cumple con cualquiera de ellas. `bad` son las líneas malas que se ofrecen. */
const LEVELS = [
  { name: '¿Está el 7?', kind: 'search', x: 7, list: [4, 1, 9, 7, 3],
    sig: 'int esta(Lista *l, int x)',
    intro: 'Queremos saber si el 7 está en la lista. Al comienzo solo tienes <code>l->head</code>: no hay ningún puntero para recorrer.<br><br>Elige en cada paso la línea correcta. Los datos están ocultos (<code>?</code>): cada vez que preguntas <code>if (p->value == 7)</code> y la respuesta es no, el nodo pasa a <code>≠7</code>. Es lo único que sabes con certeza.' },

  { name: '¿Está el 5?', kind: 'search', x: 5, list: [6, 2, 8, 3],
    sig: 'int esta(Lista *l, int x)',
    intro: 'Ahora buscas el 5. Si no está, la única forma de saberlo es revisar <b>todos</b> los nodos hasta que <code>p</code> sea <code>NULL</code>.' },

  { name: 'Insertar el 2', kind: 'script', list: [1, 3], spawn: [X2, Y(1)], goal: [1, 2, 3],
    sig: 'void insertar(Lista *l)',
    intro: 'Inserta un nodo con el 2 entre el 1 y el 3.<br><br>Necesitas tres punteros: <code>p</code> al nodo después del cual insertas, <code>sig</code> para guardar el que sigue (si no, se pierde) y <code>nuevo</code> para el nodo creado.',
    groups: [
      { all: [O('Nodo *p = l->head;', () => decl('p', get('l->head')))],
        bad: [O('Nodo *p = l->head->next;', () => decl('p', nx(get('l->head'))), 'p quedó en el 3. Para insertar después del 1, p tiene que apuntar al 1.'),
              O('l->head = crearNodo(2);', () => setV('l->head', create(2)), 'Pisaste la cabeza: el 1 y el 3 quedaron sin ninguna referencia.'),
              O('Nodo p = l->head;', null, 'Error de compilación: l->head es un Nodo *, no un Nodo. Falta el asterisco.'),
              O('p = l->head;', null, "Error de compilación: 'p' no está declarada. Hay que escribir Nodo *p.")] },
      { all: [O('Nodo *sig = p->next;', () => decl('sig', nx(get('p')))),
              O('Nodo *nuevo = crearNodo(2);', () => decl('nuevo', create(2)))],
        bad: [O('p->next = crearNodo(2);', () => setNext(get('p'), create(2)), 'Enganchaste el 2, pero el 3 quedó sin referencia: fuga de memoria. Primero guarda el siguiente en sig.', () => !declared('sig')),
              O('Nodo *sig = p;', () => decl('sig', get('p')), 'sig debe guardar el nodo que sigue a p (el 3), no el mismo nodo de p.', () => !declared('sig')),
              O('Nodo *nuevo = p->next;', () => decl('nuevo', nx(get('p'))), 'Eso no crea un nodo: nuevo apunta al 3, que ya existía.', () => !declared('nuevo')),
              O('p->value = 2;', () => { get('p').v = 2; }, 'Eso sobrescribe el 1. No inserta nada.'),
              O('p = p->next;', () => setV('p', nx(get('p'))), 'p se fue al 3. Ahora no puedes volver al 1 para enganchar el nuevo nodo.')] },
      { all: [O('p->next = nuevo;', () => setNext(get('p'), get('nuevo'))),
              O('nuevo->next = sig;', () => setNext(get('nuevo'), get('sig')))],
        bad: [O('nuevo->next = p;', () => setNext(get('nuevo'), get('p')), 'El 2 apuntaría hacia atrás, al 1: se forma un ciclo.'),
              O('sig->next = nuevo;', () => setNext(get('sig'), get('nuevo')), 'Eso pone el 2 después del 3, no entre el 1 y el 3.'),
              O('p = nuevo;', () => setV('p', get('nuevo')), 'Moviste la variable p. Ninguna flecha de la lista cambió.'),
              O('nuevo = sig;', () => setV('nuevo', get('sig')), 'Moviste la variable nuevo. Si el 2 no estaba enganchado, quedó perdido.')] },
    ] },

  { name: 'Borrar el 13', kind: 'script', list: [1, 2, 13, 4], bug: 13, goal: [1, 2, 4],
    sig: 'void borrar13(Lista *l)',
    intro: 'Saca el 13 de la lista <b>y libera su memoria</b>. Para borrar un nodo hay que pararse en el anterior y guardar el que se va en otro puntero, porque si no, no hay con qué hacer <code>free</code>.',
    groups: [
      { all: [O('Nodo *p = l->head;', () => decl('p', get('l->head')))],
        bad: [O('Nodo *p = l->head->next->next;', () => decl('p', nx(nx(get('l->head')))), 'p quedó en el 13. Para sacarlo necesitas el nodo anterior, y en una lista simple no se puede retroceder.'),
              O('free(l->head);', () => freeN(get('l->head')), 'Liberaste el 1, que sigue en la lista. Ahora l->head apunta a memoria liberada.'),
              O('l->head = l->head->next;', () => setV('l->head', nx(get('l->head'))), 'Moviste la cabeza: el 1 quedó fuera de la lista y sin referencia.')] },
      { all: [O('p = p->next;', () => setV('p', nx(get('p'))))],
        bad: [O('p = p->next->next;', () => setV('p', nx(nx(get('p')))), 'Te pasaste: p está en el 13 y no hay vuelta atrás.'),
              O('p->next = NULL;', () => setNext(get('p'), null), 'Cortaste la lista después del 1: el 2, el 13 y el 4 quedaron sin referencia.'),
              O('free(p->next);', () => freeN(nx(get('p'))), 'Liberaste el 2, que no era el que había que borrar.')] },
      { all: [O('Nodo *borrar = p->next;', () => decl('borrar', nx(get('p'))))],
        bad: [O('free(p->next);', () => freeN(nx(get('p'))), 'Liberaste el 13, pero p->next sigue apuntando ahí (puntero colgante) y el 4 quedó inalcanzable.'),
              O('p->next = p->next->next;', () => setNext(get('p'), nx(nx(get('p')))), 'El 13 salió de la lista, pero nadie lo apunta: ya no puedes hacerle free. Fuga de memoria.'),
              O('Nodo *borrar = p;', () => decl('borrar', get('p')), 'borrar quedó en el 2. Tiene que apuntar al 13.')] },
      { all: [O('p->next = borrar->next;', () => setNext(get('p'), nx(get('borrar'))))],
        bad: [O('free(borrar);', () => freeN(get('borrar')), 'El 13 sigue enganchado: p->next quedaría apuntando a memoria liberada.'),
              O('borrar = borrar->next;', () => setV('borrar', nx(get('borrar'))), 'Moviste borrar al 4. La lista no cambió.'),
              O('p->next = borrar;', () => setNext(get('p'), get('borrar')), 'p->next ya apuntaba al 13. No cambia nada.')] },
      { all: [O('free(borrar);', () => freeN(get('borrar')))],
        bad: [O('borrar = NULL;', () => setV('borrar', null), 'Nadie liberó el 13: queda ocupando memoria sin que nada lo apunte. Fuga.'),
              O('free(p);', () => freeN(get('p')), 'Liberaste el 2, que sigue en la lista.'),
              O('free(borrar->next);', () => freeN(nx(get('borrar'))), 'Liberaste el 4, que sigue en la lista.')] },
    ] },

  { name: 'Pila: push', kind: 'script', list: [5, 2], spawn: [X2, Y(0)], goal: [8, 5, 2],
    sig: 'void push(Lista *l)',
    intro: 'Una pila crece por <code>l->head</code>. Haz push del 8: crea el nodo, haz que apunte al tope actual y luego mueve la cabeza. El orden importa.',
    groups: [
      { all: [O('Nodo *nuevo = crearNodo(8);', () => decl('nuevo', create(8)))],
        bad: [O('l->head = crearNodo(8);', () => setV('l->head', create(8)), 'Pisaste la cabeza: el 5 y el 2 quedaron sin referencia.'),
              O('Nodo *nuevo = l->head;', () => decl('nuevo', get('l->head')), 'Eso no crea un nodo: nuevo apunta al 5.'),
              O('Nodo nuevo = crearNodo(8);', null, 'Error de compilación: crearNodo devuelve un Nodo *. Falta el asterisco.')] },
      { all: [O('nuevo->next = l->head;', () => setNext(get('nuevo'), get('l->head')))],
        bad: [O('l->head = nuevo;', () => setV('l->head', get('nuevo')), 'Si mueves la cabeza primero, el 5 y el 2 quedan sin referencia: fuga.'),
              O('l->head->next = nuevo;', () => setNext(get('l->head'), get('nuevo')), 'Eso engancha el 8 después del 5, y el 2 queda perdido.'),
              O('nuevo->next = l->head->next;', () => setNext(get('nuevo'), nx(get('l->head'))), 'El 8 apuntaría al 2: te saltas el 5.')] },
      { all: [O('l->head = nuevo;', () => setV('l->head', get('nuevo')))],
        bad: [O('nuevo = l->head;', () => setV('nuevo', get('l->head')), 'Al revés: nuevo se movió al 5, el 8 quedó sin referencia y la cabeza no cambió.'),
              O('l->head->next = nuevo;', () => setNext(get('l->head'), get('nuevo')), 'El 5 apuntaría al 8 y el 8 al 5: un ciclo. Además el 2 se pierde.'),
              O('nuevo->next = NULL;', () => setNext(get('nuevo'), null), 'Desenganchaste el 8 del resto de la pila.')] },
    ] },

  { name: 'Pila: pop', kind: 'script', list: [9, 8, 5], goal: [8, 5],
    sig: 'void pop(Lista *l)',
    intro: 'Saca el tope (el 9) y libéralo. Antes de mover <code>l->head</code>, guarda el 9 en <code>aux</code>: si no, no tendrás con qué hacer <code>free</code>.',
    groups: [
      { all: [O('Nodo *aux = l->head;', () => decl('aux', get('l->head')))],
        bad: [O('l->head = l->head->next;', () => setV('l->head', nx(get('l->head'))), 'Sin guardar antes el 9, quedó sin referencia y nunca podrás liberarlo: fuga.'),
              O('free(l->head);', () => freeN(get('l->head')), 'Liberaste el 9, pero l->head sigue apuntando ahí y el 8 y el 5 quedaron inalcanzables.'),
              O('Nodo *aux = l->head->next;', () => decl('aux', nx(get('l->head'))), 'aux debe guardar el nodo que vas a sacar: el 9.')] },
      { any: [O('l->head = aux->next;', () => setV('l->head', nx(get('aux')))),
              O('l->head = l->head->next;', () => setV('l->head', nx(get('l->head'))))],
        bad: [O('free(aux);', () => freeN(get('aux')), 'Liberaste el 9, pero l->head todavía apunta a él.'),
              O('aux = aux->next;', () => setV('aux', nx(get('aux'))), 'Moviste aux. La pila no cambió.'),
              O('l->head = NULL;', () => setV('l->head', null), 'Vaciaste la pila: el 8 y el 5 se perdieron.')] },
      { all: [O('free(aux);', () => freeN(get('aux')))],
        bad: [O('aux = NULL;', () => setV('aux', null), 'El 9 nunca se liberó: fuga de memoria.'),
              O('free(l->head);', () => freeN(get('l->head')), 'Liberaste el 8, que ahora es el tope.'),
              O('aux = l->head;', () => setV('aux', get('l->head')), 'aux era la única referencia al 9: se perdió sin liberarlo.')] },
    ] },

  { name: 'Cola: encolar', kind: 'script', list: [1, 2, 3], tail: true, spawn: [X2, Y(3)], goal: [1, 2, 3, 4], goalTail: 4,
    sig: 'void encolar(Lista *l)',
    intro: 'Una cola tiene <code>l->head</code> (el primero en salir) y <code>l->tail</code> (el último en llegar). Encola el 4 al final. No hace falta recorrer: para eso está <code>tail</code>.',
    groups: [
      { all: [O('Nodo *nuevo = crearNodo(4);', () => decl('nuevo', create(4)))],
        bad: [O('l->tail = crearNodo(4);', () => setV('l->tail', create(4)), 'tail se movió al 4, pero el 3 no apunta a él: el 4 quedó fuera de la lista.'),
              O('Nodo *p = l->head;', () => decl('p', get('l->head')), 'No hace falta recorrer la cola: l->tail ya apunta al último.'),
              O('l->head = crearNodo(4);', () => setV('l->head', create(4)), 'Pisaste la cabeza: el 1, el 2 y el 3 quedaron sin referencia.')] },
      { all: [O('l->tail->next = nuevo;', () => setNext(get('l->tail'), get('nuevo')))],
        bad: [O('l->tail = nuevo;', () => setV('l->tail', get('nuevo')), 'Si mueves tail primero, ya no tienes cómo llegar al 3 para engancharlo.'),
              O('nuevo->next = l->tail;', () => setNext(get('nuevo'), get('l->tail')), 'La flecha va al revés: el 4 apunta al 3, pero el 3 no apunta al 4.'),
              O('nuevo->next = l->head;', () => setNext(get('nuevo'), get('l->head')), 'Así el 4 queda delante del 1, pero nadie apunta al 4: no está en la cola.')] },
      { any: [O('l->tail = nuevo;', () => setV('l->tail', get('nuevo'))),
              O('l->tail = l->tail->next;', () => setV('l->tail', nx(get('l->tail'))))],
        bad: [O('nuevo = l->tail;', () => setV('nuevo', get('l->tail')), 'Al revés: moviste nuevo y l->tail sigue en el 3.'),
              O('l->tail->next = NULL;', () => setNext(get('l->tail'), null), 'Desenganchaste el 4 que acababas de encolar.'),
              O('l->head = nuevo;', () => setV('l->head', get('nuevo')), 'l->head es el primero en salir: la cola empezaría en el 4 y el 1, 2 y 3 se perderían.')] },
    ] },

  { name: 'Invertir', kind: 'script', list: [1, 2, 3], goal: [3, 2, 1],
    sig: 'void invertir(Lista *l)',
    intro: 'Deja la lista al revés: <code>3 → 2 → 1 → NULL</code>. El patrón usa tres punteros: <code>ant</code> (lo ya invertido), <code>act</code> (el nodo que estás dando vuelta) y <code>sig</code> (el resto, para no perderlo). Se repite una vuelta por nodo.',
    groups: null },   // se generan en invertGroups()
];

function invertGroups() {
  const G = [
    { all: [O('Nodo *ant = NULL;', () => decl('ant', null)), O('Nodo *act = l->head;', () => decl('act', get('l->head')))],
      bad: [O('l->head = NULL;', () => setV('l->head', null), 'La lista entera quedó sin referencia.'),

// ───────────────────────── dibujo ─────────────────────────
const varPos = v => ({ x: 5, y: 12 + v.slot * 44 });
function dotOf(n) { return { x: n.px + NW / 2 - (NW - DW) / 2, y: n.py }; }
function varAnchor(v) { const p = varPos(v); return { x: p.x + PW, y: p.y + PH / 2 }; }

let paper = null;
function buildPaper() {
  paper = document.createElement('canvas'); paper.width = Math.round(LW * SC * DPR); paper.height = Math.round(LH * SC * DPR);
  const g = paper.getContext('2d'); g.scale(SC * DPR, SC * DPR);
  g.fillStyle = '#fbf8ef'; g.fillRect(0, 0, LW, LH);
  g.strokeStyle = '#c9dbeb'; g.lineWidth = 0.7;
  for (let x = 0; x <= LW; x += 12.5) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, LH); g.stroke(); }
  for (let y = 0; y <= LH; y += 12.5) { g.beginPath(); g.moveTo(0, y); g.lineTo(LW, y); g.stroke(); }
  g.strokeStyle = '#e0726a'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(MX, 0); g.lineTo(MX, LH); g.stroke();
  g.fillStyle = '#b6b0a6'; g.font = '13px "Patrick Hand", sans-serif'; g.textAlign = 'center';
  g.fillText('stack', MX / 2, LH - 8); g.fillText('heap', (MX + LW) / 2, LH - 48);
}
function drawVar(v) {
  const { x, y } = varPos(v);
  ctx.save(); ctx.translate(x + PW / 2, y + PH / 2); ctx.rotate(-0.04 + (v.name.length % 3) * 0.02);
  const isList = v.name.startsWith('l->');
  ctx.fillStyle = isList ? '#ffd9a8' : '#ffe27a'; ctx.fillRect(-PW / 2, -PH / 2, PW, PH);
  ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(-PW / 2, PH / 2 - 4, PW, 4);
  ctx.strokeStyle = '#8a7420'; ctx.lineWidth = 1.1; rRect(-PW / 2, -PH / 2, PW, PH, v.name.charCodeAt(v.name.length - 1) * 7, 0.6);
  ctx.fillStyle = v.name === 'p' ? '#2350b8' : '#2e2c2a'; ctx.font = (v.name.length > 5 ? '14px' : '17px') + ' "Patrick Hand", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(v.name, -4, 1);
  ctx.restore();
  const a = varAnchor(v);
  ctx.fillStyle = '#2e2c2a'; ctx.beginPath(); ctx.arc(a.x - 5, a.y, 2.4, 0, 7); ctx.fill();
}
function drawNull(x, y, seed) {
  ctx.strokeStyle = '#6f6a62'; ctx.lineWidth = 1.3;
  rLine(x, y, x + 6, y, seed, 0.4, 1);
  rLine(x + 6, y - 6, x + 6, y + 6, seed + 1, 0.4, 1); rLine(x + 9, y - 4, x + 9, y + 4, seed + 2, 0.4, 1); rLine(x + 12, y - 2, x + 12, y + 2, seed + 3, 0.4, 1);
}
function nodeLabel(n) {
  if (S.L.kind !== 'search') return String(n.v);
  if (n.known === 'eq' || (n.known && n.v === S.L.x)) return String(S.L.x);
  if (n.known === 'neq') return '≠' + S.L.x;
  return '?';
}
function drawNode(n) {
  const x = n.px, y = n.py, L = x - NW / 2, T = y - NH / 2;
  ctx.save();
  if (n.dead) ctx.globalAlpha = 0.5;
  if (n.freed) { ctx.globalAlpha = 0.45; ctx.setLineDash([3, 3]); }
  const found = S.L.kind === 'search' && n.known === 'eq';
  ctx.fillStyle = found ? '#e3f4e6' : '#fffdf6'; ctx.fillRect(L, T, NW, NH);
  ctx.strokeStyle = n.bug ? '#c23a32' : found ? '#2f8a4c' : '#2e2c2a'; ctx.lineWidth = 1.8;
  rRect(L, T, NW, NH, n.k * 17 + 3);
  rLine(L + DW, T, L + DW, T + NH, n.k * 17 + 9, 0.6, 1);
  ctx.setLineDash([]);
  const label = nodeLabel(n);
  ctx.fillStyle = n.bug ? '#c23a32' : label === '?' ? '#8a847b' : label.startsWith('≠') ? '#6f6a62' : found ? '#2f8a4c' : '#2e2c2a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = (label.length > 2 ? '18px' : '22px') + ' "Patrick Hand", sans-serif';
  ctx.fillText(label, L + DW / 2, y + 1);
  ctx.fillStyle = '#2e2c2a';
  const d = dotOf(n);
  if (n.next) { ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, 7); ctx.fill(); }
  else { ctx.lineWidth = 1.4; rLine(L + DW + 3, T + NH - 4, L + NW - 3, T + 4, n.k * 5 + 1, 0.5, 1); }
  ctx.font = '10px "Cutive Mono", monospace'; ctx.fillStyle = '#9a948b'; ctx.textAlign = 'right';
  ctx.fillText(addrOf(n), L + NW, T + NH + 8);
  if (n.freed) { ctx.globalAlpha = 0.9; ctx.fillStyle = '#c23a32'; ctx.font = '13px "Patrick Hand", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('liberado', x, T - 7); }
  ctx.restore();
}
function drawAvatar() {
  const a = S.avatar, pv = varNamed('p');
  if (!pv || !pv.declared) return;
  const sh = a.shake ? Math.sin(a.shake * 70) * 3 : 0;
  const x = a.x + sh, y = a.y - Math.sin(Math.min(1, a.hop) * Math.PI) * 12 + Math.sin(S.t * 4) * 0.8;
  ctx.strokeStyle = '#2350b8'; ctx.lineWidth = 1.8; rCircle(x, y, 11, 77, '#c9dbff');
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x + s * 4, y - 2, 3, 3.6, 0, 0, 7); ctx.fill();
    ctx.lineWidth = 0.9; ctx.stroke();
    ctx.fillStyle = '#2e2c2a'; ctx.beginPath(); ctx.arc(x + s * 4 + 1, y - 1.5, 1.4, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#2350b8'; ctx.font = 'bold 12px "Patrick Hand", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('p', x, y + 6);
}
function placeAvatar(snap) {
  const a = S.avatar, p = varNamed('p');
  if (!p || !p.declared) return;
  const pos = varPos(p);
  if (p.t && !p.t.dead) { a.tx = p.t.x - NW / 2 - 4; a.ty = p.t.y - NH / 2 - 8; }
  else { a.tx = pos.x + PW + 20; a.ty = pos.y + PH / 2 - 14; }
  if (snap || a.x === 0) { a.x = a.tx; a.y = a.ty; }
}

function draw() {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  if (!paper) buildPaper();
  ctx.drawImage(paper, 0, 0, LW, LH);
  if (!S) return;
  if (S.nodes.some(n => n.dead)) { ctx.fillStyle = '#b7791f'; ctx.font = '13px "Patrick Hand", sans-serif'; ctx.textAlign = 'left'; ctx.fillText('memoria perdida:', MX + 8, LH - 34); }
  for (const n of S.nodes) {
    if (n.dead || !n.next || n.next.dead) continue;
    const a = dotOf(n), t = n.next;
    rArrow(a, entry(a, t, -0.35), n.k * 101 + 1, t.freed ? '#c23a32' : '#2e2c2a', 1.8, -0.35, t.freed ? [4, 4] : null);
  }
  for (const v of S.vars) {
    if (!v.declared) continue;
    const a = varAnchor(v);
    if (!v.t) { drawNull(a.x - 3, a.y, v.slot * 11 + 900); continue; }
    if (v.t.dead) continue;
    const col = v.t.freed ? '#c23a32' : v.name === 'p' ? '#2350b8' : v.name.startsWith('l->') ? '#a0521d' : '#5d574f';
    rArrow(a, entry(a, v.t, 0.12), v.slot * 31 + 7, col, v.name === 'p' ? 1.7 : 1.3, 0.12, v.t.freed ? [4, 4] : [5, 3]);
  }
  for (const n of S.nodes) drawNode(n);
  for (const v of S.vars) if (v.declared) drawVar(v);
  drawAvatar();
}
function update(dt) {
  S.t += dt;
  for (const n of S.nodes) {
    const tx = n.dead ? MX + 24 + n.tray * 34 : n.x, ty = n.dead ? LH - 16 : n.y;
    n.px = lerp(n.px, tx, Math.min(1, dt * 7)); n.py = lerp(n.py, ty, Math.min(1, dt * 7));
  }
  const a = S.avatar;
  if (a) {
    placeAvatar(false);
    if (a.tx != null) { a.x = lerp(a.x, a.tx, Math.min(1, dt * 10)); a.y = lerp(a.y, a.ty, Math.min(1, dt * 10)); }
    if (a.hop > 0) a.hop = Math.max(0, a.hop - dt * 3);
    if (a.shake) a.shake = Math.max(0, a.shake - dt);
  }
}

// ───────────────────────── tamaño ─────────────────────────
function fit() {
  const cell = $('cell').getBoundingClientRect();
  const s = Math.max(0.4, Math.min((cell.width - 4) / LW, (cell.height - 4) / LH));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  if (Math.abs(s - SC) > 0.001 || cv.width !== Math.round(LW * s * DPR)) {
    SC = s;
    cv.style.width = LW * SC + 'px'; cv.style.height = LH * SC + 'px';
    cv.width = Math.round(LW * SC * DPR); cv.height = Math.round(LH * SC * DPR);
    paper = null;
  }
}
new ResizeObserver(fit).observe($('cell'));

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  boil = REDUCED ? 0 : Math.floor(now / 220) % 5;
  if (S) update(dt);
  draw();
  requestAnimationFrame(frame);
}
fit();
loadLevel(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { paper = null; });
requestAnimationFrame(frame);
</script>
