<title>Puntero C</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&family=Cutive+Mono&display=swap">
<style>
/* Cuaderno en vertical: arriba el dibujo (margen = stack, hoja = heap) con el código en C al lado; abajo, el armador de líneas. Un solo look de papel, a propósito. */
:root{
  color-scheme: light;
  --paper:#fbf8ef;
  --paper-2:#f3eedf;
  --graphite:#2e2c2a;
  --soft:#6f6a62;
  --margin:#e0726a;
  --ink:#2350b8;
  --note:#ffe27a;
  --ok:#2f8a4c;
  --bad:#c23a32;
  --bad-bg:#fff1ee;
  --warn:#b7791f;
  --warn-bg:#fff6e3;
  --display:"Caveat","Comic Sans MS",cursive;
  --body:"Patrick Hand","Comic Sans MS",system-ui,sans-serif;
  --code:"Cutive Mono","Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--graphite);font-family:var(--body);font-size:17px;line-height:1.25;
  padding-inline:16px;padding-block:8px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:980px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}

header{display:flex;align-items:center;gap:5px;border-bottom:2px solid var(--margin);padding-bottom:4px;min-width:0}
h1{font-family:var(--display);font-size:27px;margin:0;line-height:1;white-space:nowrap}
h1 span{color:var(--ink)}
.lv{flex:1;min-width:0;font-size:15px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-family:var(--body);font-size:18px;line-height:1;width:33px;height:33px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:10px 4px 10px 4px / 4px 10px 4px 10px;cursor:pointer;flex:none;padding:0}
.mini:disabled{opacity:.35}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(132px,42%);gap:8px;min-height:0}
@media (min-width:700px){ .main{grid-template-columns:minmax(0,1fr) 340px} }
.boardcell{position:relative;min-height:0;min-width:0;display:flex;align-items:flex-start;justify-content:center}
canvas#cv{display:block;touch-action:manipulation;border:2px solid var(--graphite);border-radius:6px 12px 8px 10px / 10px 6px 12px 8px;background:var(--paper)}

.code{min-height:0;min-width:0;overflow-y:auto;background:#fffdf6;border:1.5px solid var(--graphite);border-radius:4px 10px 6px 8px;
  padding:6px 7px;font-family:var(--code);font-size:clamp(11.5px,3vw,14.5px);line-height:1.4;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.code div{white-space:pre-wrap}
.code .dim{color:var(--soft)}
.code .goal{color:var(--ok)}
.code .err{color:var(--bad)}
.code .leak{color:var(--warn)}
.code .new{background:var(--note);animation:fade 1.6s ease-out forwards}
@keyframes fade{to{background:transparent}}

.build{display:flex;flex-direction:column;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.line{display:flex;align-items:center;gap:8px;font-family:var(--code);font-size:clamp(14px,3.8vw,17px);min-height:34px;
  border-bottom:1.5px dashed var(--soft);padding:2px 2px 4px}
.line .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.line .hole{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--ink);color:var(--ink)}
.line .hint{font-family:var(--body);color:var(--soft);font-size:15px}
.line button{font-family:var(--body);font-size:16px;border:1.5px solid var(--soft);background:transparent;color:var(--soft);border-radius:8px;padding:2px 10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow-y:auto}
.chip{font-family:var(--code);font-size:clamp(13px,3.6vw,16px);min-height:38px;padding:4px 10px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer;touch-action:manipulation}
.chip:active{background:var(--note)}
.chip.decl{border-style:dashed}
.chip.act{background:var(--paper-2)}
.chip.mk{border-color:var(--ok);color:var(--ok)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.fb{border:2px solid var(--bad);background:var(--bad-bg);border-radius:12px 5px 12px 5px / 5px 12px 5px 12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fb.warn{border-color:var(--warn);background:var(--warn-bg)}
.fb code{font-family:var(--code);font-size:15px}
.fb p{margin:0}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb button{font-family:var(--body);font-size:18px;padding:5px 14px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,248,239,.85);padding:6px;z-index:2}
.card{background:#fffdf6;border:2.5px solid var(--graphite);border-radius:18px 6px 16px 8px / 8px 16px 6px 18px;padding:14px 16px;max-width:430px;width:100%;
  display:flex;flex-direction:column;gap:9px;box-shadow:4px 5px 0 rgba(46,44,42,.18);max-height:100%;overflow-y:auto}
.card h2{font-family:var(--display);font-size:32px;margin:0;line-height:1;text-wrap:balance}
.card p{margin:0}
.card code{font-family:var(--code);font-size:.9em;background:var(--paper-2);padding:0 3px}
.card pre{font-family:var(--code);font-size:13px;background:var(--paper-2);padding:6px 8px;margin:0;overflow-x:auto;white-space:pre}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card button{font-family:var(--body);font-size:19px;padding:7px 16px;border:2px solid var(--graphite);background:var(--note);color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer}
.card button.sec{background:#fffdf6}
.stars{font-size:36px;letter-spacing:4px;color:#d9a400;line-height:1}
</style>

<div class="app">
  <header>
    <h1>Puntero <span>C</span></h1>
    <span class="lv" id="lvname">—</span>
    <button class="mini" id="bprev" aria-label="Nivel anterior">‹</button>
    <button class="mini" id="bnext" aria-label="Nivel siguiente">›</button>
    <button class="mini" id="bundo" aria-label="Deshacer la última línea">↶</button>
    <button class="mini" id="breset" aria-label="Reiniciar nivel">⟲</button>
    <button class="mini" id="bhelp" aria-label="Ayuda">?</button>
  </header>

  <div class="main">
    <div class="boardcell" id="cell">
      <canvas id="cv" aria-label="Tablero: variables en el margen, nodos en la hoja"></canvas>
      <div class="overlay" id="ov" hidden></div>
    </div>
    <div class="code" id="code" aria-live="polite"></div>
  </div>

  <div class="build">
    <div class="line"><span class="txt" id="ltxt"></span><button id="bx" hidden>✕</button></div>
    <div class="chips" id="chips"></div>
    <div class="fb" id="fb" hidden>
      <code id="fbcode"></code>
      <p id="fbwhy"></p>
      <div class="row" id="fbrow"></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
// ───────────────────────── tablero lógico ─────────────────────────
const LW = 250, LH = 440;
const MX = 70;                     // línea roja del margen: a la izquierda el stack, a la derecha el heap
const NW = 62, NH = 30, DW = 40;   // nodo: [value | next]
const PW = 60, PH = 26;            // post-it de variable
const X1 = 136, X2 = 212;
const Y = i => 40 + i * 70;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────────────────── niveles ─────────────────────────
   El alumno arma cualquier línea con los punteros que tiene; el nivel solo define el punto de
   partida, qué variables se pueden declarar, qué valores entrega crearNodo() y qué estado gana.
   `best` es el largo de la solución de referencia `ref`. */
const LEVELS = [
  { name: '¿Está el 7?', kind: 'search', x: 7, list: [4, 1, 9, 7, 3], vars: ['p'], best: 9,
    sig: 'int esta(Lista *l)',
    intro: 'Queremos saber si el 7 está en la lista. Al comienzo solo tienes <code>l->head</code>: no hay ningún puntero para recorrer.<br><br>Los datos están ocultos (<code>?</code>). Cada vez que preguntas <code>if (p->value == 7)</code> y la respuesta es no, el nodo pasa a <code>≠7</code>: es lo único que sabes con certeza. Cuando estés seguro, responde con <code>return 1</code> o <code>return 0</code>.',
    ref: 'Nodo *p = l->head;\nwhile (p != NULL) {\n  if (p->value == 7) return 1;\n  p = p->next;\n}\nreturn 0;' },

  { name: '¿Está el 5?', kind: 'search', x: 5, list: [6, 2, 8, 3], vars: ['p'], best: 10,
    sig: 'int esta(Lista *l)',
    intro: 'Ahora buscas el 5. Si no está, la única forma de saberlo es revisar <b>todos</b> los nodos, hasta que <code>p</code> sea <code>NULL</code>.',
    ref: 'Nodo *p = l->head;\nwhile (p != NULL) {\n  if (p->value == 5) return 1;\n  p = p->next;\n}\nreturn 0;' },

  { name: 'Insertar el 2', kind: 'list', list: [1, 3], vars: ['p', 'sig', 'nuevo'], create: [2], goal: [1, 2, 3], best: 5,
    sig: 'void insertar(Lista *l)',
    intro: 'Inserta un nodo con el 2 entre el 1 y el 3.<br><br>Una forma segura: un puntero <code>p</code> al nodo después del cual insertas, uno <code>sig</code> para guardar el que sigue (si no, se pierde) y uno <code>nuevo</code> para el nodo creado.',
    ref: 'Nodo *p = l->head;\nNodo *sig = p->next;\nNodo *nuevo = crearNodo(2);\np->next = nuevo;\nnuevo->next = sig;' },

  { name: 'Borrar el 13', kind: 'list', list: [1, 2, 13, 4], bug: 13, vars: ['p', 'borrar'], goal: [1, 2, 4], best: 5,
    sig: 'void borrar13(Lista *l)',
    intro: 'Saca el 13 de la lista <b>y libera su memoria</b> con <code>free</code>. Si solo lo saltas, queda ocupando memoria sin que nada lo apunte: una fuga.',
    ref: 'Nodo *p = l->head;\np = p->next;\nNodo *borrar = p->next;\np->next = borrar->next;\nfree(borrar);' },

  { name: 'Pila: push', kind: 'list', list: [5, 2], vars: ['nuevo'], create: [8], goal: [8, 5, 2], best: 3,
    sig: 'void push(Lista *l)',
    intro: 'Una pila crece por <code>l->head</code>. Haz push del 8. El orden de las líneas importa.',
    ref: 'Nodo *nuevo = crearNodo(8);\nnuevo->next = l->head;\nl->head = nuevo;' },

  { name: 'Pila: pop', kind: 'list', list: [9, 8, 5], vars: ['aux'], goal: [8, 5], best: 3,
    sig: 'void pop(Lista *l)',
    intro: 'Saca el tope (el 9) y libéralo. Si mueves <code>l->head</code> sin guardar antes el 9, no tendrás con qué hacer <code>free</code>.',
    ref: 'Nodo *aux = l->head;\nl->head = aux->next;\nfree(aux);' },

  { name: 'Cola: encolar', kind: 'list', list: [1, 2, 3], tail: true, vars: ['nuevo', 'p'], create: [4], goal: [1, 2, 3, 4], goalTail: 4, best: 3,
    sig: 'void encolar(Lista *l)',
    intro: 'Una cola tiene <code>l->head</code> (el primero en salir) y <code>l->tail</code> (el último en llegar). Encola el 4 al final. Se puede recorrer con <code>p</code>, pero no hace falta: para eso está <code>tail</code>.',
    ref: 'Nodo *nuevo = crearNodo(4);\nl->tail->next = nuevo;\nl->tail = nuevo;' },

  { name: 'Invertir', kind: 'list', list: [1, 2, 3], vars: ['ant', 'act', 'sig'], goal: [3, 2, 1], best: 15,
    sig: 'void invertir(Lista *l)',
    intro: 'Deja la lista al revés: <code>3 → 2 → 1 → NULL</code>. El patrón clásico usa <code>ant</code> (lo ya invertido), <code>act</code> (el nodo que das vuelta) y <code>sig</code> (el resto, para no perderlo).',
    ref: 'Nodo *ant = NULL;\nNodo *act = l->head;\nwhile (act != NULL) {\n  Nodo *sig = act->next;\n  act->next = ant;\n  ant = act;\n  act = sig;\n}\nl->head = ant;' },
];

// ───────────────────────── semántica de C ─────────────────────────
class CErr { constructor(msg, compile) { this.msg = msg; this.compile = compile; } }
const SEG = 'Segmentation fault: se intentó leer a través de un puntero NULL.';
const UAF = 'Uso después de free: ese nodo ya fue liberado.';
const varNamed = name => S.vars.find(v => v.name === name) || null;
const declared = name => { const v = varNamed(name); return !!(v && v.declared); };
const live = n => n && !n.dead;
let NK = 0;
function mkNode(v, x, y) { return { k: NK++, v, x, y, px: x, py: y, next: null, freed: false, dead: false, known: null, bug: false, tray: -1 }; }
const addrOf = n => '0x' + (0x3a0 + n.k * 0x18).toString(16);

function spawnPos() {
  const taken = n => S.nodes.some(m => Math.abs(m.x - n[0]) < 5 && Math.abs(m.y - n[1]) < 5);
  for (const col of [X2, X1]) for (let r = 0; r < 5; r++) if (!taken([col, Y(r)])) return [col, Y(r)];
  return [X2, Y(0)];
}
// evalúa una expresión del armador: NULL, crearNodo(v), x, x->next, x->next->next, x->prev
function evalExpr(e) {
  if (e === 'NULL') return null;
  const m = /^crearNodo\((\d+)\)$/.exec(e);
  if (m) {
    const [x, y] = spawnPos(); const n = mkNode(+m[1], x, y); n.py -= 30; n.isNew = true;
    S.nodes.push(n); S.made++; return n;
  }
  const m2 = /^(l->head|l->tail|\w+)((?:->\w+)*)$/.exec(e);
  if (!m2) throw new CErr('error de sintaxis', true);
  const base = m2[1], parts = m2[2] ? m2[2].slice(2).split('->') : [];
  if (!declared(base)) throw new CErr(`error: '${base}' no está declarada. Primero hay que declararla: Nodo *${base} = …;`, true);
  let cur = varNamed(base).t;
  for (const f of parts) {
    if (f === 'prev') throw new CErr("error: 'Nodo' no tiene un miembro llamado 'prev'. En una lista simple no se puede retroceder.", true);
    if (!cur) throw new CErr(SEG);
    if (cur.freed) throw new CErr(UAF);
    cur = cur.next;
  }
  return cur;
}
function derefForWrite(name) {
  const n = varNamed(name).t;
  if (!n) throw new CErr(SEG + ` (${name} es NULL)`);
  if (n.freed) throw new CErr(UAF);
  return n;
}

// ───────────────────────── estado ─────────────────────────
let LVI = 0, S = null;
function loadLevel(i) {
  LVI = (i + LEVELS.length) % LEVELS.length;
  const L = LEVELS[LVI];
  NK = 0;
  S = { L, nodes: [], vars: [], errors: 0, lines: 0, code: [], state: 'play', slot: 0, made: 0, undo: [],
        sel: null, toast: null, t: 0, avatar: { x: 0, y: 0, hop: 0, shake: 0 }, answer: null, leaks: 0 };
  S.nodes = L.list.map((v, j) => { const n = mkNode(v, X1, Y(j)); n.bug = v === L.bug; return n; });
  S.nodes.forEach((n, j) => n.next = S.nodes[j + 1] || null);
  S.original = S.nodes.slice();
  const names = ['l->head'].concat(L.tail ? ['l->tail'] : [], L.vars);
  S.vars = names.map(name => ({ name, t: null, declared: false, slot: -1 }));
  declare('l->head', S.nodes[0]);
  if (L.tail) declare('l->tail', S.nodes[S.nodes.length - 1]);
  addCode('// Nodo: value, next', 'dim');
  addCode('// objetivo: ' + goalText(), 'goal');
  addCode(L.sig + ' {', 'dim');
  $('lvname').textContent = `${LVI + 1}/${LEVELS.length} · ${L.name}`;
  hideFb(); renderBuilder();
  showCard('intro');
}
function declare(name, n) { const v = varNamed(name); v.declared = true; v.slot = S.slot++; v.t = n; }
function goalText() {
  const L = S.L;
  if (L.kind === 'search') return `responder si el ${L.x} está (1) o no (0)`;
  return 'l->head → ' + L.goal.join(' → ') + ' → NULL' + (L.goalTail != null ? `, l->tail → ${L.goalTail}` : '') + ', sin fugas';
}

// ───────────────────────── armador de líneas ─────────────────────────
/* Paso 1: qué va a la izquierda (o qué acción).  Paso 2: qué va a la derecha.
   Las piezas salen del estado actual, así que el alumno puede escribir casi cualquier cosa,
   incluidas muchas líneas que no compilan o que rompen la lista. */
function lhsChips() {
  const L = S.L, out = [];
  const dv = S.vars.filter(v => v.declared);
  for (const v of dv) out.push({ kind: 'set', text: v.name, name: v.name });
  for (const v of dv) out.push({ kind: 'setnext', text: v.name + '->next', name: v.name });
  for (const v of S.vars.filter(v => !v.declared)) out.push({ kind: 'decl', text: 'Nodo *' + v.name, name: v.name, cls: 'decl' });
  if (L.kind === 'search') out.push({ kind: 'if', text: `if (_->value == ${L.x})`, cls: 'act' });
  out.push({ kind: 'free', text: 'free(_)', cls: 'act' });
  if (L.kind === 'search') { out.push({ kind: 'ret', text: 'return 1;', val: 1, cls: 'act' }); out.push({ kind: 'ret', text: 'return 0;', val: 0, cls: 'act' }); }
  return out;
}
function rhsChips(sel) {
  const dv = S.vars.filter(v => v.declared && !(sel.kind === 'decl' && v.name === sel.name));
  const out = [];
  const ptr = sel.kind === 'set' || sel.kind === 'setnext' || sel.kind === 'decl';
  if (ptr) out.push({ text: 'NULL' });
  for (const v of dv) out.push({ text: v.name });
  for (const v of dv) out.push({ text: v.name + '->next' });
  if (ptr) {
    for (const v of dv) if (v.t && !v.t.freed && v.t.next) out.push({ text: v.name + '->next->next' });
    const p = dv.find(v => !v.name.startsWith('l->'));
    if (p) out.push({ text: p.name + '->prev' });
    const left = (S.L.create || []).slice(S.made);
    if (left.length) out.push({ text: `crearNodo(${left[0]})`, cls: 'mk' });
  }
  if (sel.kind === 'decl' && !out.some(c => c.text === sel.name)) out.push({ text: sel.name, cls: '' });   // Nodo *p = p; (no compila)
  return out;
}
function lineText(sel, rhs) {
  const hole = rhs == null ? '<span class="hole">&nbsp;</span>' : esc(rhs);
  if (sel.kind === 'set' || sel.kind === 'setnext' || sel.kind === 'decl') return `${esc(sel.text)} = ${hole};`;
  if (sel.kind === 'if') return `if (${hole}->value == ${S.L.x})`;
  if (sel.kind === 'free') return `free(${hole});`;
  return esc(sel.text);
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function renderBuilder() {
  const box = $('chips'); box.innerHTML = '';
  const sel = S.sel;
  if (S.state !== 'play') { $('ltxt').innerHTML = ''; $('bx').hidden = true; return; }
  if (!sel) $('ltxt').innerHTML = '<span class="hint">Toca lo que va a la izquierda del <b>=</b>, o una acción.</span>';
  else $('ltxt').innerHTML = lineText(sel, null);
  $('bx').hidden = !sel;
  const chips = sel ? rhsChips(sel) : lhsChips();
  for (const c of chips) {
    const b = document.createElement('button');
    b.className = 'chip ' + (c.cls || ''); b.textContent = c.text;
    b.onclick = () => sel ? run(sel, c.text) : pick(c);
    box.appendChild(b);
  }
  $('bundo').disabled = !S.undo.length;
}
function pick(c) {
  if (c.kind === 'ret') { run(c, null); return; }
  S.sel = c; renderBuilder();
}
$('bx').onclick = () => { S.sel = null; renderBuilder(); };

// ───────────────────────── ejecutar ─────────────────────────
function snapshot() {
  const idx = n => n ? S.nodes.indexOf(n) : -1;
  return { nodes: S.nodes.map(n => ({ n, next: idx(n.next), freed: n.freed, dead: n.dead, known: n.known, tray: n.tray })),
           vars: S.vars.map(v => ({ t: idx(v.t), declared: v.declared, slot: v.slot })), slot: S.slot, nk: NK, leaks: S.leaks,
           made: S.made, code: S.code.length, lines: S.lines };
}
function restore(s) {
  S.nodes = s.nodes.map(o => o.n);
  const at = k => k < 0 ? null : S.nodes[k];
  s.nodes.forEach(o => Object.assign(o.n, { next: at(o.next), freed: o.freed, dead: o.dead, known: o.known, tray: o.tray }));
  s.vars.forEach((o, i) => Object.assign(S.vars[i], { t: at(o.t), declared: o.declared, slot: o.slot }));
  S.slot = s.slot; NK = s.nk; S.leaks = s.leaks; S.made = s.made; S.lines = s.lines;
  S.code.length = s.code; renderCode();
}
function run(sel, rhs) {
  if (S.state !== 'play') return;
  S.sel = null;
  const L = S.L, snap = snapshot();
  const code = lineText(sel, rhs).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  let note = '';
  try {
    if (sel.kind === 'decl') {
      if (rhs === sel.name) throw new CErr(`error: '${rhs}' se usa en su propia declaración, antes de tener un valor.`, true);
      const val = evalExpr(rhs); declare(sel.name, val);
    } else if (sel.kind === 'set') {
      const val = evalExpr(rhs); varNamed(sel.name).t = val;
    } else if (sel.kind === 'setnext') {
      const val = evalExpr(rhs); derefForWrite(sel.name).next = val;
    } else if (sel.kind === 'free') {
      const n = evalExpr(rhs);
      if (n) { if (n.freed) throw new CErr('double free: ese nodo ya estaba liberado.'); n.freed = true; }

  if (a) {
    placeAvatar(false);
    if (a.tx != null) { a.x = lerp(a.x, a.tx, Math.min(1, dt * 10)); a.y = lerp(a.y, a.ty, Math.min(1, dt * 10)); }
    if (a.hop > 0) a.hop = Math.max(0, a.hop - dt * 3);
    if (a.shake) a.shake = Math.max(0, a.shake - dt);
  }
}

// ───────────────────────── tamaño ─────────────────────────
function fit() {
  const cell = $('cell').getBoundingClientRect();
  const s = Math.max(0.4, Math.min((cell.width - 4) / LW, (cell.height - 4) / LH));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  if (Math.abs(s - SC) > 0.001 || cv.width !== Math.round(LW * s * DPR)) {
    SC = s;
    cv.style.width = LW * SC + 'px'; cv.style.height = LH * SC + 'px';
    cv.width = Math.round(LW * SC * DPR); cv.height = Math.round(LH * SC * DPR);
    paper = null;
  }
}
new ResizeObserver(fit).observe($('cell'));

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  boil = REDUCED ? 0 : Math.floor(now / 220) % 5;
  if (S) update(dt);
  draw();
  requestAnimationFrame(frame);
}
fit();
loadLevel(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { paper = null; });
requestAnimationFrame(frame);
</script>
