<title>Puntero C</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&family=Cutive+Mono&display=swap">
<style>
/* Cuaderno abierto en vertical: a la izquierda el dibujo (margen = stack, hoja = heap), a la derecha el código en C que se va escribiendo. Un solo look de papel, a propósito. */
:root{
  color-scheme: light;
  --paper:#fbf8ef;
  --paper-2:#f3eedf;
  --grid:#c9dbeb;
  --graphite:#2e2c2a;
  --soft:#6f6a62;
  --margin:#e0726a;
  --ink:#2350b8;
  --note:#ffe27a;
  --ok:#2f8a4c;
  --bad:#c23a32;
  --warn:#b7791f;
  --display:"Caveat","Comic Sans MS",cursive;
  --body:"Patrick Hand","Comic Sans MS",system-ui,sans-serif;
  --code:"Cutive Mono","Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--graphite);font-family:var(--body);font-size:17px;line-height:1.25;
  padding-inline:16px;padding-block:8px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:980px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}

header{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--margin);padding-bottom:4px;min-width:0}
h1{font-family:var(--display);font-size:30px;margin:0;line-height:1;white-space:nowrap}
h1 span{color:var(--ink)}
.lv{flex:1;min-width:0;font-size:16px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-family:var(--body);font-size:20px;line-height:1;width:36px;height:36px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:10px 4px 10px 4px / 4px 10px 4px 10px;cursor:pointer;flex:none}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(132px,40%);gap:8px;min-height:0}
@media (min-width:700px){ .main{grid-template-columns:minmax(0,1fr) 320px} }
.boardcell{position:relative;min-height:0;min-width:0;display:flex;align-items:flex-start;justify-content:center}
canvas#cv{display:block;touch-action:none;border:2px solid var(--graphite);border-radius:6px 12px 8px 10px / 10px 6px 12px 8px;background:var(--paper)}

.code{min-height:0;min-width:0;overflow-y:auto;background:#fffdf6;border:1.5px solid var(--graphite);border-radius:4px 10px 6px 8px;
  padding:6px 7px;font-family:var(--code);font-size:clamp(11.5px,3vw,14.5px);line-height:1.4;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.code div{white-space:pre-wrap}
.code .dim{color:var(--soft)}
.code .goal{color:var(--ok)}
.code .err{color:var(--bad)}
.code .leak{color:var(--warn)}
.code .new{background:var(--note);animation:fade 1.6s ease-out forwards}
@keyframes fade{to{background:transparent}}

.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar button{font-family:var(--code);font-size:clamp(12px,3.4vw,15px);min-height:46px;padding:4px 6px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer;touch-action:manipulation}
.bar button.body{font-family:var(--body);font-size:16px}
.bar button:active{background:var(--note)}
.bar button:disabled{opacity:.35}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,248,239,.82);padding:8px;z-index:2}
.card{background:#fffdf6;border:2.5px solid var(--graphite);border-radius:18px 6px 16px 8px / 8px 16px 6px 18px;padding:14px 16px;max-width:430px;width:100%;
  display:flex;flex-direction:column;gap:9px;box-shadow:4px 5px 0 rgba(46,44,42,.18);max-height:100%;overflow-y:auto}
.card h2{font-family:var(--display);font-size:34px;margin:0;line-height:1;text-wrap:balance}
.card p{margin:0}
.card code{font-family:var(--code);font-size:.9em;background:var(--paper-2);padding:0 3px}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card button{font-family:var(--body);font-size:19px;padding:7px 16px;border:2px solid var(--graphite);background:var(--note);color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer}
.card button.sec{background:#fffdf6}
.stars{font-size:36px;letter-spacing:4px;color:#d9a400;line-height:1}
.tally{font-variant-numeric:tabular-nums}
</style>

<div class="app">
  <header>
    <h1>Puntero <span>C</span></h1>
    <span class="lv" id="lvname">—</span>
    <button class="mini" id="bprev" aria-label="Nivel anterior">‹</button>
    <button class="mini" id="bnext" aria-label="Nivel siguiente">›</button>
  </header>

  <div class="main">
    <div class="boardcell" id="cell">
      <canvas id="cv" aria-label="Tablero: variables en el margen, nodos en la hoja"></canvas>
      <div class="overlay" id="ov" hidden></div>
    </div>
    <div class="code" id="code" aria-live="polite"></div>
  </div>

  <div class="bar" id="bar">
    <button id="bnext1">p = p-&gt;next</button>
    <button id="bprev1">p = p-&gt;prev</button>
    <button id="bnew">n = crearNodo()</button>
    <button id="bundo" class="body">↶ deshacer</button>
    <button id="breset" class="body">⟲ reiniciar</button>
    <button id="bhelp" class="body">? ayuda</button>
  </div>
</div>

<script>
'use strict';
// ───────────────────────── tablero lógico ─────────────────────────
const LW = 250, LH = 520;          // coordenadas lógicas del dibujo
const MX = 66;                     // línea roja del margen: a la izquierda el stack, a la derecha el heap
const NW = 62, NH = 30, DW = 40;   // nodo: [dato | next]
const PW = 56, PH = 26;            // post-it de variable
const X1 = 132, X2 = 210;          // columnas del heap
const Y = i => 52 + i * 70;
const TRASH = { x: 33, y: 478, r: 22 };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Cada nivel:
   nodes: [id, dato, x, y]   links: { id: idSiguiente }   vars: [[nombre, id|null]]
   create: valores que entrega crearNodo() a la variable n, y dónde aparecen
   goal: reach (p sobre el dato) | before (p justo antes del dato) | list (head → … → NULL, y tail opcional) */
const LEVELS = [
  { name: 'Recorrer', optimal: 3, hidden: true,
    intro: 'Los datos están ocultos. Solo ves el nodo al que apunta <code>p</code> y el siguiente. Avanza con <code>p = p->next</code> hasta que <code>p</code> apunte al 7.<br><br>Prueba también <code>p = p->prev</code>: en una lista simple ese campo no existe.',
    goal: { type: 'reach', val: 7 },
    nodes: [['a', 4, X1, Y(0)], ['b', 1, X1, Y(1)], ['c', 9, X1, Y(2)], ['d', 7, X1, Y(3)], ['e', 3, X1, Y(4)]],
    links: { a: 'b', b: 'c', c: 'd', d: 'e' }, vars: [['head', 'a'], ['p', 'a']] },

  { name: 'Frenar a tiempo', optimal: 2, hidden: true,
    intro: 'Deja <code>p</code> en el nodo <b>anterior</b> al 7. Para borrar o insertar casi siempre hay que pararse antes.<br><br>Si te pasas, no hay vuelta atrás: toca el post-it <code>head</code> para hacer <code>p = head</code> y empezar de nuevo.',
    goal: { type: 'before', val: 7 },
    nodes: [['a', 3, X1, Y(0)], ['b', 8, X1, Y(1)], ['c', 5, X1, Y(2)], ['d', 7, X1, Y(3)], ['e', 2, X1, Y(4)]],
    links: { a: 'b', b: 'c', c: 'd', d: 'e' }, vars: [['head', 'a'], ['p', 'a']] },

  { name: 'Insertar el 2', optimal: 3,
    intro: 'Crea un nodo con el 2 y mételo entre el 1 y el 3.<br><br><b>Arrastra</b> desde un post-it o desde la casilla <code>next</code> de un nodo, y suelta sobre un nodo o un nombre. Soltar en el papel es <code>NULL</code>.<br><br>Ojo con el orden: un nodo al que nada apunta se pierde para siempre.',
    goal: { type: 'list', head: [1, 2, 3] },
    nodes: [['a', 1, X1, Y(0)], ['b', 3, X1, Y(2)]],
    links: { a: 'b' }, vars: [['head', 'a'], ['p', 'a'], ['n', null]],
    create: { vals: [2], at: [[X2, Y(1)]] } },

  { name: 'Borrar el 13', optimal: 3,
    intro: 'Saca el 13 de la lista <b>y libéralo</b>. Si solo lo saltas, queda ocupando memoria y nadie puede volver a alcanzarlo: una fuga.<br><br>Para liberar, arrastra el post-it de la variable que lo apunta hasta el basurero: <code>free(aux)</code>.',
    goal: { type: 'list', head: [1, 2, 4] },
    nodes: [['a', 1, X1, Y(0)], ['b', 2, X1, Y(1)], ['c', 13, X1, Y(2), true], ['d', 4, X1, Y(3)]],
    links: { a: 'b', b: 'c', c: 'd' }, vars: [['head', 'a'], ['p', 'a'], ['aux', null]] },

  { name: 'Pila: push', optimal: 6,
    intro: 'Una pila crece por <code>head</code>. Haz push del 8 y después push del 9.<br><br>En cada push: crea el nodo, haz que apunte al tope actual y luego mueve <code>head</code>.',
    goal: { type: 'list', head: [9, 8, 5, 2] },
    nodes: [['a', 5, X1, Y(2)], ['b', 2, X1, Y(3)]],
    links: { a: 'b' }, vars: [['head', 'a'], ['n', null]],
    create: { vals: [8, 9], at: [[X2, Y(1)], [X2, Y(0)]] } },

  { name: 'Pila: pop', optimal: 3,
    intro: 'Saca el tope (el 9) y libéralo. Si mueves <code>head</code> sin guardar antes el nodo en <code>aux</code>, ya no tendrás con qué hacer <code>free</code>.',
    goal: { type: 'list', head: [8, 5] },
    nodes: [['a', 9, X1, Y(0)], ['b', 8, X1, Y(1)], ['c', 5, X1, Y(2)]],
    links: { a: 'b', b: 'c' }, vars: [['head', 'a'], ['aux', null]] },

  { name: 'Cola: encolar', optimal: 3,
    intro: 'Una cola tiene <code>head</code> (sale primero) y <code>tail</code> (el último que llegó). Encola el 4 al final, sin recorrer la lista.',
    goal: { type: 'list', head: [1, 2, 3, 4], tail: 4 },
    nodes: [['a', 1, X1, Y(0)], ['b', 2, X1, Y(1)], ['c', 3, X1, Y(2)]],
    links: { a: 'b', b: 'c' }, vars: [['head', 'a'], ['tail', 'c'], ['n', null]],
    create: { vals: [4], at: [[X2, Y(3)]] } },

  { name: 'Invertir', optimal: 5,
    intro: 'Deja la lista al revés: <code>head → 3 → 2 → 1 → NULL</code>. Tienes <code>p</code>, <code>ant</code> y <code>sig</code> para no perder nodos mientras das vuelta las flechas.',
    goal: { type: 'list', head: [3, 2, 1] },
    nodes: [['a', 1, X1, Y(0)], ['b', 2, X1, Y(1)], ['c', 3, X1, Y(2)]],
    links: { a: 'b', b: 'c' }, vars: [['head', 'a'], ['p', 'a'], ['ant', null], ['sig', null]] },
];

// ───────────────────────── utilidades ─────────────────────────
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let SC = 1, DPR = 1;
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return ((n >>> 0) % 10000) / 5000 - 1; }
let boil = 0;
const J = (s, a) => hash(s * 7919 + boil * 104729) * a;
const lerp = (a, b, t) => a + (b - a) * t;

function rLine(x1, y1, x2, y2, seed, amp = 1, passes = 2) {
  for (let p = 0; p < passes; p++) {
    const s = seed * 13 + p * 5;
    ctx.beginPath();
    ctx.moveTo(x1 + J(s + 2, amp), y1 + J(s + 3, amp));
    ctx.quadraticCurveTo((x1 + x2) / 2 + J(s, amp * 1.4), (y1 + y2) / 2 + J(s + 1, amp * 1.4), x2 + J(s + 4, amp), y2 + J(s + 5, amp));
    ctx.stroke();
  }
}
function rRect(x, y, w, h, seed, amp = 0.9) {
  rLine(x, y, x + w, y, seed, amp); rLine(x + w, y, x + w, y + h, seed + 1, amp);
  rLine(x + w, y + h, x, y + h, seed + 2, amp); rLine(x, y + h, x, y, seed + 3, amp);
}
function rCircle(x, y, r, seed, fill) {
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const a = (i / 22) * Math.PI * 2, rr = r + J(seed + i, r * 0.07);
    i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.stroke();
}
function ctrlOf(a, b, k) {
  const dx = b.x - a.x, dy = b.y - a.y;
  return { x: (a.x + b.x) / 2 - dy * k, y: (a.y + b.y) / 2 + dx * k };
}
function qp(a, c, b, t) { const u = 1 - t; return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }; }
function rArrow(a, b, seed, color, width, k = 0.22, dash = null, head = true) {
  const c = ctrlOf(a, b, k);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  for (let p = 0; p < 2; p++) {
    ctx.beginPath(); ctx.moveTo(a.x + J(seed + p, 0.8), a.y + J(seed + p + 9, 0.8));
    ctx.quadraticCurveTo(c.x + J(seed + p + 3, 2), c.y + J(seed + p + 4, 2), b.x, b.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  if (!head) return;
  const t = qp(a, c, b, 0.88), ang = Math.atan2(b.y - t.y, b.x - t.x), L = 9;
  rLine(b.x, b.y, b.x - Math.cos(ang - 0.45) * L, b.y - Math.sin(ang - 0.45) * L, seed + 20, 0.6, 1);
  rLine(b.x, b.y, b.x - Math.cos(ang + 0.45) * L, b.y - Math.sin(ang + 0.45) * L, seed + 21, 0.6, 1);
}
// punto donde una flecha que viene de `from` entra a la caja del nodo
function entry(from, n, k) {
  const c = { x: n.px, y: n.py }, ct = ctrlOf(from, c, k);
  let dx = c.x - ct.x, dy = c.y - ct.y; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const t = Math.min(Math.abs(dx) > 1e-6 ? (NW / 2 + 2) / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-6 ? (NH / 2 + 2) / Math.abs(dy) : 1e9);
  return { x: c.x - dx * t, y: c.y - dy * t };
}

// ───────────────────────── sonido ─────────────────────────
let AC = null;
function beep(f, d = 0.08, type = 'triangle', v = 0.05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const SFX = {
  ok: () => beep(620, 0.08, 'triangle', 0.05, 1.3),
  jump: () => beep(380, 0.2, 'sine', 0.05, 2),
  err: () => { beep(160, 0.12, 'square', 0.03); setTimeout(() => beep(120, 0.15, 'square', 0.03), 90); },
  leak: () => beep(500, 0.5, 'sine', 0.05, 0.3),
  free: () => beep(900, 0.12, 'triangle', 0.04, 0.5),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.05), i * 110)),
};
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ───────────────────────── estado ─────────────────────────
let LVI = 0, S = null;
const addrOf = n => '0x' + (0x3a0 + n.k * 0x18).toString(16);

function loadLevel(i) {
  LVI = (i + LEVELS.length) % LEVELS.length;
  const L = LEVELS[LVI];
  S = { L, nodes: [], vars: [], ops: 0, errors: 0, leaks: 0, made: 0, undo: [], code: [], state: 'play',
        drag: null, toast: null, t: 0, avatar: null };
  const byId = {};
  for (const [id, v, x, y, bug] of L.nodes) {
    const n = { k: S.nodes.length, v, x, y, px: x, py: y, next: null, freed: false, dead: false, bug: !!bug, revealed: !L.hidden, tray: -1, wob: 0 };
    S.nodes.push(n); byId[id] = n;
  }
  for (const [a, b] of Object.entries(L.links)) byId[a].next = byId[b];
  L.vars.forEach(([name, id], i) => S.vars.push({ name, t: id ? byId[id] : null, x: 4, y: 20 + i * 48 }));
  S.required = L.goal.type === 'list' ? L.goal.head.slice() : [L.goal.val];
  const p = varNamed('p');
  if (p) S.avatar = { x: 0, y: 0, dir: 1, hop: 0 };
  placeAvatar(true);
  reveal();

  // código inicial
  addCode('// struct Nodo: dato, next', 'dim');
  addCode('// objetivo: ' + goalText(), 'goal');
  const headList = listText(varNamed('head'));
  for (const v of S.vars) {
    let rhs;
    if (!v.t) rhs = 'NULL';
    else if (v.name === 'head') rhs = 'lista();';
    else if (v.t === varNamed('head').t) rhs = 'head';
    else rhs = 'ultimo(head)';
    addCode(`Nodo *${v.name} = ${rhs}${rhs.endsWith(';') ? '' : ';'}` + (v.name === 'head' ? `  // ${headList}` : ''), 'dim');
  }
  // botones
  $('bnext1').hidden = $('bprev1').hidden = !p;
  $('bnew').hidden = !L.create;
  updateButtons();
  $('lvname').textContent = `${LVI + 1}/${LEVELS.length} · ${L.name}`;
  showCard('intro');
}
const varNamed = name => S.vars.find(v => v.name === name) || null;
const live = n => n && !n.dead;

function goalText() {
  const G = S.L.goal;
  if (G.type === 'reach') return `p apunta al ${G.val}`;
  if (G.type === 'before') return `p->next apunta al ${G.val}`;
  return 'head → ' + G.head.join(' → ') + ' → NULL' + (G.tail != null ? `; tail → ${G.tail}` : '');
}
function listText(v) {
  if (!v || !v.t) return 'NULL';
  const out = [], seen = new Set(); let n = v.t;
  while (n && !seen.has(n)) { seen.add(n); out.push(n.freed ? '✗' : (n.revealed ? n.v : '?')); n = n.next; }
  return out.join(' → ') + (n ? ' → ↺' : ' → NULL');
}
function updateButtons() {
  const L = S.L;
  if (L.create) {
    const left = L.create.vals.length - S.made;
    $('bnew').textContent = left > 0 ? `n = crearNodo(${L.create.vals[S.made]})` : 'n = crearNodo()';
    $('bnew').disabled = left <= 0;
  }
  $('bundo').disabled = !S.undo.length;
}

// ───────────────────────── código ─────────────────────────
function addCode(txt, cls = '') {
  S.code.push({ txt, cls });
  renderCode(true);
}
function renderCode(fresh) {
  const el = $('code');
  el.innerHTML = S.code.map((l, i) => `<div class="${l.cls}${fresh && i === S.code.length - 1 && !/dim|goal/.test(l.cls) ? ' new' : ''}">${l.txt.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
function toast(text, bad) { S.toast = { text, t: 2.6, bad }; }
function error(code, msg) {
  S.errors++; addCode(code, 'err'); toast(msg, true); SFX.err(); vibrate([30, 40, 30]);
  if (S.avatar) S.avatar.shake = 0.35;
}

// ───────────────────────── nombres: cómo llegar a un nodo en C ─────────────────────────
// Devuelve una expresión C que vale `n`, con a lo más `maxArrows` flechas (->). p va primero.
function orderedVars() { const v = S.vars.slice(); v.sort((a, b) => (b.name === 'p') - (a.name === 'p')); return v; }
function nameOf(n, maxArrows = 2) {
  if (!n) return 'NULL';
  for (const v of orderedVars()) if (v.t === n) return v.name;
  for (let d = 1; d <= maxArrows; d++) {
    for (const v of orderedVars()) {
      let m = v.t, ok = true;
      for (let i = 0; i < d; i++) { if (!m || m.freed) { ok = false; break; } m = m.next; }
      if (ok && m === n) return v.name + '->next'.repeat(d);
    }
  }
  return null;
}

// ───────────────────────── ejecutar instrucciones ─────────────────────────
function snapshot() {
  const idx = n => n ? n.k : -1;
  return { nodes: S.nodes.map(n => ({ next: idx(n.next), freed: n.freed, dead: n.dead, revealed: n.revealed, tray: n.tray })),
           vars: S.vars.map(v => idx(v.t)), ops: S.ops, leaks: S.leaks, made: S.made, count: S.nodes.length, code: S.code.length };
}
function restore(s) {
  S.nodes.length = s.count;
  const at = k => k < 0 ? null : S.nodes[k];

function toLogical(e) {

    if (v.t.freed) return { err: `free(${v.name});  // ✗ double free`, msg: 'Ese nodo ya estaba liberado.' };

// ───────────────────────── dibujo ─────────────────────────

  for (const v of S.vars) {
    if (d && d.kind === 'var' && d.v === v && d.moved) continue;
    const a = varAnchor(v);
    if (!v.t) { drawNull(a.x - 4, a.y); continue; }
    if (v.t.dead) continue;
    const b = entry(a, { px: v.t.px, py: v.t.py }, 0.12);
    rArrow(a, b, v.name.charCodeAt(0) * 31, v.t.freed ? '#c23a32' : (v.name === 'p' ? '#2350b8' : '#5d574f'), v.name === 'p' ? 1.7 : 1.3, 0.12, v.t.freed ? [4, 4] : [5, 3]);
  }
  for (const n of S.nodes) drawNode(n, n === dropNode);
  for (const v of S.vars) drawVar(v, v === dropVar);
  drawAvatar();

  // flecha en el dedo y vista previa del código
  if (d && d.moved) {
    let b = d.pt;
    if (dropNode) b = entry(d.from, { px: dropNode.px, py: dropNode.py }, 0.2);
    rArrow(d.from, b, 999, '#2350b8', 2.4, 0.2);
    if (pv) {
      if (pv.err) drawBubble(pv.msg, '#c23a32', 6, '#fff3f1');
      else if (pv.code) drawBubble(pv.code, '#2350b8', 6, '#f2f6ff');
    }
  } else if (S.toast) {
    ctx.globalAlpha = Math.min(1, S.toast.t * 2);
    drawBubble(S.toast.text, S.toast.bad ? '#c23a32' : '#2e2c2a', 6, S.toast.bad ? '#fff3f1' : '#fffdf6');
    ctx.globalAlpha = 1;
  }
}

function update(dt) {
  S.t += dt;
  if (S.toast) { S.toast.t -= dt; if (S.toast.t <= 0) S.toast = null; }
  for (const n of S.nodes) {
    const tx = n.dead ? MX + 22 + n.tray * 30 : n.x, ty = n.dead ? LH - 18 : n.y;
    n.px = lerp(n.px, tx, Math.min(1, dt * 7)); n.py = lerp(n.py, ty, Math.min(1, dt * 7));
  }
  const a = S.avatar;
  if (a) {
    placeAvatar(false);
    a.x = lerp(a.x, a.tx, Math.min(1, dt * 10)); a.y = lerp(a.y, a.ty, Math.min(1, dt * 10));
    if (a.hop > 0) a.hop = Math.max(0, a.hop - dt * 3);
    if (a.shake) a.shake = Math.max(0, a.shake - dt);
  }
}

// ───────────────────────── tamaño ─────────────────────────
function fit() {
  const cell = $('cell').getBoundingClientRect();
  const s = Math.max(0.4, Math.min((cell.width - 4) / LW, (cell.height - 4) / LH));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  if (Math.abs(s - SC) > 0.001 || cv.width !== Math.round(LW * s * DPR)) {
    SC = s;
    cv.style.width = LW * SC + 'px'; cv.style.height = LH * SC + 'px';
    cv.width = Math.round(LW * SC * DPR); cv.height = Math.round(LH * SC * DPR);
    paper = null;
  }
}
new ResizeObserver(fit).observe($('cell'));

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  boil = REDUCED ? 0 : Math.floor(now / 220) % 5;
  if (S) update(dt);
  draw();
  requestAnimationFrame(frame);
}
fit();
loadLevel(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { paper = null; });
requestAnimationFrame(frame);
</script>
