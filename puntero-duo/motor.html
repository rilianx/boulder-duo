<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&family=Cutive+Mono&display=swap">
<style>
/* Cuaderno apaisado: arriba el dibujo (margen = stack, hoja = heap), debajo el programa en C y abajo el armador de líneas. Un solo look de papel, a propósito. */
:root{
  color-scheme: light;
  --paper:#fbf8ef;
  --paper-2:#f3eedf;
  --graphite:#2e2c2a;
  --soft:#6f6a62;
  --margin:#e0726a;
  --ink:#2350b8;
  --note:#ffe27a;
  --ok:#2f8a4c;
  --bad:#c23a32;
  --bad-bg:#fff1ee;
  --warn:#b7791f;
  --warn-bg:#fff6e3;
  --lock:#a59f95;
  --display:"Caveat","Comic Sans MS",cursive;
  --body:"Patrick Hand","Comic Sans MS",system-ui,sans-serif;
  --code:"Cutive Mono","Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--graphite);font-family:var(--body);font-size:17px;line-height:1.25;
  padding-inline:16px;padding-block:8px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:980px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}

header{display:flex;align-items:center;gap:5px;border-bottom:2px solid var(--margin);padding-bottom:4px;min-width:0}
h1{font-family:var(--display);font-size:27px;margin:0;line-height:1;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
h1 span{color:var(--ink)}
h1 small{font-family:var(--body);font-size:15px;color:var(--soft);font-weight:400}
@media (max-width:430px){ h1 small{display:none} }
.mini{font-family:var(--body);font-size:18px;line-height:1;width:33px;height:33px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:10px 4px 10px 4px / 4px 10px 4px 10px;cursor:pointer;flex:none;padding:0}
.mini:disabled{opacity:.35}

.main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(64px,1fr);gap:8px;min-height:0;overflow:hidden}
.boardcell{position:relative;min-width:0;display:flex;align-items:flex-start;justify-content:center}
canvas#cv{display:block;touch-action:manipulation;cursor:pointer;border:2px solid var(--graphite);border-radius:6px 12px 8px 10px / 10px 6px 12px 8px;background:var(--paper)}

.code{min-height:0;min-width:0;overflow-y:auto;background:#fffdf6;border:1.5px solid var(--graphite);border-radius:4px 10px 6px 8px;
  padding:6px 7px;font-family:var(--code);font-size:clamp(11.5px,3vw,14.5px);line-height:1.4;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.code .ln{white-space:pre-wrap}
.code .ln.jump{cursor:pointer}
.code .ln.jump:active{background:#eef3ff}
.code .tg{color:var(--ink);cursor:pointer;padding:0 4px 0 0;display:inline-block;min-width:1.2em}
.code .ln.cur{background:#dfe8ff;box-shadow:inset 3px 0 0 var(--ink)}
.code .ln.cur::after{content:"  ◀ próxima";color:var(--ink);font-family:var(--body);font-size:13px}
.code .ln.fut{opacity:.42}
.code .sub{border-left:1.5px dashed var(--lock);margin-left:6px;padding-left:6px;color:var(--soft)}
.code .dim{color:var(--soft)}
.code .err{color:var(--bad)}
.code .leak{color:var(--warn)}
.code .out{color:var(--ok)}
.code .new{background:var(--note);animation:fade 1.6s ease-out forwards}
@keyframes fade{to{background:transparent}}

.build{display:flex;flex-direction:column;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.line{display:flex;align-items:center;gap:8px;font-family:var(--code);font-size:clamp(14px,3.8vw,17px);min-height:34px;
  border-bottom:1.5px dashed var(--soft);padding:2px 2px 4px}
.line .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.hole{display:inline-block;min-width:1.6em;border-bottom:2px solid var(--lock);color:var(--lock)}
.hole.cur{border-color:var(--ink);color:var(--ink);background:#eef3ff;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{background:#d3e0ff}}
.code .ln.draft{border:1.5px dashed var(--ink);border-radius:4px;background:#f6f9ff;padding:1px 4px;margin-top:2px}
@media (prefers-reduced-motion:reduce){ .hole.cur{animation:none} }
.line .hint{font-family:var(--body);color:var(--soft);font-size:15px}
.line button{font-family:var(--body);font-size:16px;border:1.5px solid var(--soft);background:transparent;color:var(--soft);border-radius:8px;padding:2px 10px;cursor:pointer}
.chips{display:flex;flex-direction:column;gap:5px;max-height:36vh;overflow-y:auto}
.grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1.5px solid var(--lock)}
.tab{font-family:var(--body);font-size:clamp(14px,3.9vw,16px);padding:3px 5px 2px;border:none;background:transparent;color:var(--soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab.on{color:var(--graphite);border-bottom-color:var(--ink)}
.tab:disabled{opacity:.35}
.chip{font-family:var(--code);font-size:clamp(12.5px,3.4vw,15px);min-height:33px;padding:2px 8px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer;touch-action:manipulation}
.chip:active{background:var(--note)}
.chip.decl{border-style:dashed}
.chip.mk{border-color:var(--ok);color:var(--ok)}
.chip.fn{border-color:var(--ink);color:var(--ink)}
.chip.locked{border-style:dotted;border-color:var(--lock);color:var(--lock);background:transparent}
.chip.num{min-width:38px}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.fb{border:2px solid var(--bad);background:var(--bad-bg);border-radius:12px 5px 12px 5px / 5px 12px 5px 12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fb.warn{border-color:var(--warn);background:var(--warn-bg)}
.fb.info{border-color:var(--ink);background:#eef3ff}
.fb code{font-family:var(--code);font-size:15px}
.fb p{margin:0}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb button{font-family:var(--body);font-size:18px;padding:5px 14px;border:2px solid var(--graphite);background:#fffdf6;color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer}

.exbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1.5px solid var(--ok);background:#f1f6ef;border-radius:10px 4px 10px 4px;padding:4px 6px}
.exbar .ttl{font-family:var(--display);font-size:19px;color:var(--ok);margin-right:2px;line-height:1}
.exbar .case{font-family:var(--body);font-size:14px;padding:2px 6px;border:1.5px solid var(--graphite);background:#fffdf6;color:var(--graphite);border-radius:8px;cursor:pointer}
.exbar .case.edit{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.exbar .case.ok{border-color:var(--ok);color:var(--ok)}
.exbar .case.bad{border-color:var(--bad);color:var(--bad)}
.exbar .go{font-family:var(--body);font-size:15px;padding:2px 10px;border:2px solid var(--ok);background:var(--ok);color:#fff;border-radius:8px;cursor:pointer;margin-left:auto}
.card .exlist{display:flex;flex-direction:column;gap:6px}
.card .exlist button{text-align:left}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,248,239,.88);padding:6px;z-index:2}
.card{background:#fffdf6;border:2.5px solid var(--graphite);border-radius:18px 6px 16px 8px / 8px 16px 6px 18px;padding:14px 16px;max-width:460px;width:100%;
  display:flex;flex-direction:column;gap:9px;box-shadow:4px 5px 0 rgba(46,44,42,.18);max-height:100%;overflow-y:auto}
.card h2{font-family:var(--display);font-size:32px;margin:0;line-height:1;text-wrap:balance}
.card p{margin:0}
.card code{font-family:var(--code);font-size:.9em;background:var(--paper-2);padding:0 3px}
.card pre{font-family:var(--code);font-size:12.5px;background:var(--paper-2);padding:6px 8px;margin:0;overflow-x:auto;white-space:pre;-webkit-user-select:text;user-select:text}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card button{font-family:var(--body);font-size:18px;padding:6px 14px;border:2px solid var(--graphite);background:var(--note);color:var(--graphite);
  border-radius:12px 4px 12px 4px / 4px 12px 4px 12px;cursor:pointer}
.card button.sec{background:#fffdf6}
.card ul{margin:0;padding-left:20px}
</style>

<div class="app">
  <header>
    <h1>Puntero <span>C</span> <small>motor</small></h1>
    <button class="mini" id="bundo" aria-label="Deshacer la última línea">↶</button>
    <button class="mini" id="bsort" aria-label="Ordenar el dibujo">⇅</button>
    <button class="mini" id="bexport" aria-label="Ver el programa completo en C">{ }</button>
    <button class="mini" id="breset" aria-label="Empezar de cero">⟲</button>
    <button class="mini" id="bhelp" aria-label="Menú: ejercicios y ayuda">☰</button>
  </header>

  <div class="main">
    <div class="boardcell" id="cell">
      <canvas id="cv" aria-label="Memoria: variables en el margen, nodos en la hoja"></canvas>

  </div>

<script>
'use strict';
const $ = id => document.getElementById(id);
/* ════════════════════════════════════════════════════════════════════
   1. MEMORIA
   Todo lo que se puede deshacer vive en M (datos planos, se clona con JSON).
   Los nodos se identifican por id; un puntero vale un id, null (NULL) o 'G' (basura).
   ════════════════════════════════════════════════════════════════════ */
const G = 'G';
const NAMES = ['head', 'p', 'q', 'nuevo', 'aux', 'sig', 'ant'];
let M = null;
function newMem() { return { nodes: {}, lists: {}, globals: [], frames: [], nextId: 1, nextList: 1 }; }
const listOf = id => M.lists[id];
const LX = 104;   // columna de las cajas Lista, entre el margen y los nodos
function newList() { const id = 'L' + M.nextList++; M.lists[id] = { id, head: null, x: LX, y: Y(Object.keys(M.lists).length) }; return id; }
const nodeOf = id => M.nodes[id];
const liveIds = () => Object.keys(M.nodes).map(Number);

// Dentro de una función solo se ven sus variables locales (como en C); afuera, las de main.
function scope() { return M.frames.length ? M.frames[M.frames.length - 1].locals : M.globals; }
const lookup = name => scope().find(v => v.name === name) || null;

/* ════════════════════════════════════════════════════════════════════
   2. FUNCIONES COMPUESTAS
   Se escriben con las mismas líneas simples que usa el alumno y se desbloquean
   cuando el alumno hace a mano lo mismo que hacen.
   ════════════════════════════════════════════════════════════════════ */
const FUNCS = {
  crearNodo: {
    sig: 'Nodo *crearNodo(int v)', params: [['v', 'int']], returns: true,
    body: ['Nodo *n = malloc(sizeof(Nodo));', 'n->value = v;', 'n->next = NULL;', 'return n;'],
    unlock: 'Crea un nodo con malloc e inicializa sus dos campos: value y next.' },
  insertarInicio: {
    sig: 'void insertarInicio(Lista *l, int v)', params: [['l', 'list'], ['v', 'int']], returns: false,
    body: ['Nodo *n = crearNodo(v);', 'n->next = l->head;', 'l->head = n;'],
    unlock: 'Se desbloquea al completar el ejercicio «Insertar al inicio» (menú ☰).' },
  insertarDespues: {
    sig: 'void insertarDespues(Nodo *p, int v)', params: [['p', 'ptr'], ['v', 'int']], returns: false,
    body: ['Nodo *n = crearNodo(v);', 'n->next = p->next;', 'p->next = n;'],
    unlock: 'Se desbloqueará con su ejercicio (próximamente).' },
  eliminarSiguiente: {
    sig: 'void eliminarSiguiente(Nodo *p)', params: [['p', 'ptr']], returns: false,
    body: ['Nodo *b = p->next;', 'p->next = b->next;', 'free(b);'],
    unlock: 'Se desbloqueará con su ejercicio (próximamente).' },
};
const FUNC_ORDER = ['crearNodo', 'insertarInicio', 'insertarDespues', 'eliminarSiguiente'];
// Atajos: una línea común que pasa a ser un solo toque cuando el alumno ya la escribió a mano.
const SHORTCUTS = {
  avanzar: { title: 'p = p->next;', unlock: 'Avanza un puntero a mano una vez: arma «_ = _;» con la variable y su ->next (por ejemplo p = p->next).' },
};
const ALL_UNLOCKS = FUNC_ORDER.concat(Object.keys(SHORTCUTS));
let UNLOCKED = new Set();
try { UNLOCKED = new Set(JSON.parse(localStorage.getItem('punteroC.unlocked') || '[]')); } catch (e) {}
function saveUnlocks() { try { localStorage.setItem('punteroC.unlocked', JSON.stringify([...UNLOCKED])); } catch (e) {} }

/* ════════════════════════════════════════════════════════════════════
   3. INTÉRPRETE de un subconjunto de C
   ════════════════════════════════════════════════════════════════════ */
class CErr { constructor(msg, kind) { this.msg = msg; this.kind = kind; } }   // kind: compile | run
const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 60) : ms));
const STEP_MS = 520;

function splitArgs(s) {
  const out = []; let depth = 0, cur = '';
  for (const ch of s) {
    if (ch === '(') depth++; if (ch === ')') depth--;
    if (ch === ',' && depth === 0) { out.push(cur.trim()); cur = ''; } else cur += ch;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function deref(id, what) {
  if (id === null) throw new CErr(`Segmentation fault: ${what} es NULL, no hay nodo que leer.`, 'run');
  if (id === G) throw new CErr(`Comportamiento indefinido: ${what} es basura (nunca se inicializó).`, 'run');
  const n = nodeOf(id);
  if (!n || n.freed) throw new CErr(`Uso después de free: ${what} apunta a memoria liberada.`, 'run');
  return n;
}
// nombre(->next)*  → id | null | G
function evalChain(e) {
  const parts = e.split('->'), base = parts.shift();
  if (!/^\w+$/.test(base)) throw new CErr(`error de sintaxis en '${e}'`, 'compile');
  const v = lookup(base);
  if (!v) throw new CErr(`error: '${base}' no está declarada` + (M.frames.length ? ` dentro de ${M.frames.at(-1).fn}()` : '') + '.', 'compile');
  if (v.kind === 'int') throw new CErr(`error: '${base}' es un int, no un puntero.`, 'compile');
  let cur = v.t, path = base;
  if (v.kind === 'list') {   // l->head…: primero el campo head de la Lista, después los next de los nodos
    if (!parts.length) throw new CErr(`error: '${base}' es un Lista *, no un Nodo *. Su primer nodo es ${base}->head.`, 'compile');
    const f = parts.shift();
    if (f !== 'head') throw new CErr(`error: 'Lista' no tiene un miembro llamado '${f}'. Tiene uno solo: head.`, 'compile');
    if (cur === null) throw new CErr(`Segmentation fault: ${base} es NULL.`, 'run');
    cur = listOf(cur).head; path += '->head';
  }
  for (const f of parts) {
    if (f === 'head') throw new CErr("error: 'Nodo' no tiene un miembro llamado 'head'. head es un campo de la Lista.", 'compile');
    if (f === 'prev') throw new CErr("error: 'Nodo' no tiene un miembro llamado 'prev'. En una lista simple no se puede retroceder.", 'compile');
    if (f !== 'next') throw new CErr(`error: 'Nodo' no tiene un miembro llamado '${f}'.`, 'compile');
    cur = deref(cur, path).next; path += '->next';
  }
  return cur;
}
async function evalPtr(e, ctx) {
  e = e.trim();
  if (e === 'NULL') return null;
  if (e === 'malloc(sizeof(Nodo))') {
    const id = M.nextId++;
    const [x, y] = freeSlot();
    M.nodes[id] = { id, v: null, next: G, freed: false, dead: false, x, y, mallocd: ctx.depth === 0, initV: false, initN: false };
    spawnFx(id);
    return id;
  }
  const m = /^(\w+)\((.*)\)$/.exec(e);
  if (m) return await callFn(m[1], splitArgs(m[2]), ctx, true);
  return evalChain(e);
}
function evalInt(e) {
  e = e.trim();
  if (/^-?\d+$/.test(e)) return +e;
  const v = lookup(e);
  if (v && v.kind === 'int') return v.val;
  throw new CErr(`error: '${e}' no es un número.`, 'compile');
}

async function callFn(name, args, ctx, wantValue) {
  const F = FUNCS[name];
  if (!F) throw new CErr(`error: la función '${name}' no existe.`, 'compile');
  if (ctx.depth === 0 && EX && name === EX.def.fn) throw new CErr(`error: estás escribiendo ${name}(); no puedes llamarla dentro de sí misma.`, 'compile');
  if (ctx.depth === 0 && !ctx.replay && !UNLOCKED.has(name)) throw new CErr(`error: '${name}' todavía no está definida. ${F.unlock}`, 'compile');
  if (wantValue && !F.returns) throw new CErr(`error: ${name}() es void, no devuelve un puntero.`, 'compile');
  if (args.length !== F.params.length) throw new CErr(`error: ${name}() recibe ${F.params.length} argumento(s).`, 'compile');
  // los argumentos se evalúan en quien llama y se COPIAN a las variables locales de la función
  const locals = [];
  for (let i = 0; i < args.length; i++) {
    const [pn, pk] = F.params[i];
    if (pk === 'int') locals.push({ name: pn, kind: 'int', val: evalInt(args[i]) });
    else if (pk === 'list') {
      const lv = lookup(args[i]);
      if (!lv || lv.kind !== 'list') throw new CErr(`error: ${name}() espera un Lista * (por ejemplo l), no '${args[i]}'.`, 'compile');
      locals.push({ name: pn, kind: 'list', t: lv.t });
    } else locals.push({ name: pn, kind: 'ptr', t: await evalPtr(args[i], ctx) });
  }
  M.frames.push({ fn: name, locals });
  let ret;
  try {
    let j = 0;
    for (const line of F.body) {
      const path = ctx.path + '.' + j++;
      let sub = null;
      if (!ctx.replay) { const entry = { text: line, sub: [] }; ctx.sub.push(entry); sub = entry.sub; }
      await pace(path);
      const r = await execStmt(line, { depth: ctx.depth + 1, sub, path, replay: ctx.replay });
      if (r && 'ret' in r) { ret = r.ret; break; }
    }
    if (!FAST && (!REPLAY || REPLAY.mode === 'play')) await sleep(STEP_MS * 0.6);
  } finally { M.frames.pop(); }
  return ret;
}

// Ejecuta una línea. Devuelve { ret } si es un return.
async function execStmt(text, ctx) {
  let m;
  const top = ctx.depth === 0;
  if ((m = /^return (.+);$/.exec(text))) return { ret: await evalPtr(m[1], ctx) };
  if ((m = /^free\((.+)\);$/.exec(text))) {
    const id = await evalPtr(m[1], ctx);
    if (id === null) { ctx.note = '  // free(NULL) no hace nada'; return; }
    if (id === G) throw new CErr(`Comportamiento indefinido: ${m[1]} es basura.`, 'run');
    const n = nodeOf(id);
    if (n.freed) throw new CErr('double free: ese nodo ya estaba liberado.', 'run');
    n.freed = true;
    return;
  }
  if ((m = /^if \((.+)->value == (.+)\)$/.exec(text))) {
    const n = deref(evalChain(m[1]), m[1]);
    if (n.v === null) throw new CErr(`Comportamiento indefinido: ${m[1]}->value es basura (nunca se le asignó un valor).`, 'run');
    const ok = n.v === evalInt(m[2]);
    flash(n.id, ok);
    ctx.note = ok ? '  // verdadero' : '  // falso';
    return;
  }
  if ((m = /^if \((.+) == NULL\)$/.exec(text))) {
    const id = evalChain(m[1]);
    if (id === G) throw new CErr(`Comportamiento indefinido: ${m[1]} es basura.`, 'run');
    ctx.note = id === null ? '  // verdadero' : '  // falso';
    if (id !== null && nodeOf(id)) flash(id, false);
    return;
  }
  if ((m = /^printf\("%d", (.+)->value\);$/.exec(text))) {
    const n = deref(evalChain(m[1]), m[1]);
    if (n.v === null) throw new CErr(`Comportamiento indefinido: ${m[1]}->value es basura.`, 'run');
    flash(n.id, true);
    ctx.out = String(n.v);
    return;
  }
  if ((m = /^(\w+)\((.*)\);$/.exec(text))) { await callFn(m[1], splitArgs(m[2]), ctx, false); return; }

  const eq = text.indexOf(' = ');
  if (eq < 0 || !text.endsWith(';')) throw new CErr('error de sintaxis.', 'compile');
  const lhs = text.slice(0, eq), rhs = text.slice(eq + 3, -1);

  if ((m = /^Lista \*(\w+)$/.exec(lhs))) {
    if (lookup(m[1])) throw new CErr(`error: '${m[1]}' ya está declarada.`, 'compile');
    let id;
    if (rhs === 'crearLista()') id = newList();
    else { const o = lookup(rhs); if (!o || o.kind !== 'list') throw new CErr(`error: a un Lista * solo se le puede asignar otra lista o crearLista().`, 'compile'); id = o.t; }
    scope().push({ name: m[1], kind: 'list', t: id });
    return;
  }
  if ((m = /^(\w+)->head$/.exec(lhs))) {
    const lv = lookup(m[1]);
    if (!lv) throw new CErr(`error: '${m[1]}' no está declarada.`, 'compile');
    if (lv.kind !== 'list') throw new CErr(`error: '${m[1]}' es un Nodo *; los nodos no tienen campo head (tienen value y next).`, 'compile');
    const val = await evalPtr(rhs, ctx);
    listOf(lv.t).head = val;
    return;
  }
  if ((m = /^Nodo \*(\w+)$/.exec(lhs))) {
    if (lookup(m[1])) throw new CErr(`error: '${m[1]}' ya está declarada.`, 'compile');
    if (rhs === m[1] || rhs.startsWith(m[1] + '->')) throw new CErr(`error: '${m[1]}' se usa en su propia declaración, antes de tener un valor.`, 'compile');
    const val = await evalPtr(rhs, ctx);
    scope().push({ name: m[1], kind: 'ptr', t: val });
    return;
  }
  if ((m = /^(.+)->value$/.exec(lhs))) {
    const val = evalInt(rhs);
    const n = deref(evalChain(m[1]), m[1]);
    n.v = val; if (top) n.initV = true;
    flash(n.id, true);
    return;
  }
  if ((m = /^(.+)->next$/.exec(lhs))) {
    const val = await evalPtr(rhs, ctx);
    const n = deref(evalChain(m[1]), m[1]);
    const old = n.next;
    n.next = val; if (top) n.initN = true;
    return;
  }
  if (/^\w+$/.test(lhs)) {
    const v = lookup(lhs);
    if (!v) throw new CErr(`error: '${lhs}' no está declarada. Primero: Nodo *${lhs} = …;`, 'compile');
    if (v.kind === 'list') throw new CErr(`error: '${lhs}' es un Lista *. Para cambiar su primer nodo escribe ${lhs}->head = …;`, 'compile');
    const val = await evalPtr(rhs, ctx);
    v.t = val;
    if (top && rhs === lhs + '->next') unlock('avanzar');
    return;
  }
  throw new CErr('error de sintaxis.', 'compile');
}

// Un nodo al que no llega ninguna variable (de ningún marco) ni ninguna flecha queda sin acceso.
function checkLeaks() {
  const vars = M.globals.concat(...M.frames.map(f => f.locals));
  const roots = vars.filter(v => v.kind === 'ptr').map(v => v.t)
    .concat(vars.filter(v => v.kind === 'list' && v.t !== null && listOf(v.t)).map(v => listOf(v.t).head));
  const seen = new Set(), q = roots.filter(id => id !== null && id !== G && nodeOf(id) && !nodeOf(id).freed);
  while (q.length) {
    const id = q.pop(); if (seen.has(id)) continue; seen.add(id);
    const nx = nodeOf(id).next;
    if (nx !== null && nx !== G && nodeOf(nx) && !nodeOf(nx).freed) q.push(nx);
  }
  const lost = [];
  for (const id of liveIds()) { const n = nodeOf(id); if (!n.dead && !n.freed && !seen.has(id)) { n.dead = true; lost.push(n); } }
  return lost;
}

/* ════════════════════════════════════════════════════════════════════
   4. PROGRAMA, DESHACER Y DESBLOQUEOS
   ════════════════════════════════════════════════════════════════════ */
let PROG = [], UNDO = [], BUSY = false;
async function run(text) {
  if (BUSY) return;
  BUSY = true; hideFb(); renderBuilder();
  const snap = JSON.stringify(M);
  const entry = { text, src: text, sub: [], cls: 'new' };
  PROG.push(entry); renderCode();
  const ctx = { depth: 0, sub: entry.sub, path: String(PROG.length - 1) };
  try {
    await execStmt(text, ctx);
  } catch (e) {
    if (!(e instanceof CErr)) { console.error(e); e = new CErr('Error interno: ' + e.message, 'run'); }
    if (e.kind === 'run') await sleep(350);
    M = JSON.parse(snap);
    entry.text = '// ✗ ' + text; entry.cls = 'err'; entry.sub = []; entry.msg = e.msg;
    renderCode(); shake();
    showFb('bad', '✗ ' + text, e.msg, [['Entendido', hideFb]]);
    beep(160, 0.12, 'square', 0.03); setTimeout(() => beep(120, 0.15, 'square', 0.03), 90); vibrate([30, 40, 30]);
    BUSY = false; renderBuilder(); return;
  }
  UNDO.push({ mem: snap, prog: PROG.indexOf(entry) });
  entry.before = snap;
  if (entry.sub.length) entry.open = false;   // las funciones quedan plegadas; se abren tocándolas
  if (ctx.note) entry.text += ctx.note;
  if (ctx.out != null) PROG.push({ text: '// salida: ' + ctx.out, cls: 'out' });
  beep(620, 0.08, 'triangle', 0.05, 1.3); vibrate(12);
  const lost = checkLeaks();
  if (lost.length) {
    const nm = lost.map(n => n.v === null ? '(sin valor)' : n.v);
    const vals = nm.length > 1 ? nm.slice(0, -1).join(', el ') + ' y el ' + nm.at(-1) : String(nm[0]);
    const pl = lost.length > 1;
    PROG.push({ text: `// ⚠ fuga: el ${vals} ${pl ? 'quedaron' : 'quedó'} sin acceso`, cls: 'leak' });
    beep(500, 0.5, 'sine', 0.05, 0.3);
    showFb('warn', '⚠ ' + text, `${pl ? `El ${vals} quedaron` : `El ${vals} quedó`} sin ninguna variable ni flecha que ${pl ? 'los' : 'lo'} apunte. En C ya no hay forma de alcanzar${pl ? 'los' : 'lo'} ni de liberar${pl ? 'los' : 'lo'}.`,
      [['↶ Deshacer', undo], ['Seguir así', hideFb]]);
  }
  // crearNodo: un nodo hecho con malloc al que el alumno le dio value y next a mano
  if (Object.values(M.nodes).some(n => n.mallocd && n.initV && n.initN)) unlock('crearNodo');
  renderCode();
  BUSY = false; renderBuilder();
  if (PENDING_UNLOCK.length) showUnlock(PENDING_UNLOCK.shift());
}
function undo() {
  if (BUSY || REPLAY || !UNDO.length) return;
  const u = UNDO.pop();
  M = JSON.parse(u.mem); PROG.length = u.prog; renderCode();
  hideFb(); renderBuilder();
}
const PENDING_UNLOCK = [];
function unlock(name) {
  if (REPLAY || UNLOCKED.has(name)) return;
  UNLOCKED.add(name); saveUnlocks();
  if (!PENDING_UNLOCK.includes(name)) PENDING_UNLOCK.push(name);
}

/* ════════════════════════════════════════════════════════════════════
   4b. VOLVER A UNA LÍNEA Y REPETIR
   Tocar una línea del código restaura la memoria de justo antes y deja todo en pausa.
   Desde ahí se avanza paso a paso (entrando a las funciones), se reproduce o se salta al final.
   Como el intérprete es determinista, repetir una línea da exactamente el mismo resultado.
   ════════════════════════════════════════════════════════════════════ */
let REPLAY = null;   // { mode: 'pause'|'play'|'fast', target, cur, gate, abort, next }
class Abort {}
// Marca el ritmo antes de cada paso: espera normal, o una pausa que suelta el botón «siguiente».
let FAST = false;   // al probar casos: sin animación
async function pace(path) {
  if (FAST) return;
  if (!REPLAY) { await sleep(STEP_MS); return; }
  REPLAY.cur = path;
  if (REPLAY.mode === 'fast') {
    if (path !== REPLAY.target) { if (REPLAY.abort) throw new Abort(); return; }
    REPLAY.mode = 'pause';
  }
  openPath(path); renderCode(); renderBuilder();
  if (REPLAY.mode === 'play') { await sleep(STEP_MS); }
  else await new Promise(r => { REPLAY.gate = r; });
  REPLAY.gate = null;
  if (REPLAY.abort) throw new Abort();
}
function openPath(path) {   // abre las funciones que contienen el paso actual
  const ks = path.split('.').map(Number); let list = PROG;
  for (let i = 0; i < ks.length - 1; i++) { const e = list[ks[i]]; if (!e) return; e.open = true; list = e.sub; }
}
function travel(path) {
  const top = +path.split('.')[0];
  const e = PROG[top];
  if (!e || !e.before) return;
  if (REPLAY) { REPLAY.abort = true; REPLAY.next = path; if (REPLAY.gate) REPLAY.gate(); return; }
  if (BUSY) return;
  replayFrom(top, path);
}
async function replayFrom(top, target) {
  BUSY = true; BUILD = null; hideFb(); closeCard();
  REPLAY = { mode: 'fast', target, cur: null, gate: null, abort: false, next: null };
  M = JSON.parse(PROG[top].before);
  for (const k in AR) delete AR[k];
  let stopAt = null;
  try {
    for (let k = top; k < PROG.length; k++) {
      const e = PROG[k];
      if (!e.before) continue;            // errores, salidas y avisos no se ejecutan
      await pace(String(k));
      if (REPLAY.write) { stopAt = k; break; }
      await execStmt(e.src, { depth: 0, sub: null, path: String(k), replay: true });
      checkLeaks();
    }
  } catch (err) {
    if (!(err instanceof Abort)) { console.error(err); }
  }
  const next = REPLAY.next;
  REPLAY = null; BUSY = false;
  if (stopAt !== null) {   // escribir desde aquí: se descarta lo que venía después
    PROG = PROG.slice(0, stopAt);
    UNDO = UNDO.filter(u => u.prog < stopAt);
  }
  renderCode(); renderBuilder();
  if (next != null) travel(next);
}
function replayStep() { if (REPLAY && REPLAY.gate) { REPLAY.mode = 'pause'; REPLAY.gate(); } }
function replayPlay() { if (!REPLAY) return; REPLAY.mode = 'play'; if (REPLAY.gate) REPLAY.gate(); renderBuilder(); }
function replayPause() { if (REPLAY) { REPLAY.mode = 'pause'; renderBuilder(); } }
function replayEnd() { if (!REPLAY) return; REPLAY.mode = 'fast'; REPLAY.target = null; if (REPLAY.gate) REPLAY.gate(); }
function replayWrite() { if (REPLAY && REPLAY.gate && !REPLAY.cur.includes('.')) { REPLAY.write = true; REPLAY.gate(); } }
function renderReplayBar(box) {
  const atTop = REPLAY.cur && !REPLAY.cur.includes('.');
  const k = REPLAY.cur ? +REPLAY.cur.split('.')[0] : 0;
  const where = !REPLAY.cur ? '' : atTop ? `antes de la línea ${visibleLine(k)}` : `dentro de ${FUNC_NAME_AT(REPLAY.cur)}()`;
  $('ltxt').innerHTML = REPLAY.mode === 'play' ? `<span class="hint">▶ reproduciendo… ${where}</span>` : `<span class="hint">⏸ en pausa ${where}. La línea resaltada es la próxima.</span>`;
  $('bx').hidden = true;
  const g = document.createElement('div'); g.className = 'grp';
  const paused = REPLAY.mode !== 'play';
  g.appendChild(mkChip('⏭ siguiente', 'fn', replayStep));
  g.appendChild(paused ? mkChip('▶ reproducir', 'fn', replayPlay) : mkChip('⏸ pausa', 'fn', replayPause));
  g.appendChild(mkChip('⏩ ir al final', '', replayEnd));
  const w = mkChip('✎ escribir desde aquí', 'decl', replayWrite);
  if (!(paused && atTop)) { w.disabled = true; w.style.opacity = .4; }
  g.appendChild(w);
  box.appendChild(g);
  const tip = document.createElement('p'); tip.style.cssText = 'margin:0;font-size:14px;color:var(--soft)';
  tip.textContent = paused && !atTop ? 'Para escribir desde aquí, avanza hasta salir de la función.' : 'Toca cualquier línea del código para saltar a ese momento.';
  box.appendChild(tip);
}
function visibleLine(k) { return PROG.slice(0, k + 1).filter(e => e.before || e.cls === 'err').length; }
function FUNC_NAME_AT(path) {
  const ks = path.split('.').map(Number); let list = PROG, e = null;
  for (let i = 0; i < ks.length - 1; i++) { e = list[ks[i]]; list = e.sub; }
  const m = e && /(\w+)\(/.exec(e.src || e.text); return m ? m[1] : 'la función';
}

/* ════════════════════════════════════════════════════════════════════
   4c. EJERCICIOS
   Se escribe el cuerpo de una función dentro de su marco. Las mismas líneas se repiten
   sobre varios casos (lista vacía, un nodo, varios) y cada caso se revisa por separado.
   Completar el ejercicio desbloquea la función en el modo libre.
   ════════════════════════════════════════════════════════════════════ */
const EXERCISES = [
  { id: 'insertarInicio', fn: 'insertarInicio', title: 'Insertar al inicio', v: 7,
    sig: 'void insertarInicio(Lista *l, int v)',
    intro: 'Escribe el cuerpo de <code>insertarInicio</code>: debe dejar un nodo nuevo con <code>v</code> al comienzo de la lista <code>l</code>.<br><br>Estás <b>dentro de la función</b>: en el stack ves sus parámetros <code>l</code> y <code>v</code> (copias de lo que le pasó <code>main</code>). Las mismas líneas se van a probar con una lista vacía, con un nodo, con tres y con un caso oculto.',
    cases: [{ name: 'vacía', list: [] }, { name: '1 nodo', list: [5] }, { name: '3 nodos', list: [5, 2, 8] }, { name: 'oculto', list: [4, 1, 6, 3], hidden: true }],
    edit: 2,
    ref: 'void insertarInicio(Lista *l, int v) {\n  Nodo *n = crearNodo(v);\n  n->next = l->head;\n  l->head = n;\n}',
    expect: (orig, v) => [v].concat(orig) },
];
let EX = null;   // { def, edit, results, saved }
let DONE = new Set();
try { DONE = new Set(JSON.parse(localStorage.getItem('punteroC.done') || '[]')); } catch (e) {}

// memoria de un caso: main tiene la lista; la función ya fue llamada y su marco está arriba
function caseMem(c) {
  M = newMem();
  const lid = newList();
  let prev = null; const ids = [];
  c.list.forEach((v, i) => {
    const id = M.nextId++;
    M.nodes[id] = { id, v, next: null, freed: false, dead: false, x: COLS[i % COLS.length], y: Y(Math.floor(i / COLS.length) % ROWS) };
    if (prev === null) listOf(lid).head = id; else nodeOf(prev).next = id;
    prev = id; ids.push(id);
  });
  M.globals.push({ name: 'lista', kind: 'list', t: lid });
  M.frames.push({ fn: EX.def.fn, locals: [{ name: 'l', kind: 'list', t: lid }, { name: 'v', kind: 'int', val: EX.def.v }] });
  for (const k in POS) delete POS[k];

}
// repite todas las líneas sobre el caso de edición, sin animar, para dejar la memoria y los "antes" al día
async function rebuildEdit() {
  caseMem(EX.def.cases[EX.edit]);
  FAST = true;
  try {
    for (const e of PROG) {
      if (!e.before) continue;
      e.before = JSON.stringify(M);
      await execStmt(e.src, { depth: 0, sub: null, path: '0', replay: true });
      checkLeaks();
    }
  } finally { FAST = false; }
  UNDO = PROG.map((e, i) => e.before ? { mem: e.before, prog: i } : null).filter(Boolean);
}
// ejecuta las líneas en un caso y revisa el resultado
async function runCase(i, animate) {
  const c = EX.def.cases[i];
  const orig = caseMem(c);
  const lines = PROG.filter(e => e.before);
  if (!animate) FAST = true;
  let k = 0;
  try {
    for (; k < lines.length; k++) {
      if (animate) { VIEW = { k }; renderCode(); await sleep(STEP_MS); }
      await execStmt(lines[k].src, { depth: 0, sub: null, path: '0', replay: true });
      checkLeaks();
    }
  } catch (e) {
    FAST = false;
    if (!(e instanceof CErr)) throw e;
    return { ok: false, line: lines[k] && lines[k].src, msg: e.msg };
  }
  FAST = false;
  if (animate) { VIEW = { k: lines.length }; renderCode(); await sleep(STEP_MS); }
  M.frames.pop();   // la función termina: su marco desaparece
  checkLeaks();
  const lost = Object.values(M.nodes).filter(n => n.dead);   // todo lo que quedó sin acceso, durante o al final
  const want = EX.def.expect(c.list, EX.def.v);
  const got = [], gotIds = [], seen = new Set();
  let id = listOf(M.globals[0].t).head, bad = null;
  while (id !== null) {
    if (id === G) { bad = 'la lista termina en un puntero basura (un next sin inicializar).'; break; }
    const n = nodeOf(id);
    if (!n || n.freed) { bad = 'la lista pasa por un nodo liberado.'; break; }

    return { ok: false, msg: `${pl ? `El ${vals} quedaron` : `El ${vals} quedó`} sin acceso (fuga): la lista terminó ${show(got)} y se esperaba ${show(want)}.` };
  }

    <div style="font-size:34px;color:#d9a400;letter-spacing:4px">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <ul>${rows}</ul>
    <p>Usaste <b>${n}</b> líneas; la referencia usa ${best}${EX.hadCrear ? '' : ' (con <code>malloc</code>; con <code>crearNodo</code> bastan 3)'}.</p>
    ${first ? `<p>🔓 <b>${EX.def.fn}()</b> queda desbloqueada en el modo libre.</p>` : ''}
    <p>Una solución de referencia:</p><pre>${esc(EX.def.ref)}</pre>
    <div class="row"><button id="cg">Seguir</button><button class="sec" id="cfree">Ir al modo libre</button></div>`, () => {
    $('cg').onclick = closeCard; $('cfree').onclick = () => { closeCard(); leaveExercise(); }; $('cg').focus();
  });
}

/* ════════════════════════════════════════════════════════════════════
   5. ARMADOR DE LÍNEAS
   Una plantilla tiene huecos §tipo que se llenan tocando piezas:
   §new nombre sin declarar · §var variable declarada · §lv expresión que apunta a un nodo
   §ptr cualquier valor puntero · §num número
   ════════════════════════════════════════════════════════════════════ */
let BUILD = null, TAB = 'Variables';
const HOLE = /§(\w+)/;

function renderCode() {

    if (!cur) return -1;
    const p = path.split('.').map(Number);
    for (let i = 0; i < Math.min(p.length, cur.length); i++) if (p[i] !== cur[i]) return p[i] < cur[i] ? -1 : 1;
    return p.length === cur.length ? 0 : p.length < cur.length ? 2 : 1;

    e.open = e.open === false; renderCode();
  });

  PROG.forEach(e => { if (e.cls === 'new') setTimeout(() => { if (e.cls === 'new') e.cls = ''; }, 1600); });

}

function exportC() {

    <p>Abajo eliges una línea y llenas sus huecos tocando piezas. La línea se ejecuta y se anima. A la derecha queda el programa.</p>
    <ul>
      <li><code>malloc</code> crea un nodo con <b>basura</b>: hay que darle <code>value</code> y <code>next</code>.</li>
      <li>Lo que no compila o se cae (segfault, uso después de <code>free</code>) no se ejecuta y se explica.</li>
      <li>Un nodo que nadie apunta queda transparente: <b>sin acceso</b>.</li>
      <li><code>crearNodo</code> y el atajo <code>p = p->next;</code> se desbloquean haciéndolos a mano. Las <b>operaciones de lista</b> (<code>insertarInicio</code>…) se desbloquean al completar su <b>ejercicio</b> (menú ☰). Al usar una función, toca su línea para ver los pasos por dentro.</li>
      <li>Si una línea usa dos o más <code>->next</code> seguidos, aparece una advertencia antes de ejecutarla.</li>

    <p>⇅ ordena el dibujo · { } muestra el programa completo · ↶ deshace.</p>
    <p>Desbloqueado: ${ALL_UNLOCKS.filter(f => UNLOCKED.has(f)).map(f => `<code>${esc(SHORTCUTS[f] ? SHORTCUTS[f].title : f + '()')}</code>`).join(', ') || 'nada todavía'}.</p>
    <div class="row"><button id="cg">Seguir</button><button class="sec" id="call">Desbloquear todas (profesor)</button><button class="sec" id="cnone">Volver a bloquear</button></div>`, () => {

    $('call').onclick = () => { ALL_UNLOCKS.forEach(f => UNLOCKED.add(f)); saveUnlocks(); closeCard(); renderBuilder(); };

  });
}

/* ════════════════════════════════════════════════════════════════════
   7. DIBUJO A MANO
   ════════════════════════════════════════════════════════════════════ */
const LW = 400, LH = 250;
const MX = 70;
const NW = 62, NH = 30, DW = 40;
const PW = 60, PH = 24;
const COLS = [178, 260, 342], ROWS = 3;   // a la izquierda queda la columna de las cajas Lista (LX)
const Y = i => 46 + i * 76;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('cv'), ctx = cv.getContext('2d');
let SC = 1, DPR = 1, boil = 0, T = 0;
const POS = {};     // id → posición dibujada (se anima hacia x,y)
const FX = { flash: {}, shake: 0 };
const AR = {};      // geometría animada de cada flecha

function freeSlot() {
  const used = Object.values(M.nodes).map(n => n.x + ',' + n.y);
  for (let r = 0; r < ROWS; r++) for (const x of COLS) if (!used.includes(x + ',' + Y(r))) return [x, Y(r)];
  return [COLS.at(-1), Y(ROWS - 1)];
}
function spawnFx(id) { const n = nodeOf(id); POS[id] = { x: n.x, y: n.y - 34 }; }
function flash(id, ok) { FX.flash[id] = { t: 1, ok }; }
function shake() { FX.shake = 0.4; }

// Ordenar: las listas que salen de cada variable, en orden, columna por columna. Lo liberado sin referencias se borra.
function sortDrawing() {
  const order = [], seen = new Set();
  const starts = Object.values(M.lists).map(l => ({ t: l.head })).concat(M.globals.filter(v => v.kind === 'ptr'));
  for (const v of starts) {
    let id = v.t;
    while (id !== null && id !== G && nodeOf(id) && !seen.has(id)) { seen.add(id); order.push(id); id = nodeOf(id).next; }
  }
  const pointed = new Set(M.globals.map(v => v.t).concat(Object.values(M.nodes).map(n => n.next), Object.values(M.lists).map(l => l.head)));
  for (const id of liveIds()) if (!seen.has(id)) { if (nodeOf(id).freed && !pointed.has(id)) delete M.nodes[id]; else order.push(id); }
  order.forEach((id, i) => { const n = nodeOf(id); if (!n) return; n.x = COLS[i % COLS.length]; n.y = Y(Math.floor(i / COLS.length) % ROWS); });
}

function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return ((n >>> 0) % 10000) / 5000 - 1; }

const lerp = (a, b, t) => a + (b - a) * t;
function rLine(x1, y1, x2, y2, seed, amp = 1, passes = 2) {
  for (let p = 0; p < passes; p++) {
    const s = seed * 13 + p * 5;
    ctx.beginPath();
    ctx.moveTo(x1 + J(s + 2, amp), y1 + J(s + 3, amp));
    ctx.quadraticCurveTo((x1 + x2) / 2 + J(s, amp * 1.4), (y1 + y2) / 2 + J(s + 1, amp * 1.4), x2 + J(s + 4, amp), y2 + J(s + 5, amp));
    ctx.stroke();

}
function rRect(x, y, w, h, seed, amp = 0.9) {
  rLine(x, y, x + w, y, seed, amp); rLine(x + w, y, x + w, y + h, seed + 1, amp);
  rLine(x + w, y + h, x, y + h, seed + 2, amp); rLine(x, y + h, x, y, seed + 3, amp);
}
function rCircle(x, y, r, seed, fill) {
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const a = (i / 22) * Math.PI * 2, rr = r + J(seed + i, r * 0.07);
    i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }

  ctx.stroke();
}
/* Geometría de una flecha: sale hacia la derecha desde el punto y llega al MEDIO del nodo,
   perpendicular al borde: por arriba si viene de arriba (o es el mismo nodo), por abajo si viene de abajo,
   por la izquierda si es una variable del margen. */
function arrowGeo(a, n, opts) {
  const L = n.x - NW / 2, mid = n.x - 6;
  if (opts.fromVar && !opts.toList) {   // a un nodo: la flecha llega por arriba, sin cruzar la caja Lista ni otros nodos
    const b = { x: mid + opts.lane, y: n.y - NH / 2 - 1 };
    return { a, b, c1: { x: a.x + 40, y: Math.min(a.y, b.y - 30) }, c2: { x: b.x, y: b.y - 30 } };
  }
  if (opts.fromVar) { const b = { x: L - 1, y: n.y + opts.lane }; return { a, b, c1: { x: a.x + Math.min(36, (b.x - a.x) * 0.5), y: a.y }, c2: { x: b.x - 24, y: b.y } }; }
  if (opts.self) { const b = { x: mid, y: n.y - NH / 2 - 1 }; return { a, b, c1: { x: a.x + 42, y: a.y - 4 }, c2: { x: mid + 4, y: b.y - 46 } }; }
  const dy = n.y - a.y;
  // otra fila: sale del punto hacia abajo (o arriba), cruza por el pasillo entre filas y entra al medio del nodo
  if (dy > NH * 0.9) { const b = { x: mid, y: n.y - NH / 2 - 1 }; return { a, b, c1: { x: a.x, y: a.y + 46 }, c2: { x: b.x, y: b.y - 40 } }; }
  if (dy < -NH * 0.9) { const b = { x: mid, y: n.y + NH / 2 + 1 }; return { a, b, c1: { x: a.x, y: a.y - 46 }, c2: { x: b.x, y: b.y + 40 } }; }
  // misma fila hacia adelante: derecho a su costado izquierdo
  if (a.x < L) { const b = { x: L - 1, y: n.y }; const reach = Math.min(40, Math.max(18, (b.x - a.x) * 0.5 + 12)); return { a, b, c1: { x: a.x + reach, y: a.y }, c2: { x: b.x - 26, y: n.y } }; }
  // misma fila hacia atrás: arco por arriba
  return arcGeo(a, n, 34);
}
// ¿la curva pasa por encima de algún nodo que no es ni el de origen ni el de destino?
function crossesNode(g, skip) {
  const pts = [];
  for (let i = 1; i < 12; i++) {
    const t = i / 12, u = 1 - t;
    pts.push({ x: u*u*u*g.a.x + 3*u*u*t*g.c1.x + 3*u*t*t*g.c2.x + t*t*t*g.b.x, y: u*u*u*g.a.y + 3*u*u*t*g.c1.y + 3*u*t*t*g.c2.y + t*t*t*g.b.y });
  }
  for (const id of liveIds()) {
    if (skip.includes(id) || !POS[id]) continue;
    const P = POS[id], L = P.x - NW / 2 - 2, R = P.x + NW / 2 + 2, Tp = P.y - NH / 2 - 2, B = P.y + NH / 2 + 2;
    if (pts.some(q => q.x > L && q.x < R && q.y > Tp && q.y < B)) return true;
  }
  return false;
}
// arco por arriba de la fila, para no esconder la flecha detrás de otros nodos
function arcGeo(a, n, lift) {
  const mid = n.x - 6, b = { x: mid, y: n.y - NH / 2 - 1 };
  const top = Math.min(a.y, n.y) - NH / 2 - lift;
  return { a, b, c1: { x: a.x + 8, y: top }, c2: { x: mid, y: top } };
}
function nextGeo(a, srcId, tgtId) {
  const n = posNodeOf(tgtId);
  let g = arrowGeo(a, n, { self: srcId === tgtId });
  if (srcId === tgtId || !crossesNode(g, [srcId, tgtId])) return g;
  for (const lift of [30, 44, 60]) { g = arcGeo(a, n, lift); if (!crossesNode(g, [srcId, tgtId])) return g; }
  return g;
}
const posNodeOf = id => ({ x: POS[id].x, y: POS[id].y });
function lerpGeo(cur, tgt, k) {
  if (!cur) return JSON.parse(JSON.stringify(tgt));
  for (const key of ['a', 'b', 'c1', 'c2']) { cur[key].x = lerp(cur[key].x, tgt[key].x, k); cur[key].y = lerp(cur[key].y, tgt[key].y, k); }
  return cur;
}
function drawArrow(g, seed, color, width, dash) {
  const { a, b, c1, c2 } = g;

  if (dash) ctx.setLineDash(dash);

    ctx.beginPath(); ctx.moveTo(a.x + J(seed + p, 0.7), a.y + J(seed + p + 9, 0.7));
    ctx.bezierCurveTo(c1.x + J(seed + p + 3, 2), c1.y + J(seed + p + 4, 2), c2.x + J(seed + p + 5, 2), c2.y + J(seed + p + 6, 2), b.x, b.y);
    ctx.stroke();

  rLine(b.x, b.y, b.x - Math.cos(ang - 0.45) * L, b.y - Math.sin(ang - 0.45) * L, seed + 20, 0.6, 1);
  rLine(b.x, b.y, b.x - Math.cos(ang + 0.45) * L, b.y - Math.sin(ang + 0.45) * L, seed + 21, 0.6, 1);
}
function drawNull(x, y, seed) {
  ctx.strokeStyle = '#6f6a62'; ctx.lineWidth = 1.3;

  rLine(x + 6, y - 6, x + 6, y + 6, seed + 1, 0.4, 1); rLine(x + 9, y - 4, x + 9, y + 4, seed + 2, 0.4, 1); rLine(x + 12, y - 2, x + 12, y + 2, seed + 3, 0.4, 1);
}
function drawGarbage(x, y, seed) {   // puntero sin inicializar: un garabato que no llega a ninguna parte
  ctx.strokeStyle = '#c23a32'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x, y);
  for (let i = 1; i <= 6; i++) ctx.lineTo(x + i * 3.2, y + (i % 2 ? -4 : 4) + J(seed + i, 1));
  ctx.stroke();
  ctx.fillStyle = '#c23a32'; ctx.font = '12px "Patrick Hand", sans-serif'; ctx.textAlign = 'left'; ctx.fillText('¿?', x + 21, y + 4);
}
const addrOf = id => '0x' + (0x3a0 + id * 0x18).toString(16);

let paper = null;
function buildPaper() {
  paper = document.createElement('canvas'); paper.width = Math.round(LW * SC * DPR); paper.height = Math.round(LH * SC * DPR);
  const g = paper.getContext('2d'); g.scale(SC * DPR, SC * DPR);
  g.fillStyle = '#fbf8ef'; g.fillRect(0, 0, LW, LH);
  g.strokeStyle = '#c9dbeb'; g.lineWidth = 0.7;
  for (let x = 0; x <= LW; x += 12.5) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, LH); g.stroke(); }
  for (let y = 0; y <= LH; y += 12.5) { g.beginPath(); g.moveTo(0, y); g.lineTo(LW, y); g.stroke(); }
  g.strokeStyle = '#e0726a'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(MX, 0); g.lineTo(MX, LH); g.stroke();
  g.fillStyle = '#b6b0a6'; g.font = '13px "Patrick Hand", sans-serif'; g.textAlign = 'center';
  g.fillText('stack', MX / 2, LH - 8); g.fillText('heap', LW - 22, 12);
}

// posiciones de las variables: primero las de main, luego cada marco de función bajo su nombre
function varLayout() {
  const out = []; let y = 10;
  for (const v of M.globals) { out.push({ v, x: 5, y, frame: null }); y += 30; }
  for (const f of M.frames) {
    y += 2; out.push({ header: f.fn + '()', y }); y += 14;
    for (const v of f.locals) { out.push({ v, x: 5, y, frame: f }); y += 28; }
  }
  return out;
}
function drawVar(it) {
  const { v, x, y, frame } = it;
  ctx.save(); ctx.translate(x + PW / 2, y + PH / 2); ctx.rotate(-0.04 + (v.name.length % 3) * 0.02);
  ctx.fillStyle = frame ? '#e8f0ff' : '#ffe27a'; ctx.fillRect(-PW / 2, -PH / 2, PW, PH);
  ctx.strokeStyle = frame ? '#2350b8' : '#8a7420'; ctx.lineWidth = 1.1;
  if (frame) ctx.setLineDash([3, 2]);
  rRect(-PW / 2, -PH / 2, PW, PH, v.name.charCodeAt(0) * 7, 0.6);
  ctx.setLineDash([]);
  ctx.fillStyle = v.name === 'p' && !frame ? '#2350b8' : '#2e2c2a';
  ctx.font = (v.kind === 'int' ? '14px' : v.name.length > 4 ? '15px' : '17px') + ' "Patrick Hand", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(v.kind === 'int' ? `${v.name} = ${v.val}` : v.name, v.kind === 'int' ? 0 : -4, 1);
  ctx.restore();
  if (v.kind === 'ptr' || v.kind === 'list') { ctx.fillStyle = '#2e2c2a'; ctx.beginPath(); ctx.arc(x + PW - 5, y + PH / 2, 2.4, 0, 7); ctx.fill(); }
}
// caja Lista: [head | •], con su título encima
function drawList(L) {
  const x = L.x, y = L.y, l = x - NW / 2, Tp = y - NH / 2;
  ctx.fillStyle = '#f1f6ef'; ctx.fillRect(l, Tp, NW, NH);
  ctx.strokeStyle = '#2f6b45'; ctx.lineWidth = 1.8; rRect(l, Tp, NW, NH, 911);
  rLine(l + DW, Tp, l + DW, Tp + NH, 913, 0.6, 1);
  ctx.fillStyle = '#2f6b45'; ctx.font = '15px "Patrick Hand", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('head', l + DW / 2, y + 1);
  ctx.font = '11px "Patrick Hand", sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Lista', l, Tp - 7);
  if (L.head === null) { ctx.strokeStyle = '#2e2c2a'; ctx.lineWidth = 1.4; rLine(l + DW + 3, Tp + NH - 4, l + NW - 3, Tp + 4, 917, 0.5, 1); }
}
function drawNode(n) {
  const P = POS[n.id], x = P.x, y = P.y, L = x - NW / 2, Tp = y - NH / 2;
  ctx.save();
  if (n.dead) { ctx.globalAlpha = 0.28; ctx.setLineDash([4, 3]); }
  if (n.freed) { ctx.globalAlpha = 0.45; ctx.setLineDash([3, 3]); }
  const fl = FX.flash[n.id];
  ctx.fillStyle = fl ? (fl.ok ? '#e3f4e6' : '#f6ece0') : '#fffdf6'; ctx.fillRect(L, Tp, NW, NH);
  ctx.strokeStyle = '#2e2c2a'; ctx.lineWidth = 1.8;
  rRect(L, Tp, NW, NH, n.id * 17 + 3);
  rLine(L + DW, Tp, L + DW, Tp + NH, n.id * 17 + 9, 0.6, 1);
  ctx.setLineDash([]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (n.v === null) { ctx.fillStyle = '#c23a32'; ctx.font = '18px "Patrick Hand", sans-serif'; ctx.fillText('¿?', L + DW / 2, y + 1); }
  else { ctx.fillStyle = '#2e2c2a'; ctx.font = '22px "Patrick Hand", sans-serif'; ctx.fillText(String(n.v), L + DW / 2, y + 1); }
  ctx.fillStyle = '#2e2c2a';
  const d = { x: x + NW / 2 - (NW - DW) / 2, y };
  if (n.next === null) { ctx.lineWidth = 1.4; rLine(L + DW + 3, Tp + NH - 4, L + NW - 3, Tp + 4, n.id * 5 + 1, 0.5, 1); }
  else { ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, 7); ctx.fill(); }
  ctx.font = '10px "Cutive Mono", monospace'; ctx.fillStyle = '#9a948b'; ctx.textAlign = 'right';
  ctx.fillText(addrOf(n.id), L + NW, Tp + NH + 8);
  ctx.font = '13px "Patrick Hand", sans-serif'; ctx.textAlign = 'center';
  if (n.dead) { ctx.globalAlpha = 0.85; ctx.fillStyle = '#b7791f'; ctx.fillText('sin acceso', x, Tp - 7); }
  if (n.freed) { ctx.globalAlpha = 0.9; ctx.fillStyle = '#c23a32'; ctx.fillText('liberado', x, Tp - 7); }
  ctx.restore();
}

function draw(dt) {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  if (!paper) buildPaper();
  ctx.drawImage(paper, 0, 0, LW, LH);
  if (!M) return;
  const k = Math.min(1, dt * 9);
  for (const id of liveIds()) {
    const n = nodeOf(id);
    if (!POS[id]) POS[id] = { x: n.x, y: n.y };
    POS[id].x = lerp(POS[id].x, n.x, k); POS[id].y = lerp(POS[id].y, n.y, k);
  }
  const posNode = id => ({ x: POS[id].x, y: POS[id].y });
  const seenKeys = new Set();
  const layout = varLayout();
  // primero las cajas (listas, nodos y post-its) y encima las flechas, para que se vean nacer del punto
  for (const L of Object.values(M.lists)) drawList(L);
  for (const id of liveIds()) drawNode(nodeOf(id));
  drawTapHints(layout);
  for (const it of layout) if (it.v) drawVar(it);
  // flechas next
  for (const id of liveIds()) {
    const n = nodeOf(id), P = POS[id], a = { x: P.x + NW / 2 - (NW - DW) / 2, y: P.y };
    const key = 'n' + id;
    if (n.next === G) { if (!n.freed) drawGarbage(a.x + 2, a.y, id * 13); continue; }
    if (n.next === null || !nodeOf(n.next)) continue;
    seenKeys.add(key);
    AR[key] = lerpGeo(AR[key] || arrowGeo(a, { x: a.x, y: a.y }, { self: false }), nextGeo(a, id, n.next), k * 1.2);
    AR[key].a = a;
    ctx.globalAlpha = n.dead ? 0.25 : 1;
    const t = nodeOf(n.next);
    drawArrow(AR[key], id * 101 + 1, t.freed ? '#c23a32' : '#2e2c2a', 1.8, t.freed ? [4, 4] : null);
    ctx.globalAlpha = 1;
  }
  // head de cada lista
  for (const L of Object.values(M.lists)) {
    const a = { x: L.x + NW / 2 - (NW - DW) / 2, y: L.y }, key = 'l' + L.id;
    if (L.head === null || L.head === G || !nodeOf(L.head)) continue;
    seenKeys.add(key);
    AR[key] = lerpGeo(AR[key] || arrowGeo(a, { x: a.x, y: a.y }, {}), nextGeo(a, key, L.head), k * 1.2);
    AR[key].a = a;
    const t = nodeOf(L.head);
    drawArrow(AR[key], 777, t.freed ? '#c23a32' : '#2f6b45', 1.9, t.freed ? [4, 4] : null);
  }
  // variables
  let lane = 0;
  for (const it of layout) {
    if (it.header) {   // nombre de la función del marco, recortado al ancho del margen
      ctx.save(); ctx.beginPath(); ctx.rect(0, it.y - 2, MX - 3, 16); ctx.clip();
      ctx.fillStyle = '#2350b8'; ctx.font = '11px "Cutive Mono", monospace'; ctx.textAlign = 'left';
      const w = ctx.measureText(it.header).width;
      ctx.fillText(w > MX - 6 ? it.header.slice(0, Math.floor((MX - 14) / (w / it.header.length))) + '…' : it.header, 3, it.y + 9);
      ctx.restore(); continue;
    }
    const v = it.v; if (v.kind !== 'ptr' && v.kind !== 'list') continue;
    const a = { x: it.x + PW - 5, y: it.y + PH / 2 };   // la flecha nace en el puntito del post-it
    const key = 'v' + (it.frame ? it.frame.fn + M.frames.indexOf(it.frame) : '') + v.name;
    if (v.kind === 'list') {   // un Lista * apunta a la caja Lista
      if (v.t === null || !listOf(v.t)) { drawNull(a.x, a.y, 905); continue; }
      seenKeys.add(key);
      const L = listOf(v.t);
      const tgt = arrowGeo(a, { x: L.x, y: L.y }, { fromVar: true, toList: true, lane: ((lane++ % 3) - 1) * 5 });
      AR[key] = lerpGeo(AR[key] || { a: { ...a }, b: { ...a }, c1: { ...a }, c2: { ...a } }, tgt, k * 1.2);
      AR[key].a = a;
      drawArrow(AR[key], 333 + v.name.charCodeAt(0), it.frame ? '#2350b8' : '#2f6b45', 1.4, [5, 3]);
      continue;
    }
    if (v.t === null) { drawNull(a.x, a.y, v.name.charCodeAt(0) * 11 + 900); delete AR[key]; continue; }
    if (v.t === G || !nodeOf(v.t)) { drawGarbage(a.x, a.y, v.name.charCodeAt(0)); continue; }
    seenKeys.add(key);
    const tgt = arrowGeo(a, posNode(v.t), { fromVar: true, lane: ((lane++ % 3) - 1) * 6 });
    AR[key] = lerpGeo(AR[key] || { a: { ...a }, b: { ...a }, c1: { ...a }, c2: { ...a } }, tgt, k * 1.2);
    AR[key].a = a;
    const t = nodeOf(v.t);
    const col = t.freed ? '#c23a32' : it.frame ? '#2350b8' : v.name === 'p' ? '#2350b8' : '#5d574f';
    drawArrow(AR[key], v.name.charCodeAt(0) * 31 + 7, col, v.name === 'p' ? 1.7 : 1.3, t.freed ? [4, 4] : [5, 3]);
  }
  for (const key of Object.keys(AR)) if (!seenKeys.has(key)) delete AR[key];
  // el punto de origen va encima de su flecha
  ctx.fillStyle = '#2e2c2a';
  for (const id of liveIds()) { const n = nodeOf(id); if (n.next !== null && !n.dead) { const P = POS[id]; ctx.beginPath(); ctx.arc(P.x + NW / 2 - (NW - DW) / 2, P.y, 3, 0, 7); ctx.fill(); } }
  for (const it of layout) if (it.v && (it.v.kind === 'ptr' || it.v.kind === 'list')) { ctx.beginPath(); ctx.arc(it.x + PW - 5, it.y + PH / 2, 2.6, 0, 7); ctx.fill(); }
  for (const L of Object.values(M.lists)) if (L.head !== null) { ctx.beginPath(); ctx.arc(L.x + NW / 2 - (NW - DW) / 2, L.y, 3, 0, 7); ctx.fill(); }
}

/* ════════════════════════════════════════════════════════════════════
   8. SONIDO, TAMAÑO Y BUCLE
   ════════════════════════════════════════════════════════════════════ */
let AC = null;
function beep(f, d = 0.08, type = 'triangle', v = 0.05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

function fit() {
  const cell = $('cell').getBoundingClientRect();
  // el dibujo usa a lo más el 42 % del alto, y menos si el menú de abajo crece: el código siempre conserva unas líneas
  const free = innerHeight - document.querySelector('header').offsetHeight - document.querySelector('.build').offsetHeight - 110;
  const s = Math.max(0.4, Math.min((cell.width - 4) / LW, Math.min(innerHeight * (EX ? 0.34 : 0.4), free) / LH));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  if (Math.abs(s - SC) > 0.001 || cv.width !== Math.round(LW * s * DPR)) {
    SC = s;
    cv.style.width = LW * SC + 'px'; cv.style.height = LH * SC + 'px';
    cv.width = Math.round(LW * SC * DPR); cv.height = Math.round(LH * SC * DPR);
    paper = null;
  }
}
new ResizeObserver(fit).observe($('cell'));
addEventListener('resize', fit);
new ResizeObserver(fit).observe(document.querySelector('.build'));

/* ════════════════════════════════════════════════════════════════════
   9. TOCAR EL DIBUJO
   Tocar un puntero pone su expresión en la línea que se está armando:
   post-it → head · casilla next → head->next · cuerpo del nodo → su nombre (o su valor si el hueco es un número).
   Sin línea en curso, tocar un puntero empieza su asignación.
   ════════════════════════════════════════════════════════════════════ */
function hitTest(pt) {
  for (const it of varLayout()) if (it.v && it.v.kind !== 'int' && (!it.frame || it.frame === M.frames.at(-1)) && pt.x >= it.x - 2 && pt.x <= it.x + PW + 4 && pt.y >= it.y - 4 && pt.y <= it.y + PH + 4) return { kind: 'var', v: it.v };
  for (const L of Object.values(M.lists)) {
    const l = L.x - NW / 2, Tp = L.y - NH / 2;
    if (pt.y >= Tp - 6 && pt.y <= Tp + NH + 6 && pt.x >= l - 4 && pt.x <= l + NW + 6) return { kind: pt.x >= l + DW - 2 ? 'lhead' : 'list', lid: L.id };
  }
  const ids = liveIds().reverse();
  for (const id of ids) {
    const P = POS[id]; if (!P) continue;
    const L = P.x - NW / 2, Tp = P.y - NH / 2;
    if (pt.y < Tp - 6 || pt.y > Tp + NH + 6 || pt.x < L - 4 || pt.x > L + NW + 8) continue;
    return { kind: pt.x >= L + DW - 2 ? 'next' : 'node', id };
  }
  return null;
}
const holeType = () => BUILD && (HOLE.exec(BUILD) || [])[1];
/* Acceso realista: a un nodo solo se llega por un puntero.
   Se parte tocando el post-it de una variable y se avanza tocando la casilla next del nodo marcado.
   PATH guarda la expresión que se va armando (p, p->next, p->next->next…). */
let PATH = null;
function pathValue(expr) {   // a qué apunta la expresión, sin lanzar errores ({ list } si es la caja Lista)
  const parts = expr.split('->'); const base = parts.shift();
  const v = lookup(base); if (!v || (v.kind !== 'ptr' && v.kind !== 'list')) return undefined;
  let cur = v.t;
  if (v.kind === 'list') {
    if (cur === null || !listOf(cur)) return undefined;
    if (!parts.length) return { list: cur };
    if (parts.shift() !== 'head') return undefined;
    cur = listOf(cur).head;
  }
  for (const f of parts) { if (cur === null || cur === G || !nodeOf(cur) || nodeOf(cur).freed) return undefined; cur = nodeOf(cur).next; }
  return cur;
}
function hint(title, msg) { showFb('info', title, msg, [['Entendido', hideFb]]); }
function tapBoard(e) {
  if (BUSY || !$('ov').hidden) return;
  const r = cv.getBoundingClientRect();
  const pt = { x: (e.clientX - r.left) / r.width * LW, y: (e.clientY - r.top) / r.height * LH };
  const h = hitTest(pt); if (!h) return;
  const type = holeType();
  if (BUILD && type === 'new') return;
  hideFb();
  if (h.kind === 'var') {
    if (BUILD && type === 'num') return;
    tapFx(h);
    if (BUILD && type === 'var') { PATH = null; fill(h.v.name); return; }
    PATH = { expr: h.v.name }; renderBuilder(); return;
  }
  if (h.kind === 'list' || h.kind === 'lhead') {   // la caja Lista: se llega por el post-it que la apunta
    if (BUILD && (type === 'var' || type === 'num')) return;
    const cur = PATH ? pathValue(PATH.expr) : undefined;
    if (h.kind === 'lhead' && cur && cur.list === h.lid) { tapFx(h); PATH.expr += '->head'; renderBuilder(); return; }
    hint('Por un puntero', 'A la Lista también se llega por un puntero: toca el post-it que la apunta (por ejemplo l) y luego su casilla head.');
    return;
  }
  const n = nodeOf(h.id);
  if (h.kind === 'node') {
    if (BUILD && type === 'num' && n.v !== null && !n.dead) { tapFx(h); fill(String(n.v)); return; }
    hint('Por un puntero', 'En C no se toca un nodo directamente: se llega a él por un puntero. Toca el post-it de una variable y sigue las flechas tocando la casilla next de cada nodo.');
    return;
  }
  // casilla next
  if (BUILD && type === 'var') return;
  if (!PATH) { hint('Primero un puntero', 'Para llegar a esa casilla, parte tocando el post-it de una variable y sigue las flechas hasta ese nodo.'); return; }
  const cur = pathValue(PATH.expr);
  if (cur !== h.id) {
    hint(PATH.expr, cur === null ? `${PATH.expr} es NULL: no hay casilla next que seguir.` : cur && cur.list ? `${PATH.expr} apunta a una Lista: primero toca su casilla head.` : `Esa casilla no es la del nodo al que apunta ${PATH.expr}. Sigue las flechas: toca la casilla next del nodo marcado.`);
    return;
  }
  tapFx(h);
  PATH.expr += '->next'; renderBuilder();
}
function usePath() {
  const expr = PATH.expr; PATH = null;
  if (BUILD) { fill(expr); return; }
  renderBuilder();
}
function startFromPath(tpl) { const expr = PATH.expr; PATH = null; BUILD = tpl.replace('§e', expr); renderBuilder(); }
function renderPathBar(box) {
  const g = document.createElement('div'); g.className = 'grp';
  const val = pathValue(PATH.expr);
  const isList = val && val.list;
  if (BUILD) { if (!isList || holeType() === 'list') g.appendChild(mkChip('✓ usar ' + PATH.expr, 'fn', usePath)); }
  else if (!isList) {
    g.appendChild(mkChip(PATH.expr + ' = _;', 'fn', () => startFromPath('§e = §ptr;')));
    if (val !== null && val !== undefined && val !== G) g.appendChild(mkChip(PATH.expr + '->value = _;', 'fn', () => startFromPath('§e->value = §num;')));
  }
  const tail = PATH.expr.match(/->(next|head)$/);
  if (tail) g.appendChild(mkChip('⌫ quitar ->' + tail[1], '', () => { PATH.expr = PATH.expr.slice(0, -tail[0].length); renderBuilder(); }));
  g.appendChild(mkChip('✕', '', () => { PATH = null; renderBuilder(); }));
  box.appendChild(g);
  const tip = document.createElement('p'); tip.style.cssText = 'margin:0;font-size:14px;color:var(--soft)';
  tip.textContent = isList ? `${PATH.expr} apunta a una Lista: toca su casilla head para llegar al primer nodo.` : val === null ? `${PATH.expr} es NULL.` : val === G ? `${PATH.expr} es basura: no se puede seguir.` : 'Para seguir la flecha, toca la casilla next del nodo marcado en el dibujo.';
  box.appendChild(tip);
}
cv.addEventListener('click', tapBoard);
let TAP = null;
function tapFx(h) { TAP = { ...h, t: 1 }; beep(880, 0.04, 'triangle', 0.03); }
function drawTapHints(layout) {
  const type = holeType();
  const want = !BUSY && (!BUILD || type === 'ptr' || type === 'lv' || type === 'var' || type === 'num');
  const glow = (x, y, w, h, a) => { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#c9dbff'; ctx.fillRect(x - 3, y - 3, w + 6, h + 6); ctx.restore(); };
  const a = 0.35 + 0.2 * Math.sin(T * 5);
  if (PATH && !BUSY) {   // el nodo al que llega el camino, con su casilla next lista para seguir
    const id = pathValue(PATH.expr);
    if (id && id.list) {
      const L = listOf(id.list), l = L.x - NW / 2, Tp = L.y - NH / 2;
      ctx.save(); ctx.strokeStyle = '#2350b8'; ctx.lineWidth = 2.6; rRect(l - 4, Tp - 4, NW + 8, NH + 8, 448, 0.7); ctx.restore();
      glow(l + DW, Tp, NW - DW, NH, a + 0.15);
    } else if (id !== null && id !== undefined && id !== G && POS[id]) {
      const P = POS[id], L = P.x - NW / 2, Tp = P.y - NH / 2;
      ctx.save(); ctx.strokeStyle = '#2350b8'; ctx.lineWidth = 2.6; rRect(L - 4, Tp - 4, NW + 8, NH + 8, 447, 0.7); ctx.restore();
      if (nodeOf(id).next !== null) glow(L + DW, Tp, NW - DW, NH, a + 0.15);
    }
    for (const it of layout) if (it.v && it.v.kind !== 'int' && (!it.frame || it.frame === M.frames.at(-1))) glow(it.x, it.y, PW, PH, a * 0.6);
  } else if (want && BUILD) {
    if (type !== 'num') for (const it of layout) if (it.v && it.v.kind !== 'int' && (!it.frame || it.frame === M.frames.at(-1))) glow(it.x, it.y, PW, PH, a);
    if (type === 'num') for (const id of liveIds()) {
      const n = nodeOf(id), P = POS[id]; if (n.dead || n.freed || !P || n.v === null) continue;
      glow(P.x - NW / 2, P.y - NH / 2, DW, NH, a);
    }
  }
  if (TAP && TAP.t > 0) {
    TAP.t -= 0.05;
    ctx.save(); ctx.globalAlpha = TAP.t; ctx.strokeStyle = '#2350b8'; ctx.lineWidth = 2.5;
    if (TAP.kind === 'var') { const it = layout.find(o => o.v === TAP.v); if (it) rRect(it.x - 3, it.y - 3, PW + 6, PH + 6, 444, 0.6); }
    else if (TAP.lid && listOf(TAP.lid)) { const L = listOf(TAP.lid); rRect(L.x - NW / 2 + DW - 2, L.y - NH / 2 - 3, NW - DW + 5, NH + 6, 449, 0.6); }
    else if (POS[TAP.id]) { const P = POS[TAP.id], L = P.x - NW / 2, Tp = P.y - NH / 2; if (TAP.kind === 'next') rRect(L + DW - 2, Tp - 3, NW - DW + 5, NH + 6, 445, 0.6); else rRect(L - 3, Tp - 3, DW + 4, NH + 6, 446, 0.6); }
    ctx.restore();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  boil = REDUCED ? 0 : Math.floor(now / 220) % 5;
  for (const id in FX.flash) { FX.flash[id].t -= dt * 0.8; if (FX.flash[id].t <= 0) delete FX.flash[id]; }
  if (FX.shake) FX.shake = Math.max(0, FX.shake - dt);
  draw(dt);
  requestAnimationFrame(frame);
}
M = newMem();
fit(); renderCode(); renderBuilder();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { paper = null; });
requestAnimationFrame(frame);
// para pruebas y para el futuro modo teclado: ejecutar una línea escrita
window.ejecutar = run;
</script>
